name: CI

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev]
  # Manual re-run, on any ref. Added 2026-08-07 after a GitHub Actions outage
  # on 2026-08-06 swallowed the push event for 9dfb9e5 entirely: no run was
  # ever created, and with only `push` and `pull_request` triggers there was no
  # way to ask for one. That commit could not be CI-verified at all without
  # pushing an unrelated commit on top of it.
  #
  # An outage should not be able to leave a commit permanently unverifiable —
  # least of all the last commit before a release tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test-fast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra lint

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Guard platform-owner sentinel (only admin/platform_seed may write it)
        # PLATFORM-GLOBAL-SKILLS risk mitigation: any call that creates a
        # skill with owner_id == PLATFORM_OWNER_UID outside the seed module
        # re-introduces the exact class of bug M5 had to clean up (duplicate
        # rows with colliding names under different owners). Keep writes
        # centralized so the one-way "only the deploy seeds platform skills"
        # invariant is enforceable.
        #
        # Note: list_skills(owner_id=PLATFORM_OWNER_UID, ...) is a read filter
        # (list/query), not a write — those are explicitly excluded below.
        run: |
          set -e
          hits=$(grep -RnE 'owner_id\s*=\s*PLATFORM_OWNER_UID|owner_id\s*=\s*"aitana-platform"' \
            --include='*.py' \
            --exclude-dir='.venv' --exclude-dir='__pycache__' --exclude-dir='tests' \
            . \
            | grep -v 'admin/platform_seed.py' \
            | grep -v 'skills/platform.py' \
            | grep -vE 'list_skills\(\s*owner_id=PLATFORM_OWNER_UID' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Platform owner_id may only be set in backend/admin/platform_seed.py."
            echo "Offending lines:"
            echo "$hits"
            exit 1
          fi
          echo "Platform sentinel writes are confined to admin/platform_seed.py."

      - name: Test (fast only)
        # --ignore=tests/integration skips the folder at collection time.
        # Integration tests import app.py, which calls google.auth.default()
        # at module load — fine on Cloud Run / a dev laptop, fatal on a
        # GitHub runner with no ADC. The marker filter alone deselects
        # execution but still imports the test modules.
        # ADK_ARTIFACT_BUCKET is empty so tests use InMemoryArtifactService.
        env:
          ADK_ARTIFACT_BUCKET: ""
        run: uv run pytest tests/ --ignore=tests/integration -m "not slow" --tb=short -q

  local-mode-safety:
    name: LOCAL_MODE safety (no leaks in deployed configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refuse local-mode truthy leaks in cloudbuild / tf / workflows
        run: python3 scripts/check_local_mode_safety.py
      - name: Cloud Build single-dollar shell refs
        # Cloud Build resolves $NAME in a step script as a SUBSTITUTION before
        # bash sees it, so an unknown key kills the build at SUBMIT time —
        # comments included. The promote pipeline is the only path to prod and
        # runs rarely, so a bug planted there stays invisible while dev and test
        # stay green. Cost the first v0.1.9 promote attempt on 2026-08-04.
        run: pip install pyyaml -q && python3 scripts/check-cloudbuild-substitutions.py
      - name: Skill catalogue in sync with .claude/skills
        run: bash scripts/check-skill-catalogue.sh
      - name: Trust-card footgun gate (workspace elements)
        # P1.4: a workspace element that pushes state to the tutor
        # (useSimSnapshotPush) MUST also dispatch the visible "shared with the
        # AI" card (useHumanToolEvents), unless it's a no-card shape (sends a
        # real turn / read-only). Shipped-then-fixed for the calculator + table;
        # this makes a dropped card fail the build instead of a human's memory.
        run: bash scripts/audit-trust-cards.sh
      - name: Brand-drift gate (no hardcoded red-* on brand surfaces)
        # 1.1.74: the app shipped two brand primaries for months — --primary was
        # the inherited Sunholo orange while /project hardcoded KU red, so the
        # homepage CTA and /project's CTA were different colours under the same
        # KU coat-of-arms. Semantic reds (error, recording) are allowlisted with
        # reasons in the script.
        run: bash scripts/check-brand-literals.sh
      - name: Home-screen icons are opaque
        # 2026-08-14: the PWA shipped with apple-touch-icon cut from the ROUNDED
        # mark, so its corners were rgba(0,0,0,0). iOS applies its own rounding
        # and, given transparency, renders a blank tile — found only when a real
        # iPhone added it to the home screen. Nothing else in CI can see inside
        # a PNG. Regenerate with `make pwa-icons`.
        run: node scripts/check-pwa-icons.mjs
      - name: Published guides link back into the app
        # 1.1.74: Quarto's self-contained HTML has zero in-app links, so a guide
        # opened from /guides was a dead end — and it is the first surface a new
        # teacher is pointed at. publish-guides.sh injects the band; this
        # asserts a re-render did not drop it.
        run: scripts/inject-guide-nav.py --check frontend/public/guides

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # vitest 4 + vite 6 + next 15 need Node >= 20.19; jump to 22 LTS so
          # we stop tracking 20.x drift on the runner.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck
        run: npm run quality:check:fast

      - name: Test
        run: CI=true npm run test:run

  sim-bridge:
    # Per docs/design/aipla/v1.1.0-feedback/shared-mcp-app-bridge.md
    # Drift guard: every artefact inlines ONE canonical MCP App guest bridge
    # (bridge/aipla-mcp-bridge.js). Fail if any inlined copy diverged from the
    # source (i.e. someone hand-edited an artefact's bridge instead of editing
    # the source + `make sim-build`). Also runs the sandbox vitest, which
    # includes the bridge's dual-channel (postMessage + window.openai) tests.
    name: Sim bridge (drift guard + sandbox tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/mcp-sandbox/package-lock.json

      - name: Bridge drift guard (no artefact hand-edited its bridge)
        run: node scripts/build-artefact-bridge.mjs --check

      - name: Broadcast guard (every interactive sim has a labelled commit)
        run: node scripts/check-artefact-broadcast.mjs

      - name: Sandbox tests (bridge dual-channel + serve)
        working-directory: infrastructure/mcp-sandbox
        run: |
          npm ci
          npm run build   # serve.test.ts reads public/sandbox.html (a build output, gitignored)
          npm run test
          npm run lint

  security-audit:
    # Per docs/design/aipla/v1.1.0-feedback/security-monitoring-pipeline.md
    # Layer 1: fails PRs on new HIGH/CRITICAL CVEs in production deps across
    # frontend npm, sandbox npm, and backend Python. Runs in parallel with the
    # frontend/backend jobs; bar is "this could be a real issue in production",
    # not "any CVE in the dep tree" — dev-only deps are caught by the weekly
    # cron (.github/workflows/security-weekly.yml), not the merge-block.
    name: Security audit (deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python (for uv)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run security check (frontend + sandbox + backend)
        run: scripts/security-check.sh

  seed-reminder:
    # SKILL.md frontmatter (avatar, multimodalInput, persona, tools,
    # accessControl, instructions) does NOT propagate to Firestore for
    # already-registered skills just because an image shipped — something has
    # to run the seed.
    #
    # Since P1.3 (2026-07-23) that is automatic on deploy via the
    # aipla-seed-skills Cloud Run job, and since 2026-08-04 on the PROMOTE path
    # too (prod is reached only by promote, and had not been re-seeded since its
    # env cut). So this job is now belt-and-braces rather than the only guard:
    # it still warns the moment a template changes, which covers the case where
    # a template edit lands without a deploy. Warning-only: never fails the build.
    name: Seed reminder (SKILL.md → Firestore)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn when SKILL.md templates changed
        run: |
          set -e
          base="${{ github.event.before }}"
          # First push to a branch / force-push can yield an all-zero base;
          # fall back to the parent of HEAD so the diff still resolves.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${{ github.sha }}^"
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- 'backend/skills/templates/**/SKILL.md' || true)
          if [ -n "$changed" ]; then
            echo "::warning title=Run seed-platform-skills::SKILL.md template(s) changed in this push. After the deploy finishes, run  make seed ENV=dev  (= scripts/seed-platform-skills.sh dev). A code deploy does NOT propagate SKILL.md→Firestore for already-registered skills."
            echo "Changed templates:"
            echo "$changed"
          else
            echo "No SKILL.md template changes in this push — no seed needed."
          fi
