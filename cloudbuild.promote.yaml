# cloudbuild.promote.yaml — build-once artifact promotion (copy→prod).
#
# Runs in the TARGET project. Promotes a released ${_VERSION} from
# ${_SOURCE_PROJECT} by COPYING the tested backend image (no rebuild) and
# rebuilding ONLY the frontend from the same tagged source with the target
# env's config. See docs/design/aipla/v1.0.0-pilot/build-once-artifact-promotion.md.
#
# Invoked by `scripts/promote-env.sh` → `gcloud builds triggers run
# aipla-prod-promote --tag=vX.Y.Z`. Running it as a TRIGGER (not `builds submit`)
# is the point: Cloud Build checks the repo out AT THE TAG, so the frontend is
# rebuilt from tagged source rather than from whatever happens to be on the
# operator's laptop. Same mechanism as sunholo-data/docparse `release.sh promote`.
# NO ci-gate: the artifact is frozen and was gated at the test build.
#
# STATUS: VALIDATED 2026-07-30 — v0.1.3 promoted test→prod; prod runs
# backend@sha256:b3554d99…, byte-identical to test's backend:v0.1.3. The first
# real run found three latent bugs (see docs/ops/runbooks/prod-cut.md step 6);
# it had been committed and documented for six weeks without ever executing.
# The deploy step assumes the target service already exists with its
# env/secrets set (created at env-cut), so promotion only swaps images.

substitutions:
  _SOURCE_PROJECT: terraform_managed   # e.g. aipla-test-2026 (promote FROM)
  _TARGET_PROJECT: terraform_managed   # e.g. aipla-prod-2026 (this build's project)
  _VERSION: ''                         # release tag, e.g. v1.1.40 (required)
  _REGION: europe-north1
  _REPO: cphu
  _SERVICE_NAME: aipla-v01-frontend
  # Frontend rebuild needs the target env's baked-in config. Terraform-managed
  # per target trigger; defaults keep `gcloud builds submit` sane for testing.
  _MCP_SANDBOX_URL: 'https://aipla-v01-sandbox-wgwhd7mspa-lz.a.run.app/sandbox.html'
  # The target env's own public origin, advertised to external MCP hosts as the
  # sims' widget domain. MUST be re-stamped on every promote, like APP_VERSION:
  # `services update` preserves existing env vars, so prod kept whatever it was
  # first deployed with — and until 2026-08-04 cloudbuild.yaml hardcoded the DEV
  # url for every env. Result: prod told ChatGPT to render its sims under dev's
  # origin, and no promote could ever fix it because no promote set the var.
  # No default: the guard below fails the build rather than let a promote stamp
  # a wrong origin onto the target.
  _MCP_WIDGET_DOMAIN: ''
  # Preview feature flags. These are NEXT_PUBLIC_*, i.e. inlined into the bundle
  # at BUILD time — and the promote REBUILDS the frontend, so it must pass them
  # exactly as cloudbuild.yaml does. Until 2026-08-04 it did not: `build-frontend`
  # below passed only _MCP_SANDBOX_URL, so no value of `preview_feature_flags` in
  # prod.tfvars could reach prod's bundle. The "AIPLA Hjælp" help co-pilot was
  # therefore unreachable on prod by ANY route, and flipping the tfvar would have
  # looked like it worked (test lit up; prod silently didn't).
  # This is the same rule the deploy step states for env vars, extended to build
  # args: anything cloudbuild.yaml bakes per-env, the promote path must bake too.
  _AUTHORING_COPILOT: '1'
  _CONCEPT_MAP: '1'
  _AIPLA_HELP: '1'
  # Runtime SA the post-promote seed job runs as (writes Firestore via ADC).
  _ADMIN_SEED_ALLOWED_SAS: terraform_managed

tags: ['${_TARGET_PROJECT}', '${_SERVICE_NAME}', 'promote']

options:
  logging: GCS_ONLY
logsBucket: gs://${_TARGET_PROJECT}-cloudbuild-logs

steps:
  # --- Guard: a version is mandatory (a promote without a frozen tag is a rebuild) ---
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'guard-version'
    waitFor: ['-']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -z "${_VERSION}" ]; then echo "FATAL: _VERSION is required"; exit 1; fi
        # A promote that can't name the target's own origin would stamp an empty
        # (or another env's) widget domain onto it. Refuse rather than guess —
        # this is the variable prod was silently wrong on for two months.
        if [ -z "${_MCP_WIDGET_DOMAIN}" ]; then
          echo "FATAL: _MCP_WIDGET_DOMAIN is required (terraform sets it from var.frontend_url)"; exit 1
        fi
        echo "Promoting ${_VERSION}: ${_SOURCE_PROJECT} -> ${_TARGET_PROJECT}"
        echo "Target widget domain: ${_MCP_WIDGET_DOMAIN}"

  # --- Backend: COPY the tested image by digest (no rebuild) ---
  # NOTE (2026-07-30): this step used `gcloud artifacts docker images copy`,
  # which does not exist — not in the cloud-builders gcloud, not in SDK 557.
  # `gcloud artifacts docker images` offers only delete/describe/get-operation/
  # list/list-vulnerabilities/scan. The pipeline had never been run (the prod cut
  # used the tag-build path), so the invalid command sat here undetected until
  # the first real promote.
  #
  # Replaced with crane, which copies by DIGEST registry-to-registry without
  # pulling layers to local disk — the right tool for "same bytes, new home",
  # and materially faster than docker pull/tag/push for a multi-hundred-MB image.
  # --- Guard: the source release must actually exist before anything moves ---
  # A tag fires `aipla-test-release` and `aipla-prod-promote-on-tag` at the same
  # instant, and the prod one waits for approval. Approve before test has
  # finished publishing and the copy below has nothing to copy. Fail here, with
  # a sentence that says what to do, rather than deep in a crane error.
  - name: 'gcr.io/go-containerregistry/crane:debug'
    id: 'guard-source-image'
    waitFor: ['guard-version']
    entrypoint: sh
    args:
      - '-c'
      - |
        set -eu
        SRC="${_REGION}-docker.pkg.dev/${_SOURCE_PROJECT}/${_REPO}/${_SERVICE_NAME}/backend:${_VERSION}"
        if ! crane digest "$$SRC" >/dev/null 2>&1; then
          echo "FATAL: ${_SOURCE_PROJECT} has not published ${_VERSION} yet." >&2
          echo "  $$SRC does not exist." >&2
          echo "  Wait for the aipla-test-release build of ${_VERSION} to go green, then re-run." >&2
          exit 1
        fi
        echo "Source release ${_VERSION} present in ${_SOURCE_PROJECT}."

  - name: 'gcr.io/go-containerregistry/crane:debug'
    id: 'copy-backend'
    waitFor: ['guard-source-image']
    entrypoint: sh
    args:
      - '-c'
      - |
        set -eu
        SRC="${_REGION}-docker.pkg.dev/${_SOURCE_PROJECT}/${_REPO}/${_SERVICE_NAME}/backend:${_VERSION}"
        DST="${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/${_REPO}/${_SERVICE_NAME}/backend:${_VERSION}"
        # Resolve the source digest FIRST: it is the promotion's identity, and
        # the deploy step pins the backend by digest, never by tag.
        DIGEST=$(crane digest "$$SRC")
        echo "Copying tested backend $$SRC ($$DIGEST) -> $$DST"
        crane copy "$$SRC" "$$DST"
        # Prove the bytes survived the hop — a copy that silently retagged
        # something else would otherwise deploy unverified code to prod.
        DST_DIGEST=$(crane digest "$$DST")
        if [ "$$DIGEST" != "$$DST_DIGEST" ]; then
          echo "FATAL: digest changed in transit ($$DIGEST -> $$DST_DIGEST)" >&2
          exit 1
        fi
        echo "$$DIGEST" > /workspace/backend_digest

  # --- Frontend: REBUILD from the tagged source with TARGET env config ---
  # (NEXT_PUBLIC_* is compile-time-inlined and env-specific, so the frontend
  #  cannot be copied — it is rebuilt from the same immutable tag. See the doc.)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-firebase-config'
    # Waits on the SOURCE-IMAGE guard, not just guard-version: no point building
    # and pushing a prod `ui:vX.Y.Z` for a release whose backend was never
    # published. The guard is one registry lookup, so the serialisation is free.
    waitFor: ['guard-source-image']
    entrypoint: 'bash'
    args: ['./get-firebase-config.sh']
    env: ['_PROJECT_ID=${_TARGET_PROJECT}']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['get-firebase-config']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ARGS=$$(cat /workspace/docker_args)
        docker build $$ARGS \
          --build-arg NEXT_PUBLIC_MCP_SANDBOX_URL=${_MCP_SANDBOX_URL} \
          --build-arg NEXT_PUBLIC_AUTHORING_COPILOT=${_AUTHORING_COPILOT} \
          --build-arg NEXT_PUBLIC_CONCEPT_MAP=${_CONCEPT_MAP} \
          --build-arg NEXT_PUBLIC_AIPLA_HELP=${_AIPLA_HELP} \
          -t ${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/${_REPO}/${_SERVICE_NAME}/ui:${_VERSION} \
          -f frontend/Dockerfile frontend/
        # ^ Mirrors cloudbuild.yaml's build-frontend arg-for-arg. Both expand the
        # docker_args file (the NEXT_PUBLIC_* lines lifted out of the FIREBASE_ENV
        # secret by get-firebase-config.sh) FIRST, so an explicit flag here wins
        # on a duplicate — keep it that way, or the two paths resolve the same
        # flag differently and prod diverges from test for reasons nobody can see.
        #
        # Do NOT write a single-dollar variable reference anywhere in this block,
        # comments included: Cloud Build resolves those as substitutions before
        # bash ever sees the script, and an unknown key fails the whole build with
        # "key in the template is not a valid built-in substitution". Shell
        # variables need a doubled dollar. A COMMENT naming the args variable
        # broke the first v0.1.9 promote attempt this way.

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args: ['push', '${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/${_REPO}/${_SERVICE_NAME}/ui:${_VERSION}']

  # --- Deploy: swap both images on the EXISTING target service ---
  # `services update` preserves env vars / secrets / volumes set at env-cut;
  # promotion changes only the running images. Backend pinned by digest.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['copy-backend', 'push-frontend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        DIGEST=$$(cat /workspace/backend_digest)
        gcloud run services update ${_SERVICE_NAME} \
          --project=${_TARGET_PROJECT} --region=${_REGION} \
          --container=main \
          --image=${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/${_REPO}/${_SERVICE_NAME}/ui:${_VERSION} \
          --container=sidecar \
          --image=${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/${_REPO}/${_SERVICE_NAME}/backend@$$DIGEST \
          --update-env-vars=APP_VERSION=${_VERSION},MCP_WIDGET_DOMAIN=${_MCP_WIDGET_DOMAIN}
        # ^ Both must be re-stamped on the PROMOTED revision, for the same
        # reason. APP_VERSION: the backend image is copied from test, where it
        # was deployed with test's build value, so a promote that swapped images
        # without this would leave prod reporting the wrong version on every
        # chat-log row. MCP_WIDGET_DOMAIN: `services update` PRESERVES env vars,
        # so the target keeps whatever it was first deployed with — prod was
        # advertising dev's origin to external MCP hosts from its env-cut until
        # 2026-08-04, and every promote silently carried it forward.
        # --update-env-vars (not --set-env-vars) so the rest of the env survives.
        #
        # Rule of thumb for anything added here later: if cloudbuild.yaml sets it
        # with --set-env-vars from a per-env substitution, the promote path MUST
        # re-stamp it too, or prod diverges permanently from its own config.

  # --- Smoke: fail the promotion if the target isn't healthy ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke'
    waitFor: ['deploy']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_TARGET_PROJECT} --region=${_REGION} --format='value(status.url)')
        echo "Smoking $${URL}"
        fail=0
        for path in "/" "/api/health" "/api/proxy/health" "/api/proxy/api/skills/marketplace"; do
          code=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$${URL}$${path}") || code=000
          if [ "$${code}" = "200" ]; then echo "OK   $${path} -> 200"; else echo "FAIL $${path} -> $${code}"; fail=1; fi
        done
        for path in "/api/proxy/api/skills" "/api/proxy/api/auth/whoami"; do
          code=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$${URL}$${path}") || code=000
          if [ "$${code}" = "401" ]; then echo "OK   $${path} -> 401"; else echo "FAIL $${path} -> $${code} (expected 401)"; fail=1; fi
        done
        exit $${fail}

  # --- Seed: reconcile SKILL.md templates -> Firestore on the TARGET ---
  # The twin of cloudbuild.yaml's `seed-platform-skills` step, and it was missing
  # here until 2026-08-04. Consequence: prod is reached ONLY by this pipeline
  # (aipla-prod-release is disabled), so prod's skill docs had not been
  # reconciled since its env cut on 2026-07-28 — every SKILL.md edit since then
  # existed in the image but not in the Firestore the app reads. That is the
  # repo's documented #1 footgun, "enforced" on the deploy path and wide open on
  # the promote path.
  #
  # Runs the same Cloud Run job, as the same runtime SA, off the backend image
  # THIS promote just copied into the target (tagged ${_VERSION} by copy-backend)
  # — so the seed and the running code are the same artifact by construction.
  # `python -m admin.platform_seed` exits non-zero on any failed template, so a
  # bad seed fails the promotion.
  #
  # After smoke, matching cloudbuild.yaml's ordering: the smoke checks are
  # liveness, not skill content, and a seed failure should not mask a service
  # that never came up.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'seed-platform-skills'
    waitFor: ['smoke']
    entrypoint: bash
    args:
      - 'scripts/deploy-seed-job.sh'
      - '--project=${_TARGET_PROJECT}'
      - '--region=${_REGION}'
      - '--sa=${_ADMIN_SEED_ALLOWED_SAS}'
      - '--image=${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/${_REPO}/${_SERVICE_NAME}/backend:${_VERSION}'
      - '--execute'
