# AIPLA -- Cloud Build configuration (forked from AI Protocol Platform v6)
# Branch-based deployment: dev -> aipla-dev-2026, test -> aipla-test-2026, prod -> aipla-prod-2026
# Multi-container Cloud Run: frontend (main container) + backend (sidecar)
# (Note: "main container" below refers to the multi-container Cloud Run primary, not a branch.)
#
# Substitutions are managed by Terraform (see infrastructure repo)

substitutions:
  _SERVICE_NAME: aipla-v01-frontend
  _REGION: terraform_managed
  _BUILD_FOLDER: .
  _ARTIFACT_REGISTRY_REPO_URL_CLIENT: terraform_managed
  _PROJECT_ID: terraform_managed
  _FIREBASE_BUCKET: '${_PROJECT_ID}.firebasestorage.app'
  _CONFIG_BUCKET: terraform_managed
  # Firebase helper image is built by v5's trigger-dev-firebase and tagged per-env
  # (dev/test/prod), not per-branch. AIPLA dev branch -> dev env; test/prod triggers override.
  _FIREBASE_TAG: dev
  # Admin seed allowlist — SA emails permitted to call
  # /api/admin/seed-platform-skills. Terraform-managed per env.
  _ADMIN_SEED_ALLOWED_SAS: terraform_managed
  # Sprint 1.7 M4: separate-origin sandbox proxy URL for MCP App
  # iframes. Baked into the Next.js bundle at build time
  # (NEXT_PUBLIC_*). Defaults to the dev sandbox URL so this trigger
  # ships sensibly even without a terraform substitution; test/prod
  # override per env.
  # AIPLA sandbox URL (sprint 2026-05-21). Cloud Run *.run.app URL,
  # europe-north1. Pinned to /sandbox.html for the MCPAppToolCallRouter
  # iframe shell; static artefacts are reached separately at
  # ${origin}/artefacts/<name>/v<version>/index.html.
  _MCP_SANDBOX_URL: 'https://aipla-v01-sandbox-wgwhd7mspa-lz.a.run.app/sandbox.html'
  # 1.G-Ph2 (teacher UI Phase 2) — when set to '1', bakes the
  # NEXT_PUBLIC_TEACHER_MOCK flag into the bundle so the deployed dev
  # URL renders the /teacher/* mockup without requiring Firebase
  # teacher auth (which doesn't land until Phase 3). Leave empty on
  # test / prod triggers; only the dev trigger overrides this to '1'.
  # Removable once Phase 3 swaps in the real Firebase teacher auth.
  _TEACHER_MOCK: ''

tags: ['${_PROJECT_ID}', '${_SERVICE_NAME}']

options:
  logging: GCS_ONLY
logsBucket: gs://${_PROJECT_ID}-cloudbuild-logs

steps:
  # --- Firebase rules ---
  # AIPLA v0.1 swaps the inherited sunholo-llmops/firebase helper image
  # (built by v5's separate trigger-dev-firebase Cloud Build trigger,
  # which doesn't exist on aipla-dev-2026) for a public node base +
  # on-the-fly firebase-tools install. ~30-60s slower per build but
  # zero infrastructure dependency. Tracked in docs/upstream-feedback.md
  # entry 13.
  - name: 'node:20-alpine'
    waitFor: ['-']
    id: 'deploy-firebase-rules'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g firebase-tools@13 &&
        firebase -P ${_PROJECT_ID} --json deploy --only firestore:rules,firestore:indexes --force

  # --- Get Firebase config from Secret Manager ---
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-firebase-config'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - './get-firebase-config.sh'
    env:
      - '_PROJECT_ID=$_PROJECT_ID'

  # --- Build frontend ---
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    waitFor: ['get-firebase-config']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ARGS=$$(cat /workspace/docker_args)
        docker build $$ARGS \
          --build-arg NEXT_PUBLIC_MCP_SANDBOX_URL=${_MCP_SANDBOX_URL} \
          --build-arg NEXT_PUBLIC_POST_JOIN_REDIRECT=/chat/@aipla-platform/problem-set-hints \
          --build-arg NEXT_PUBLIC_TEACHER_MOCK=${_TEACHER_MOCK} \
          -t ${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/ui:${BRANCH_NAME} \
          -f frontend/Dockerfile \
          frontend/

  # --- Build backend ---
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    waitFor: ['-']
    dir: ${_BUILD_FOLDER}/backend
    args:
      - 'build'
      - '--build-arg'
      - 'FIREBASE_BUCKET=${_FIREBASE_BUCKET}'
      - '--build-arg'
      - 'GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}'
      - '--build-arg'
      - 'GOOGLE_CLOUD_LOCATION=${_REGION}'
      - '-t'
      - '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/backend:${BRANCH_NAME}'
      - '.'

  # --- Push images ---
  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: ['build-frontend']
    args: ['push', '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/ui:${BRANCH_NAME}']

  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: ['build-backend']
    args: ['push', '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/backend:${BRANCH_NAME}']

  # --- Deploy to Cloud Run (multi-container) ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['push-frontend', 'push-backend']
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--region=${_REGION}'
      - '--project=${_PROJECT_ID}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--max-instances=3'
      - '--session-affinity'
      # AIPLA v0.1 — both containers run as the dedicated runtime SA
      # (which has roles/aiplatform.user for Vertex calls, storage.admin
      # on the config + runtime buckets, secret accessor for the
      # GROUP_AUTH_SIGNING_SECRET, etc.). Without this Cloud Run falls
      # back to compute-default, which we deliberately don't grant.
      - '--service-account=${_ADMIN_SEED_ALLOWED_SAS}'
      - '--add-volume'
      - 'name=gcs_config,type=cloud-storage,bucket=${_CONFIG_BUCKET},readonly=true'
      # Frontend (main container)
      - '--container=main'
      - '--image=${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/ui:${BRANCH_NAME}'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=1'
      # Frontend -> sidecar over shared network namespace. Sidecar listens on
      # 1956 (pinned in backend/Dockerfile). DO NOT use 8080 here — that is the
      # frontend's own ingress port.
      # Use 127.0.0.1 (not localhost) — v5 pattern. Node's DNS can resolve
      # "localhost" to ::1 (IPv6) while uvicorn binds 0.0.0.0 (IPv4), producing
      # silent fetch-failed errors. 127.0.0.1 skips DNS entirely.
      - '--set-env-vars=BACKEND_URL=http://127.0.0.1:1956'
      # Backend (sidecar container)
      - '--container=sidecar'
      - '--image=${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/backend:${BRANCH_NAME}'
      - '--add-volume-mount'
      - 'volume=gcs_config,mount-path=/gcs_config'
      - '--memory=4Gi'
      - '--cpu=2'
      # Without an explicit startup probe, Cloud Run marks the sidecar healthy
      # instantly and frontend requests can hit the proxy before uvicorn has
      # finished its (heavy, ADK-laden) import. TCP probe on 1956 forces
      # Cloud Run to actually wait for the listener AND drives CPU to the
      # sidecar during startup (request-based billing otherwise throttles it).
      - '--startup-probe=tcpSocket.port=1956,periodSeconds=5,failureThreshold=24,timeoutSeconds=5'
      # AIPLA v0.1: zero third-party API secrets needed. Vertex AI auth
      # via ADC (the aipla-v6@ runtime SA has roles/aiplatform.user).
      # The inherited template wired Anthropic + Telegram + Twilio +
      # Mailgun secrets here; all stripped for v0.1 (none of those
      # channels ship in the Jutland demo). Channel skills land in
      # v1.0.0-pilot per SEQUENCE.md and will re-introduce secrets
      # only as each channel is wired.
      # Group-auth signing secret (Firestore-backed group state needs
      # a stable HMAC secret across containers — see
      # backend/auth/group_id_auth.py and docs/upstream-feedback.md
      # entry 16).
      - '--set-secrets=GROUP_AUTH_SIGNING_SECRET=GROUP_AUTH_SIGNING_SECRET:latest'
      # Env vars
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}'
      # AIPLA v0.1: gemini-3.5-flash is GA only on `global` endpoint
      # (Resolved Decision 1 in jutland-demo.md). europe-north1 returns
      # 404 for the model. Switch back to ${_REGION} when europe-north1
      # rollout completes — Open Question 3.
      - '--set-env-vars=GOOGLE_CLOUD_LOCATION=global'
      - '--set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=True'
      # v6 ADK service backends — AIPLA v0.1 runs ADK on Cloud Run directly
      # (not Agent Engine), so AGENT_ENGINE_ID is omitted. v1.0.0-pilot may
      # reintroduce it if Agent Engine becomes preferable for the teacher
      # pilot rollout — see SEQUENCE.md 1.4 model-router-aipla-config.
      - '--set-env-vars=ADK_ARTIFACT_BUCKET=${_PROJECT_ID}-artifacts'
      - '--set-env-vars=LOGS_BUCKET_NAME=${_PROJECT_ID}-aipla-v01-logs'
      # v6 observability
      - '--set-env-vars=GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true'
      - '--set-env-vars=OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true'
      # Admin seed allowlist (Cloud Build SA must be in this list).
      - '--set-env-vars=ADMIN_SEED_ALLOWED_SAS=${_ADMIN_SEED_ALLOWED_SAS}'
      # AIPLA-branded platform-owner namespace. URLs become
      # /chat/@aipla-platform/<slug>. Override of the upstream-template
      # default "aitana-platform" — see backend/skills/platform.py.
      - '--set-env-vars=PLATFORM_OWNER_UID=aipla-platform'
      - '--set-env-vars=PLATFORM_OWNER_EMAIL=platform@aipla.dev'

  # --- Post-deploy smoke: fail the build if any critical endpoint is not 200 ---
  # Per CLAUDE.md: no feature lands with manual-only verification. This step
  # protects against sidecar-silently-not-running bugs like FE-BRINGUP-1
  # (see docs/ops/deployed-urls.md for background).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: smoke-deployed
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        echo "Smoking $${URL}"
        fail=0
        # Public endpoints — expect 200
        for path in "/" "/api/health" "/api/proxy/health" "/api/proxy/api/skills/marketplace"; do
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$${URL}$${path}") || code=000
          body=$(head -c 200 /tmp/body)
          if [ "$${code}" = "200" ]; then
            echo "OK   $${path} -> 200"
          else
            echo "FAIL $${path} -> $${code} body=$${body}"
            fail=1
          fi
        done
        # Auth-protected — expect 401 without token (not Next 404 — FE-BRINGUP-1 guard)
        for path in "/api/proxy/api/skills" "/api/proxy/api/auth/whoami"; do
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$${URL}$${path}") || code=000
          body=$(head -c 200 /tmp/body)
          if [ "$${code}" = "401" ]; then
            echo "OK   $${path} -> 401 (auth required)"
          else
            echo "FAIL $${path} -> $${code} (expected 401) body=$${body}"
            fail=1
          fi
        done
        exit $${fail}

  # --- Non-fatal platform-skill seed (via sidecar proxy). Idempotent.
  # Hits the frontend's /api/proxy/api/admin/seed-platform-skills which
  # forwards Authorization untouched to the backend sidecar. Never fails
  # the build — a seed hiccup is not worth blocking a good deploy.
  # Docs: docs/ops/platform-skills.md
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: seed-platform-skills
    waitFor: ['smoke-deployed']
    entrypoint: bash
    args:
      - '-c'
      - |
        set +e
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        # Cloud Build under a user-managed SA (aipla-v6@) cannot use
        # `gcloud auth print-identity-token --audiences=` — it returns
        # "No identity token can be obtained from the current credentials".
        # The metadata server path works because the Cloud Build VM has
        # the user-managed SA attached, so the metadata server can mint
        # an ID token with an explicit audience.
        # CRITICAL: include_email=true is required. Without it the
        # minted token has NO email claim — only aud/azp/iat/iss/sub —
        # and the backend's allowlist check (looks at claims["email"])
        # produces a 403 "Not authorized" silently. Discovered 2026-05-20
        # by decoding the impersonated token after the metadata-server
        # fix returned 0 skills seeded.
        # Mint an ID token signed for the trigger's user-managed SA
        # (aipla-v6@…). The build container's metadata-server path
        # doesn't expose that SA — both `default/identity` and an
        # explicit-email path return the error string "please provide
        # a user-specified service account". Instead, ask gcloud to
        # mint the token directly via iamcredentials.googleapis.com
        # using the build's active credentials (which IS aipla-v6@
        # because the trigger has serviceAccount set).
        # Requires aipla-v6@ to have roles/iam.serviceAccountTokenCreator
        # on itself — already bound at bootstrap (see
        # scripts/bootstrap-aipla-dev.sh:ensure_cb_service_agent).
        # Discovered 2026-05-25 after metadata-server paths kept
        # 403'ing through builds e8532153 / 11b5c6a0 / faed2832 /
        # 7bc7eb6c with MalformedError: "Wrong number of segments".
        TOKEN=$(gcloud iam service-accounts generate-id-token \
          "${_ADMIN_SEED_ALLOWED_SAS}" \
          --audiences="$${URL}" \
          --include-email 2>/dev/null)
        code=$(curl -sS -o /tmp/seed -w '%{http_code}' --max-time 60 \
          -X POST -H "Authorization: Bearer $${TOKEN}" \
          "$${URL}/api/proxy/api/admin/seed-platform-skills") || code=000
        body=$(head -c 300 /tmp/seed)
        echo "seed-platform-skills -> $${code} body=$${body}"
        exit 0

  # --- Non-fatal demo-codes upsert. Idempotent.
  # Guarantees three known group codes are alive for the next 30 days
  # so demo team members can always join /group without an admin minting
  # a fresh code each week. Same auth pattern as seed-platform-skills;
  # never fails the build (a hiccup here means the team mints manually).
  # Each code's TTL is refreshed to 30 days from "now" on every deploy.
  # Output line includes the codes so you can copy from the build log.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: upsert-demo-codes
    waitFor: ['seed-platform-skills']
    entrypoint: bash
    args:
      - '-c'
      - |
        set +e
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        # Mint an ID token signed for the trigger's user-managed SA
        # (aipla-v6@…). The build container's metadata-server path
        # doesn't expose that SA — both `default/identity` and an
        # explicit-email path return the error string "please provide
        # a user-specified service account". Instead, ask gcloud to
        # mint the token directly via iamcredentials.googleapis.com
        # using the build's active credentials (which IS aipla-v6@
        # because the trigger has serviceAccount set).
        # Requires aipla-v6@ to have roles/iam.serviceAccountTokenCreator
        # on itself — already bound at bootstrap (see
        # scripts/bootstrap-aipla-dev.sh:ensure_cb_service_agent).
        # Discovered 2026-05-25 after metadata-server paths kept
        # 403'ing through builds e8532153 / 11b5c6a0 / faed2832 /
        # 7bc7eb6c with MalformedError: "Wrong number of segments".
        TOKEN=$(gcloud iam service-accounts generate-id-token \
          "${_ADMIN_SEED_ALLOWED_SAS}" \
          --audiences="$${URL}" \
          --include-email 2>/dev/null)
        echo "--- demo codes (paste into /group on the dev URL) ---"
        for code in aipla-demo-1 aipla-demo-2 aipla-demo-3; do
          body=$(curl -sS --max-time 30 \
            -X POST -H "Authorization: Bearer $${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"code\": \"$${code}\", \"skill_name\": \"problem-set-hints\", \"title\": \"dev demo $${code}\", \"ttl_days\": 30}" \
            "$${URL}/api/proxy/api/admin/mint-demo-group")
          echo "  $${code} -> $${body}"
        done
        echo "--- end demo codes ---"
        exit 0
