id: phase-change
difficulty: medium
reference_sim: phase-change
hidden_terms: [smeltevarme, fordampningsvarme, "latent heat", "specific heat", varmefylde, "334", "2260", "4180", "2100"]
brief: |
  ID: phase-change
  100 g of H2O heated at constant power from ice at -20 C, through melting,
  liquid water, boiling and on into steam. The student picks a power
  (150-600 W), starts heating, and marks points on a live temperature-against-
  energy curve. Each marked point records the phase, the temperature, the time
  and the energy supplied so far, into a table. Fysik B/C.

  Model: c_ice = 2100, c_water = 4180, c_steam = 2010 J/(kg*K); heat of fusion
  334 kJ/kg; heat of vaporisation 2260 kJ/kg; no heat loss. The temperature
  stays exactly at 0 C while melting and at 100 C while boiling.

  Put the phase, temperature, time, energy supplied and power in the state you
  share with the tutor.

  The student DERIVES the heat capacities and latent heats from the slopes and
  the plateau lengths. Do NOT show any specific heat capacity or latent heat, or
  their values, anywhere.
