  }
  prSec.querySelectorAll(".sthead").forEach((h) => h.addEventListener("click", () => { S.pr.open = Number(h.dataset.step); renderPractice(); }));
  prSec.querySelectorAll(".cont").forEach((b) => b.addEventListener("click", () => {
    const n = Number(b.dataset.next);
    S.pr.open = n; renderPractice();
    const li = document.getElementById("pr-st" + n);
    if (li.scrollIntoView) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }));
  // Step 1 shows Bohr's picture of the atom; the numericals show the data card.
  function buildPrAtom() {
    const svg = document.getElementById("pr-svg");
    while (svg.lastChild && svg.lastChild.tagName !== "desc") svg.removeChild(svg.lastChild);
    const c = 150;
    for (let n = 4; n >= 1; n--) {
      el("circle", { cx: c, cy: c, r: 30 * n + 4, fill: "none", stroke: "#94a3b8", "stroke-width": 1.4 }, svg);
      txt(svg, c + (30 * n + 4) * 0.72, c - (30 * n + 4) * 0.72 - 4, "n = " + n, { "font-size": 8.5, fill: "#475569" });
    }
    el("circle", { cx: c, cy: c, r: 8, fill: "#dc2626" }, svg);
    el("circle", { cx: c + 34 * Math.cos(0.6), cy: c + 34 * Math.sin(0.6), r: 6, fill: "#2563eb" }, svg);
    txt(svg, c, 292, "?", { "text-anchor": "middle", "font-size": 22, "font-weight": 700, fill: "#2563eb" });
  }
  const PR_WIDE = window.matchMedia ? window.matchMedia("(min-width: " + OV_BP + "px)") : { matches: true };
  function placePractice() {
    const fw = document.getElementById("pr-figwrap");
    const dest = document.getElementById(PR_WIDE.matches ? "pr-right" : "pr-slot-fig");
    if (fw.parentNode !== dest) dest.appendChild(fw);
  }
  if (PR_WIDE.addEventListener) PR_WIDE.addEventListener("change", placePractice);
  function renderPractice() {
    const a = S.pr;
    for (let n = 1; n <= 4; n++) {
      prA[n].placeholder = t(n === 1 ? "prPh1" : "prPhN");
      prSendB[n].textContent = a["c" + n] ? t("resend") : t("jpSend");
      setNote("pr-need" + n, prNotes[n], a["c" + n]);
    }
    const atom = a.open === 1;
    document.getElementById("pr-fig").hidden = !atom;
    document.getElementById("pr-data").hidden = atom;
    document.getElementById("pr-figtitle").textContent = t("prFigTitle");
    document.getElementById("pr-cap").textContent = t("prCap");
    document.getElementById("pr-desc").textContent = t("prAlt");
    if (atom) buildPrAtom();
    placePractice();
    renderPrTour();
  }
  for (let n = 1; n <= 4; n++) {
    prA[n].addEventListener("input", () => { S.pr["a" + n] = prA[n].value.slice(0, 600); if (prNotes[n]) { prNotes[n] = ""; renderPractice(); } });
    prSendB[n].addEventListener("click", () => {
      const v = prA[n].value.trim().slice(0, 600), a = S.pr;
      a["a" + n] = v;
      if (!enough(v)) { prNotes[n] = "ovNeed"; renderPractice(); prA[n].focus(); return; }
      if (a["c" + n] && v === a["s" + n]) { prNotes[n] = "ovUnchanged"; renderPractice(); return; }
      prNotes[n] = "";
      a["s" + n] = v; a["c" + n]++;
      renderPractice(); renderTabs();
      flushPendingChanges("record");
      emit("record", { state: simState(), label: t("lblPr", { q: n, n: a["c" + n], why: clip(v) }) });
    });
  }
  function resetPractice() {
    S.pr = PR0(); for (let n = 1; n <= 4; n++) { prA[n].value = ""; prNotes[n] = ""; }
    S.skips = S.skips.filter((x) => x.indexOf("practice:") !== 0);
  }

  // ─── Moving on without finishing, and resetting ─────────────────────────
  // Every step 1–3 gets a row under it. Finished: the green Continue bar does
  // the job and the row is hidden. Not finished: a quiet "Next step" button;
  // pressing it asks once ("Continue anyway?"). A checked but wrong answer
  // shows that question straight away. Skips are logged (silent state).
  const FLOW = {
    ov: { tab: "overview", li: (n) => "st" + n, ok: (n) => "ok" + n,
      kind: (n) => [null, S.ov.predCount ? "done" : "empty", S.ov.powerToggles ? "done" : "power", S.ov.revealed ? "done" : "reveal"][n],
      open: (n) => { S.ov.open = n; renderOverview(); } },
    ao: { tab: "orbits", li: (n) => "ao-st" + n, ok: (n) => "ao-ok" + n,
      kind: (n) => [null, S.ao.guessCount ? "done" : "empty", S.ao.calcOk ? "done" : (S.ao.checkCount ? "wrong" : "empty"), S.ao.whyCount ? "done" : "empty"][n],
      open: (n) => { S.ao.open = n; renderOrbits(); } },
    jp: { tab: "jumps", li: (n) => "jp-st" + n, ok: (n) => "jp-ok" + n,
      kind: (n) => [null, S.jp.a1Count ? "done" : "empty", S.jp.a2Count ? "done" : "empty", S.jp.calcOk ? "done" : (S.jp.checkCount ? "wrong" : "empty")][n],
      open: (n) => { S.jp.open = n; renderJumps(); } },
    pr: { tab: "practice", li: (n) => "pr-st" + n, ok: (n) => "pr-ok" + n,
      kind: (n) => (S.pr["c" + n] ? "done" : "empty"),
      open: (n) => { S.pr.open = n; renderPractice(); } },
  };
  const WARN = { empty: "skipWarnEmpty", power: "skipWarnPower", reveal: "skipWarnReveal", wrong: "skipWarnWrong" };
  const skipAsk = {};
  function renderSkips(part) {
    const f = FLOW[part];
    for (let n = 1; n <= 3; n++) {
      const id = part + "-skip" + n;
      let row = document.getElementById(id);
      if (!row) {
        row = document.createElement("div"); row.id = id; row.className = "skiprow";
        const ok = document.getElementById(f.ok(n)); ok.parentNode.insertBefore(row, ok.nextSibling);
      }
      const kind = f.kind(n), li = document.getElementById(f.li(n));
      row.innerHTML = "";
      row.hidden = kind === "done" || !li.classList.contains("open");
      if (row.hidden) continue;
      const ask = kind === "wrong" || skipAsk[id];
      row.className = "skiprow" + (ask ? " ask" : "");
      if (!ask) {
        const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = t("skipNext");
        b.addEventListener("click", () => { skipAsk[id] = true; renderSkips(part); row.querySelector("button").focus(); });
        row.appendChild(b);
        continue;
      }
      const m = document.createElement("p"); m.textContent = t(WARN[kind]); m.setAttribute("role", "status"); row.appendChild(m);
      const go = document.createElement("button"); go.type = "button"; go.textContent = t("skipGo");
      go.addEventListener("click", () => {
        const tag = f.tab + ":" + n;
        if (S.skips.indexOf(tag) < 0) S.skips.push(tag);
        pendingChanges.skipped_steps = S.skips.slice(-12);
        delete skipAsk[id];
        f.open(n + 1);
        const next = document.getElementById(f.li(n + 1));
        if (next.scrollIntoView) next.scrollIntoView({ block: "nearest", behavior: "smooth" });
      });
      row.appendChild(go);
      if (kind !== "wrong") {
        const stay = document.createElement("button"); stay.type = "button"; stay.className = "ghost"; stay.textContent = t("skipStay");
        stay.addEventListener("click", () => { delete skipAsk[id]; renderSkips(part); });
        row.appendChild(stay);
      }
    }
  }

  // Reset: one button in each part's title, one for everything at the top.
  // Asks first (inline, no browser dialog), then wipes that part's answers and
  // tells the tutor with a silent state-change.
  function resetOverview() {
    S.ov = OV0(); ovReason.value = ""; ovIdea.value = ""; ovNote1 = ""; ovNote2 = "";
    const sp = document.getElementById("ov-spectrum");
    while (sp.lastChild && sp.lastChild.tagName !== "desc") sp.removeChild(sp.lastChild);
    S.skips = S.skips.filter((x) => x.indexOf("overview:") !== 0);
  }
  function resetOrbits() {
    S.ao = AO0(); aoGuess.value = ""; aoWhy.value = ""; aoNote1 = ""; aoNote2 = ""; aoNote3 = "";
    Object.keys(AO_IN).forEach((k) => { AO_IN[k].value = ""; });
    aoScale = aoSTo = aoSFrom = AO_SC[0]; aoSStart = 0;
    S.skips = S.skips.filter((x) => x.indexOf("orbits:") !== 0);
  }
  const RESET = {
    overview: { ask: "resetAskPart", run: () => { resetOverview(); renderOverview(); } },
    orbits: { ask: "resetAskPart", run: () => { resetOrbits(); renderOrbits(); } },
    jumps: { ask: "resetAskPart", run: () => { resetJumps(); renderJumps(); } },
    practice: { ask: "resetAskPart", run: () => { resetPractice(); renderPractice(); } },
    all: { ask: "resetAskAll", run: () => { resetOverview(); resetOrbits(); resetJumps(); resetPractice(); renderOverview(); renderOrbits(); renderJumps(); renderPractice(); goTo("overview"); } },
  };
  const RESET_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.2 2.2v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderResets() {
    document.querySelectorAll("[data-reset]").forEach((holder) => {
      const which = holder.dataset.reset;
      holder.innerHTML = "";
      if (holder.dataset.asking !== "1") {
        const b = document.createElement("button"); b.type = "button"; b.className = "reset";
        b.innerHTML = RESET_ICON; const sp = document.createElement("span"); sp.textContent = t(which === "all" ? "resetAll" : "resetPart"); b.appendChild(sp);
        b.addEventListener("click", () => { holder.dataset.asking = "1"; renderResets(); holder.querySelector("button").focus(); });
        holder.appendChild(b);
        return;
      }
      const box = document.createElement("span"); box.className = "confirm"; box.setAttribute("role", "group");
      const m = document.createElement("span"); m.textContent = t(RESET[which].ask); box.appendChild(m);
      const no = document.createElement("button"); no.type = "button"; no.className = "ghost"; no.textContent = t("resetNo");
      const yes = document.createElement("button"); yes.type = "button"; yes.className = "danger"; yes.textContent = t("resetYes");
      no.addEventListener("click", () => { holder.dataset.asking = "0"; renderResets(); });
      yes.addEventListener("click", () => {
        holder.dataset.asking = "0";
        RESET[which].run();
        renderResets(); renderTabs();
        pendingChanges.reset = which;
        flushPendingChanges("reset");
      });
      box.appendChild(no); box.appendChild(yes);
      holder.appendChild(box);
    });
  }

  function renderTabs() {
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    const st = partStatus();
    const open = TABS.filter((tb) => OPEN_TABS.indexOf(tb.id) >= 0);
    nav.hidden = open.length < 2;
    open.forEach((tb) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(S.tab === tb.id));
      const s = st[tb.id];
      if (s) { const d = document.createElement("span"); d.className = "dot" + (s === "done" ? " done" : ""); b.appendChild(d); }
      b.appendChild(document.createTextNode(t(tb.k)));
      b.addEventListener("click", () => goTo(tb.id));
      nav.appendChild(b);
    });
  }
  function goTo(id) {
    if (OPEN_TABS.indexOf(id) < 0) return;
    S.tab = id;
    document.querySelectorAll("section[data-tab]").forEach((s) => { s.hidden = s.dataset.tab !== id; });
    renderTabs();
    if (id === "overview") renderOverview();
    if (id === "orbits") renderOrbits();
    if (id === "jumps") renderJumps();
    if (id === "practice") renderPractice();
    pendingChanges.tab = id;
    window.scrollTo(0, 0);
  }
  let resizeT = null;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.tab === "orbits") buildAtom(); if (S.tab === "jumps") buildJp(); if (S.ov.revealed && S.tab === "overview") drawOvSpectrum(false); }, 120); });
  document.querySelectorAll("[data-goto]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.goto)));

  // ─── Language ───────────────────────────────────────────────────────────
  function applyLang() {
    document.documentElement.lang = lang;
    if (!TEST_MODE) document.title = t("title");
    document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
    document.querySelectorAll("[data-num]").forEach((e) => { e.textContent = num(Number(e.dataset.num), Number(e.dataset.dp)); });
    document.getElementById("lang-da").setAttribute("aria-pressed", String(lang === "da"));
    document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    renderOverview(); renderOrbits(); renderJumps(); renderPractice(); renderResets();
    renderTabs();
  }
  function setLang(l, byStudent) {
    if (!strings[l]) return;
    if (byStudent) langLockedByStudent = true;
    if (l === lang) return;
    lang = l; applyLang(); pendingChanges.lang = l;
  }
  document.getElementById("lang-da").addEventListener("click", () => setLang("da", true));
  document.getElementById("lang-en").addEventListener("click", () => setLang("en", true));

  // ─── Boot ───────────────────────────────────────────────────────────────
  applyLang();
  goTo("overview");
  delete pendingChanges.tab;
  requestAnimationFrame(aoFrame);
  requestAnimationFrame(jpFrame);

  AIPLA_BRIDGE.init({ name: ARTEFACT_NAME, version: "1.0.0" });
  function adoptLocale(ctx) {
    if (!ctx || typeof ctx.locale !== "string" || langLockedByStudent) return;
    const l = ctx.locale.slice(0, 2).toLowerCase();
    if (strings[l] && l !== lang) { lang = l; applyLang(); }
  }
  // The student is about to send a chat message: the tutor gets the latest state
  // (and what the group is working on) before it answers.
  AIPLA_BRIDGE.onChatFlush(function () { pendingChanges.working_on = true; flushPendingChanges("chat-submit"); });
  AIPLA_BRIDGE.onHostNotification("ui/notifications/host-context-changed", function (p) { adoptLocale(p && (p.hostContext || p)); });
  (function pollHostLocale() {
    let tries = 0;
    const timer = setInterval(() => {
      const ctx = AIPLA_BRIDGE.hostContext();
      if (ctx && typeof ctx.locale === "string") { clearInterval(timer); adoptLocale(ctx); }
      else if (++tries > 40) clearInterval(timer);
    }, 50);
  })();

  // ─── Self-test (?test=1) ────────────────────────────────────────────────
  if (TEST_MODE) {
    // 3 → 2: 13.6·(1/4 − 1/9) = 1.8889 eV; λ = 1239.84 / 1.8889 = 656.4 nm (Hα).
    // 6 → 2: 3.0222 eV, 410.2 nm. 11.0 eV from n = 1 matches no gap (10.2, 12.09 …).
    const checks = [
      Math.abs(gap(3, 2) - 1.8889) < 0.001,
      Math.abs(lambdaNm(3, 2) - 656.4) < 0.5,
      Math.abs(lambdaNm(6, 2) - 410.2) < 0.5,
      Math.abs(lambdaNm(2, 1) - 121.6) < 0.5,
      Math.abs(rydbergNm(3, 2) - 656.3) < 0.5 && Math.abs(rydbergNm(6, 2) - 410.2) < 0.5,
      JSON.stringify(simState()).length < 4096,
      // Overview: nothing of the spectrum is rendered before commit + reveal.
      document.getElementById("ov-specfig").hidden && document.getElementById("ov-spectrum").querySelectorAll("rect,text").length === 0,
      !document.getElementById("ov-submit").disabled && !document.getElementById("ov-power").disabled,
      // Part 1: rₙ = n²·r₁ and the answer checks; true orbits 2–4, the table and Bohr's answer are absent before.
      Math.abs(rNm(2) - 0.2116) < 1e-4 && Math.abs(rNm(3) - 0.4761) < 1e-4,
      judgeNm(0.21, 2) === "ok" && judgeNm(0.212, 2) === "ok" && judgeNm(0.106, 2) === "double" && judgeNm(2.1e-10, 2) === "metre" && judgeNm(2.12, 2) === "angstrom" && judgeNm(0.48, 3) === "ok" && judgeNm(0.159, 3) === "double",
      judgeRel(4, 2) === "ok" && judgeRel(2, 2) === "double" && judgeRel(0.21, 2) === "nmInRel" && judgeRel(9, 3) === "ok" && judgeRel(6, 3) === "wrong",
      judgeDraw(4, 9) === "ok" && judgeDraw(2, 3) === "even" && judgeDraw(4, 6) === "bad3" && judgeDraw(0, 9) === "missing",
      !/486|410/.test(document.querySelector('section[data-tab="jumps"]').textContent) && document.getElementById("jp-svg").querySelectorAll("rect:not(.hit)").length === 0,
      document.getElementById("ao-atom").querySelectorAll("circle").length === 5 && document.getElementById("ao-tablewrap").children.length === 0 && document.getElementById("ao-ans-slot").children.length === 0,
    ];
    const ok = checks.every(Boolean);
    document.title = (ok ? "TEST PASS" : "TEST FAIL") + " — " + strings.da.title;
    if (!ok) console.error("Self-test failed: " + JSON.stringify(checks));
  }
</script>
</body>
