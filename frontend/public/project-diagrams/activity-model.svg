<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">How an AIPLA activity connects teachers, student groups, a tutor, and a workbench</title>
  <desc id="desc">A teacher prepares an activity containing teaching material, tutor guidance, and a workbench. An anonymous student group uses the connected tutor and workbench. Selected workbench actions are shared visibly with the tutor, and teachers can review the session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#526077}.small{font-size:13px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#fff7f7;stroke:#901a1e;stroke-width:2}.soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1120" height="520" rx="24" fill="#f8fafc"/>
  <text x="560" y="47" text-anchor="middle" class="title">One activity, connected around a learning goal</text>

  <rect x="40" y="110" width="225" height="130" rx="16" class="box"/>
  <text x="152" y="148" text-anchor="middle" class="label">Teacher</text>
  <text x="152" y="177" text-anchor="middle" class="body">Prepares and previews</text>
  <text x="152" y="199" text-anchor="middle" class="body">the learning activity</text>
  <text x="152" y="221" text-anchor="middle" class="small">Authenticated access</text>

  <rect x="345" y="82" width="430" height="185" rx="20" class="accent"/>
  <text x="560" y="122" text-anchor="middle" class="label">Activity</text>
  <text x="560" y="150" text-anchor="middle" class="body">Learning goal and teacher material</text>
  <rect x="380" y="175" width="170" height="60" rx="12" class="soft"/>
  <text x="465" y="202" text-anchor="middle" class="label">Tutor</text>
  <text x="465" y="222" text-anchor="middle" class="small">Guidance and behaviour</text>
  <rect x="570" y="175" width="170" height="60" rx="12" class="soft"/>
  <text x="655" y="202" text-anchor="middle" class="label">Workbench</text>
  <text x="655" y="222" text-anchor="middle" class="small">Sim, document or tools</text>

  <rect x="855" y="110" width="225" height="130" rx="16" class="box"/>
  <text x="967" y="148" text-anchor="middle" class="label">Student group</text>
  <text x="967" y="177" text-anchor="middle" class="body">Talks, tests, records,</text>
  <text x="967" y="199" text-anchor="middle" class="body">compares and explains</text>
  <text x="967" y="221" text-anchor="middle" class="small">Anonymous group code</text>

  <path d="M265 170H335" class="line"/><path d="M775 170H845" class="line"/>

  <rect x="345" y="330" width="430" height="120" rx="18" class="box"/>
  <text x="560" y="367" text-anchor="middle" class="label">Visible, structured connection</text>
  <text x="560" y="397" text-anchor="middle" class="body">Relevant workbench actions can inform the tutor.</text>
  <text x="560" y="421" text-anchor="middle" class="body">The group can see what was shared.</text>
  <path d="M465 267V320" class="line"/><path d="M655 267V320" class="line"/>

  <path d="M925 250C900 365 825 420 785 420" class="line dash"/>
  <text x="875" y="380" text-anchor="middle" class="small">session activity</text>
  <path d="M335 420C255 420 170 350 152 250" class="line dash"/>
  <text x="205" y="380" text-anchor="middle" class="small">review in scope</text>
</svg>
