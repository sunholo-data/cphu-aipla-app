<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <rect width="480" height="270" fill="#0f172a"/>

  <!-- Coordinate axes -->
  <line x1="50" y1="210" x2="440" y2="210" stroke="#475569" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="50" y2="80" stroke="#475569" stroke-width="1.5"/>
  <!-- Axis tick marks -->
  <g stroke="#334155" stroke-width="1">
    <line x1="130" y1="208" x2="130" y2="213"/>
    <line x1="210" y1="208" x2="210" y2="213"/>
    <line x1="290" y1="208" x2="290" y2="213"/>
    <line x1="370" y1="208" x2="370" y2="213"/>
    <line x1="48" y1="170" x2="53" y2="170"/>
    <line x1="48" y1="130" x2="53" y2="130"/>
    <line x1="48" y1="90" x2="53" y2="90"/>
  </g>
  <!-- Axis labels -->
  <text x="445" y="215" font-family="ui-monospace,monospace" font-size="11" fill="#64748b">x</text>
  <text x="40" y="75" font-family="ui-monospace,monospace" font-size="11" fill="#64748b">y</text>

  <!-- Projectile parabola arc -->
  <path d="M 60 210 Q 220 50 400 210" stroke="#3b82f6" stroke-width="2.5" fill="none"/>

  <!-- Initial velocity vector at launch -->
  <line x1="60" y1="210" x2="115" y2="155" stroke="#22c55e" stroke-width="2"/>
  <polygon points="115,155 108,160 112,148" fill="#22c55e"/>
  <text x="80" y="190" font-family="ui-monospace,monospace" font-size="10" fill="#22c55e">u</text>
  <!-- Launch angle indicator -->
  <path d="M 80 210 A 20 20 0 0 0 90 198" stroke="#22c55e" stroke-width="1" fill="none"/>
  <text x="86" y="206" font-family="ui-monospace,monospace" font-size="9" fill="#22c55e">θ</text>

  <!-- Trajectory dots at intervals along the arc -->
  <g fill="#60a5fa">
    <circle cx="120" cy="148" r="3"/>
    <circle cx="180" cy="98" r="3"/>
    <circle cx="240" cy="80" r="3"/>
    <circle cx="300" cy="98" r="3"/>
    <circle cx="360" cy="148" r="3"/>
  </g>

  <!-- Peak height marker -->
  <line x1="240" y1="80" x2="240" y2="210" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="246" y="84" font-family="ui-monospace,monospace" font-size="10" fill="#f59e0b">H</text>

  <!-- Range marker -->
  <line x1="60" y1="225" x2="400" y2="225" stroke="#f59e0b" stroke-width="1"/>
  <line x1="60" y1="221" x2="60" y2="229" stroke="#f59e0b" stroke-width="1"/>
  <line x1="400" y1="221" x2="400" y2="229" stroke="#f59e0b" stroke-width="1"/>
  <text x="218" y="240" font-family="ui-monospace,monospace" font-size="10" fill="#f59e0b">R</text>

  <!-- Title -->
  <text x="40" y="42" font-family="sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Kinematics Tutor</text>
  <text x="40" y="62" font-family="sans-serif" font-size="13" fill="#94a3b8">NCERT/CBSE Class 11 Physics</text>

  <!-- Formula in faint type -->
  <text x="440" y="62" font-family="ui-monospace,monospace" font-size="11" fill="#475569" text-anchor="end">R = u² sin 2θ / g</text>
</svg>
