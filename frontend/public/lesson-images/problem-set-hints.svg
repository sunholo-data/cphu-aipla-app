<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none" stroke="currentColor" stroke-width="2">
  <rect width="480" height="270" fill="#0f172a"/>
  <!-- Ground -->
  <line x1="40" y1="220" x2="440" y2="220" stroke="#475569" stroke-width="2"/>
  <!-- Launch point -->
  <circle cx="60" cy="220" r="6" fill="#fbbf24" stroke="none"/>
  <!-- Trajectory (parabola) -->
  <path d="M 60 220 Q 240 60 420 220" stroke="#60a5fa" stroke-width="3" fill="none"/>
  <!-- Ball at apex -->
  <circle cx="240" cy="105" r="9" fill="#f87171" stroke="#ef4444" stroke-width="2"/>
  <!-- Initial velocity vector -->
  <line x1="60" y1="220" x2="120" y2="160" stroke="#22d3ee" stroke-width="3"/>
  <polygon points="120,160 113,166 119,154" fill="#22d3ee" stroke="none"/>
  <text x="125" y="158" font-family="sans-serif" font-size="14" fill="#22d3ee" stroke="none">v₀</text>
  <!-- Angle arc -->
  <path d="M 80 220 A 20 20 0 0 0 76 207" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <text x="84" y="214" font-family="sans-serif" font-size="11" fill="#94a3b8" stroke="none">θ</text>
  <!-- Title -->
  <text x="40" y="42" font-family="sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" stroke="none">Boldkast</text>
  <text x="40" y="62" font-family="sans-serif" font-size="13" fill="#94a3b8" stroke="none">Projectile motion · stx fysik</text>
</svg>
