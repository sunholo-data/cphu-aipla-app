<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <rect width="480" height="270" fill="#0f172a"/>
  <!-- Breadboard rail -->
  <rect x="40" y="200" width="400" height="32" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <g fill="#334155">
    <rect x="50" y="208" width="6" height="6"/>
    <rect x="62" y="208" width="6" height="6"/>
    <rect x="74" y="208" width="6" height="6"/>
    <rect x="86" y="208" width="6" height="6"/>
    <rect x="98" y="208" width="6" height="6"/>
    <rect x="110" y="208" width="6" height="6"/>
    <rect x="122" y="208" width="6" height="6"/>
    <rect x="134" y="208" width="6" height="6"/>
    <rect x="146" y="208" width="6" height="6"/>
    <rect x="158" y="208" width="6" height="6"/>
    <rect x="50" y="218" width="6" height="6"/>
    <rect x="62" y="218" width="6" height="6"/>
    <rect x="74" y="218" width="6" height="6"/>
    <rect x="86" y="218" width="6" height="6"/>
    <rect x="98" y="218" width="6" height="6"/>
    <rect x="110" y="218" width="6" height="6"/>
    <rect x="122" y="218" width="6" height="6"/>
    <rect x="134" y="218" width="6" height="6"/>
    <rect x="146" y="218" width="6" height="6"/>
    <rect x="158" y="218" width="6" height="6"/>
  </g>

  <!-- LED rainbow on the breadboard (six colours per the spec) -->
  <g stroke="#0f172a" stroke-width="1">
    <circle cx="200" cy="200" r="10" fill="#ef4444"/>
    <circle cx="232" cy="200" r="10" fill="#f97316"/>
    <circle cx="264" cy="200" r="10" fill="#eab308"/>
    <circle cx="296" cy="200" r="10" fill="#22c55e"/>
    <circle cx="328" cy="200" r="10" fill="#3b82f6"/>
    <circle cx="360" cy="200" r="10" fill="#1e3a8a"/>
  </g>

  <!-- LED leg wires down into the rail -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="196" y1="208" x2="196" y2="216"/>
    <line x1="204" y1="208" x2="204" y2="216"/>
    <line x1="228" y1="208" x2="228" y2="216"/>
    <line x1="236" y1="208" x2="236" y2="216"/>
    <line x1="260" y1="208" x2="260" y2="216"/>
    <line x1="268" y1="208" x2="268" y2="216"/>
    <line x1="292" y1="208" x2="292" y2="216"/>
    <line x1="300" y1="208" x2="300" y2="216"/>
    <line x1="324" y1="208" x2="324" y2="216"/>
    <line x1="332" y1="208" x2="332" y2="216"/>
    <line x1="356" y1="208" x2="356" y2="216"/>
    <line x1="364" y1="208" x2="364" y2="216"/>
  </g>

  <!-- Spectrometer beam: from a blue LED up into a prism + spectrum -->
  <line x1="328" y1="190" x2="100" y2="100" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  <polygon points="100,80 90,110 110,110" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Spectrum lines emerging from the prism -->
  <g stroke-width="2">
    <line x1="90" y1="110" x2="70" y2="130" stroke="#ef4444"/>
    <line x1="92" y1="110" x2="73" y2="130" stroke="#f97316"/>
    <line x1="94" y1="110" x2="76" y2="130" stroke="#eab308"/>
    <line x1="96" y1="110" x2="79" y2="130" stroke="#22c55e"/>
    <line x1="98" y1="110" x2="82" y2="130" stroke="#3b82f6"/>
    <line x1="100" y1="110" x2="85" y2="130" stroke="#1e3a8a"/>
  </g>

  <!-- Title -->
  <text x="40" y="42" font-family="sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">LED og Plancks konstant</text>
  <text x="40" y="62" font-family="sans-serif" font-size="13" fill="#94a3b8">Virtuelt laboratorium · stx fysik A</text>

  <!-- h formula in faint type -->
  <text x="440" y="62" font-family="ui-monospace,monospace" font-size="11" fill="#475569" text-anchor="end">h = U₀ · e · λ / c</text>
</svg>
