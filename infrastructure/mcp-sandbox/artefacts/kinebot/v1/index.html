<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KineBot — Kinematics Workbench</title>
<style>
:root {
 --bg:#07090f; --s1:#0d1117; --s2:#111827; --s3:#1a2236;
 --border:#1e2d4a; --border2:#263554;
 --blue:#3b82f6; --cyan:#06b6d4; --violet:#8b5cf6;
 --green:#10b981; --amber:#f59e0b; --rose:#f43f5e;
 --text:#e2e8f0; --dim:#94a3b8; --muted:#475569;
 --glow:rgba(59,130,246,.12);
 --font-body:'Inter',sans-serif;
 --font-head:'Syne',sans-serif;
 --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ═══ SCROLLBARS ═══ */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ═══ HEADER ═══ */
header{
 display:flex;align-items:center;gap:12px;padding:10px 18px;
 background:var(--s1);border-bottom:1px solid var(--border);
 flex-shrink:0;position:relative;z-index:10;
}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
 background:linear-gradient(90deg,var(--blue),var(--cyan),var(--violet),var(--rose));}
.hlogo{width:38px;height:38px;flex-shrink:0;position:relative;}
.hlogo svg{width:100%;height:100%;}
.hlogo .orbit{animation:spin 8s linear infinite;transform-origin:19px 19px;}
@keyframes spin{to{transform:rotate(360deg)}}
.htitle{font-family:var(--font-head);font-size:1.15rem;font-weight:800;letter-spacing:-.02em;
 background:linear-gradient(135deg,#60a5fa,#22d3ee,#a78bfa);
 -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hsub{font-size:.65rem;color:var(--muted);margin-top:1px;}
.hbadge{font-size:.6rem;padding:2px 6px;border-radius:4px;
 background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(59,130,246,.3));
 border:1px solid rgba(139,92,246,.4);color:#a78bfa;font-weight:600;margin-left:4px;}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hbtn{font-size:.7rem;font-weight:600;padding:5px 12px;border-radius:8px;
 border:1px solid var(--border2);background:var(--s2);color:var(--dim);
 cursor:pointer;transition:all .15s;white-space:nowrap;}
.hbtn:hover,.hbtn.on{border-color:var(--blue);color:var(--blue);background:var(--glow);}
.hbtn.quiz-on{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.1);}
#voiceBtn{border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
#voiceBtn.recording{border-color:var(--rose);color:var(--rose);background:rgba(244,63,94,.1);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ═══ MAIN ═══ */
.main{display:flex;flex:1;overflow:hidden;}

/* ═══ SIDEBAR ═══ */
.sidebar{width:210px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);
 display:flex;flex-direction:column;overflow:hidden;}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--border);}
.sb-search input{width:100%;background:var(--s3);border:1px solid var(--border);
 color:var(--text);font-size:.75rem;padding:6px 10px;border-radius:8px;outline:none;font-family:var(--font-body);}
.sb-search input:focus{border-color:var(--blue);}
.sb-search input::placeholder{color:var(--muted);}
.sb-list{flex:1;overflow-y:auto;padding:8px 0;}
.sb-section{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
 color:var(--muted);padding:8px 14px 4px;}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;
 font-size:.8rem;color:var(--dim);border:none;background:none;width:100%;text-align:left;
 border-left:2px solid transparent;transition:all .12s;position:relative;}
.sb-item:hover{background:var(--glow);color:var(--text);border-left-color:var(--blue);}
.sb-item.active{background:rgba(59,130,246,.1);color:var(--blue);border-left-color:var(--blue);}
.sb-item .ico{font-size:.95rem;width:18px;text-align:center;}
.sb-item .prog{position:absolute;right:12px;width:6px;height:6px;border-radius:50%;}
.prog-done{background:var(--green);} .prog-partial{background:var(--amber);} .prog-none{background:var(--border2);}
.sb-footer{padding:10px 12px;border-top:1px solid var(--border);}
.xp-bar-wrap{margin-top:4px;}
.xp-label{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);margin-bottom:3px;}
.xp-bar{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:2px;transition:width .5s;}

/* ═══ CONTENT AREA ═══ */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* ═══ SIM PANEL ═══ */
.sim-panel{height:210px;flex-shrink:0;display:flex;gap:0;border-bottom:1px solid var(--border);}
.sim-canvas-wrap{flex:1;background:var(--bg);position:relative;overflow:hidden;min-width:0;}
canvas#simCanvas{width:100%;height:100%;display:block;}
.sim-overlay{position:absolute;top:8px;left:10px;display:flex;gap:6px;flex-wrap:wrap;}
.sim-tag{font-size:.62rem;font-family:var(--font-mono);padding:2px 7px;border-radius:4px;
 background:rgba(7,9,15,.7);border:1px solid var(--border2);color:var(--cyan);}
.sim-right{width:175px;flex-shrink:0;background:var(--s1);border-left:1px solid var(--border);
 display:flex;flex-direction:column;padding:10px;gap:7px;overflow-y:auto;}
.sr-title{font-size:.68rem;font-weight:700;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase;}
.sr-select{width:100%;font-size:.7rem;padding:5px 7px;border-radius:6px;
 background:var(--s2);border:1px solid var(--border);color:var(--dim);cursor:pointer;font-family:var(--font-body);}
.sr-row{display:flex;align-items:center;gap:6px;}
.sr-row label{font-size:.67rem;color:var(--muted);width:50px;flex-shrink:0;}
.sr-row input[type=range]{flex:1;accent-color:var(--blue);cursor:pointer;}
.sr-row .val{font-size:.67rem;font-family:var(--font-mono);color:var(--blue);width:38px;text-align:right;}
.sr-btns{display:flex;gap:5px;}
.sr-btn{flex:1;padding:5px 0;font-size:.7rem;font-weight:600;border-radius:6px;
 border:1px solid var(--border);background:var(--s2);color:var(--dim);cursor:pointer;transition:all .12s;}
.sr-btn:hover,.sr-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.sr-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.sstat{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:4px 6px;}
.sstat-l{font-size:.58rem;color:var(--muted);}
.sstat-v{font-size:.7rem;font-family:var(--font-mono);color:var(--cyan);}

/* ═══ TABS ═══ */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0;}
.tab{padding:8px 16px;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--muted);
 border-bottom:2px solid transparent;transition:all .15s;border-radius:0;border:none;background:none;}
.tab:hover{color:var(--dim);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* ═══ PANELS ═══ */
.panel{flex:1;display:none;flex-direction:column;overflow:hidden;}
.panel.active{display:flex;}

/* CHAT PANEL */
.messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.msg{display:flex;gap:9px;max-width:88%;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;
 display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;}
.msg.bot .msg-av{background:linear-gradient(135deg,var(--blue),var(--cyan));}
.msg.user .msg-av{background:linear-gradient(135deg,var(--violet),var(--rose));}
.msg-bub{padding:9px 13px;border-radius:14px;font-size:.84rem;line-height:1.65;}
.msg.bot .msg-bub{background:var(--s2);border:1px solid var(--border);border-top-left-radius:3px;}
.msg.user .msg-bub{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-bottom-right-radius:3px;}
.msg-bub h4{color:var(--cyan);font-size:.88rem;margin:7px 0 3px;font-weight:700;font-family:var(--font-head);}
.msg-bub strong{color:#7dd3fc;}
.msg-bub em{color:var(--amber);font-style:normal;font-weight:500;}
.msg-bub .fmla{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);
 padding:7px 11px;margin:6px 0;border-radius:6px;font-family:var(--font-mono);font-size:.76rem;color:var(--cyan);white-space:pre-wrap;}
.msg-bub ul{padding-left:16px;} .msg-bub ul li{margin:2px 0;}
.msg-bub table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.79rem;}
.msg-bub th{background:var(--bg);color:var(--blue);padding:5px 8px;text-align:left;border:1px solid var(--border);}
.msg-bub td{padding:4px 8px;border:1px solid var(--border);color:var(--dim);}
.msg-bub .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.68rem;font-weight:600;margin:1px;}
.b-def{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.b-tip{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.2);}
.b-sim{background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.2);}
.b-warn{background:rgba(244,63,94,.1);color:var(--rose);border:1px solid rgba(244,63,94,.2);}
/* Streaming cursor */
.cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);border-radius:1px;
 animation:blink .6s infinite;vertical-align:middle;margin-left:2px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.typing-dots{display:flex;gap:4px;padding:8px 12px;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tdot .9s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{transform:scale(1)}40%{transform:scale(1.4);background:var(--blue)}}

/* QUICK PROMPTS */
.qp-bar{padding:7px 14px;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--border);background:var(--s1);flex-shrink:0;}
.qp{font-size:.72rem;padding:4px 10px;border-radius:14px;border:1px solid var(--border);
 background:var(--s2);color:var(--dim);cursor:pointer;transition:all .12s;white-space:nowrap;}
.qp:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(6,182,212,.07);}

/* INPUT BAR */
.input-bar{padding:10px 14px;background:var(--s1);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;}
.input-bar textarea{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text);
 font-family:var(--font-body);font-size:.87rem;padding:9px 12px;border-radius:10px;
 resize:none;outline:none;line-height:1.5;max-height:110px;min-height:40px;transition:border-color .2s;}
.input-bar textarea:focus{border-color:var(--blue);}
.input-bar textarea::placeholder{color:var(--muted);}
.send-btn{width:40px;height:40px;border-radius:10px;flex-shrink:0;
 background:linear-gradient(135deg,var(--blue),var(--cyan));
 border:none;cursor:pointer;font-size:1rem;transition:opacity .15s;display:flex;align-items:center;justify-content:center;}
.send-btn:hover{opacity:.85;} .send-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ═══ FORMULA SHEET PANEL ═══ */
.formula-sheet{flex:1;overflow-y:auto;padding:16px;}
.fs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.fs-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;
 transition:border-color .15s;}
.fs-card:hover{border-color:var(--border2);}
.fs-card-title{font-family:var(--font-head);font-size:.88rem;font-weight:700;color:var(--cyan);margin-bottom:8px;
 display:flex;align-items:center;gap:6px;}
.fs-eq{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);
 padding:6px 10px;margin:4px 0;border-radius:5px;font-family:var(--font-mono);font-size:.75rem;color:#7dd3fc;}
.fs-note{font-size:.75rem;color:var(--dim);margin-top:6px;line-height:1.5;}
.fs-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.6rem;font-weight:700;
 background:rgba(139,92,246,.15);color:var(--violet);border:1px solid rgba(139,92,246,.25);margin-bottom:4px;}

/* ═══ QUIZ PANEL ═══ */
.quiz-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;}
.quiz-header{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.quiz-progress{font-size:.75rem;color:var(--muted);}
.quiz-score-badge{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:12px;
 background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.quiz-card{width:100%;max-width:600px;background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:20px;}
.quiz-q{font-size:.95rem;font-weight:600;color:var(--text);line-height:1.6;margin-bottom:16px;}
.quiz-q .qnum{color:var(--muted);font-size:.75rem;display:block;margin-bottom:4px;}
.quiz-opts{display:flex;flex-direction:column;gap:7px;}
.quiz-opt{padding:10px 14px;border-radius:9px;border:1px solid var(--border);background:var(--s3);
 cursor:pointer;font-size:.85rem;color:var(--dim);transition:all .15s;text-align:left;}
.quiz-opt:hover:not(.locked){border-color:var(--blue);color:var(--text);background:var(--glow);}
.quiz-opt.correct{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green);}
.quiz-opt.wrong{border-color:var(--rose);background:rgba(244,63,94,.1);color:var(--rose);}
.quiz-exp{margin-top:12px;padding:10px 13px;background:var(--bg);border:1px solid var(--border);
 border-left:3px solid var(--cyan);border-radius:6px;font-size:.8rem;color:var(--dim);line-height:1.6;display:none;}
.quiz-next{margin-top:12px;padding:8px 20px;border-radius:8px;border:none;
 background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:.82rem;font-weight:700;
 cursor:pointer;transition:opacity .15s;display:none;}
.quiz-next:hover{opacity:.85;}
.quiz-empty{color:var(--muted);font-size:.85rem;text-align:center;padding:40px;}
.quiz-result{text-align:center;padding:20px;}
.quiz-result .big-score{font-family:var(--font-head);font-size:3rem;font-weight:800;
 background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.quiz-gen-btn{padding:9px 20px;border-radius:9px;border:none;
 background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;font-size:.82rem;
 font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:8px;}
.quiz-gen-btn:hover{opacity:.85;}

/* ═══ GRAPH PANEL ═══ */
.graph-wrap{flex:1;display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto;}
.graph-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.gc-select{font-size:.75rem;padding:6px 9px;border-radius:7px;background:var(--s2);
 border:1px solid var(--border);color:var(--dim);cursor:pointer;font-family:var(--font-body);}
.gc-btn{font-size:.75rem;font-weight:600;padding:6px 14px;border-radius:7px;border:1px solid var(--border);
 background:var(--s2);color:var(--dim);cursor:pointer;transition:all .12s;}
.gc-btn:hover,.gc-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.gc-label{font-size:.72rem;color:var(--muted);}
.gc-input{width:60px;font-size:.75rem;padding:5px 7px;border-radius:6px;
 background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);outline:none;}
.gc-input:focus{border-color:var(--blue);}
canvas#graphCanvas{background:var(--bg);border:1px solid var(--border);border-radius:10px;
 width:100%;max-height:320px;display:block;}
.graph-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;}
.gleg{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--dim);}
.gleg-dot{width:10px;height:10px;border-radius:50%;}

/* ═══ SIM COLLAPSE ═══ */
.sim-collapse-btn{position:absolute;bottom:6px;right:6px;z-index:5;
 width:22px;height:22px;border-radius:5px;border:1px solid var(--border2);
 background:rgba(7,9,15,.8);color:var(--muted);font-size:.7rem;cursor:pointer;
 display:flex;align-items:center;justify-content:center;transition:all .15s;}
.sim-collapse-btn:hover{color:var(--cyan);border-color:var(--cyan);}
.sim-panel.collapsed{height:36px!important;overflow:hidden;}
.sim-panel.collapsed .sim-canvas-wrap,.sim-panel.collapsed .sim-right{opacity:0;pointer-events:none;}
.sim-panel-header{display:none;align-items:center;gap:8px;padding:8px 14px;font-size:.72rem;font-weight:600;color:var(--muted);}
.sim-panel.collapsed .sim-panel-header{display:flex;}

/* ═══ NOTES PANEL ═══ */
.notes-wrap{flex:1;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:hidden;}
.notes-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.notes-btn{font-size:.72rem;font-weight:600;padding:5px 11px;border-radius:7px;
 border:1px solid var(--border);background:var(--s2);color:var(--dim);cursor:pointer;transition:all .12s;}
.notes-btn:hover,.notes-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.notes-btn.danger:hover{background:var(--rose);border-color:var(--rose);}
.notes-tag-input{font-size:.72rem;padding:5px 9px;border-radius:7px;background:var(--s2);
 border:1px solid var(--border);color:var(--text);font-family:var(--font-body);outline:none;width:100px;}
.notes-tag-input:focus{border-color:var(--blue);}
.notes-area{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:10px;
 color:var(--text);font-family:var(--font-body);font-size:.87rem;padding:12px 14px;
 resize:none;outline:none;line-height:1.7;transition:border-color .15s;}
.notes-area:focus{border-color:var(--blue);}
.notes-saved{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;margin-top:4px;}
.note-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;
 display:flex;justify-content:space-between;align-items:flex-start;gap:8px;transition:border-color .15s;}
.note-card:hover{border-color:var(--border2);}
.note-card-text{font-size:.8rem;color:var(--dim);line-height:1.5;flex:1;}
.note-card-tag{font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:4px;
 background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.2);white-space:nowrap;}
.note-del{font-size:.75rem;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:4px;
 border:none;background:none;transition:color .12s;flex-shrink:0;}
.note-del:hover{color:var(--rose);}
.notes-empty{color:var(--muted);font-size:.82rem;text-align:center;padding:20px;}

/* ═══ QUIZ TOPIC SELECTOR ═══ */
.quiz-topic-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;width:100%;max-width:600px;}
.qtopic-btn{font-size:.7rem;padding:4px 10px;border-radius:12px;border:1px solid var(--border);
 background:var(--s2);color:var(--dim);cursor:pointer;transition:all .12s;}
.qtopic-btn:hover,.qtopic-btn.active{border-color:var(--violet);color:var(--violet);background:rgba(139,92,246,.1);}

/* ═══ COPY TOAST ═══ */
.toast{position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:8px;
 background:var(--green);color:#fff;font-size:.8rem;font-weight:600;z-index:999;
 opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* ═══ PROGRESS BAR ON QUIZ ═══ */
.quiz-prog-bar{width:100%;max-width:600px;height:4px;background:var(--s3);border-radius:2px;margin-bottom:10px;overflow:hidden;}
.quiz-prog-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:2px;transition:width .3s;}

/* ═══ RESPONSIVE ═══ */
/* Sidebar moved to React workbench — its display:none rule is
 harmless when the .sidebar element no longer exists. */
@media(max-width:900px){
 .sim-right{width:140px;}
 .sim-panel{height:240px;}
}
@media(max-width:700px){
 .sim-right{width:120px;font-size:.7rem;}
 .sim-panel{height:280px;}
 .gc-input{width:60px;}
 .graph-controls{flex-wrap:wrap;gap:6px;}
}
</style>
</head>
<body>

<div class="main">

<!-- ══ CONTENT (header + sidebar moved to React workbench) ══ -->

 <select class="sr-select" id="simType" onchange="changeSim()">

 <div class="sr-row"><label>Velocity</label><input type="range" id="slV" min="1" max="12" value="5" oninput="updateSim()"><span class="val" id="lblV">5</span></div>
 <div class="sr-row" id="rowA"><label>Accel.</label><input type="range" id="slA" min="0" max="10" value="3" oninput="updateSim()"><span class="val" id="lblA">3</span></div>
 <div class="sr-row" id="rowAngle" style="display:none"><label>Angle</label><input type="range" id="slAngle" min="5" max="85" value="45" oninput="updateSim()"><span class="val" id="lblAngle">45°</span></div>
 <div class="sr-row" id="rowV2" style="display:none"><label>V₂</label><input type="range" id="slV2" min="1" max="12" value="3" oninput="updateSim()"><span class="val" id="lblV2">3</span></div>

<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let xp = 0, visitedTopics = new Set(), quizScore = 0, quizIdx = 0, quizData = [], quizLocked = false;
let currentTopic = 'intro', voiceRecording = false, recognition = null;
const convHistory = [];

// ══════════════════════════════════════════════════
// SIMULATION ENGINE
// ══════════════════════════════════════════════════
const simCanvas = document.getElementById('simCanvas');
const sctx = simCanvas.getContext('2d');
let sim = { playing:false, t:0, x:0, y:0, type:'1d', trail:[] };
let animId = null, lastTs = null;

function resizeSim(){
 const w = simCanvas.parentElement.clientWidth, h = simCanvas.parentElement.clientHeight;
 simCanvas.width = w; simCanvas.height = h;
}
window.addEventListener('resize', ()=>{ resizeSim(); resizeGraph(); drawSim(); drawGraph(); });
resizeSim();

function gV(){ return +document.getElementById('slV').value; }
function gA(){ return +document.getElementById('slA').value; }
function gAng(){ return +document.getElementById('slAngle').value * Math.PI/180; }
function gV2(){ return +document.getElementById('slV2').value; }

function togglePlay(){
 sim.playing = !sim.playing;
 const b = document.getElementById('btnPlay');
 if(sim.playing){ b.textContent='⏸ Pause'; b.classList.add('on'); runSim(); }
 else{ b.textContent='▶ Play'; b.classList.remove('on'); cancelAnimationFrame(animId); }
}
function resetSim(){
 sim.playing=false; sim.t=0; sim.x=60; sim.y=0; sim.trail=[];
 cancelAnimationFrame(animId); lastTs=null;
 const b=document.getElementById('btnPlay'); b.textContent='▶ Play'; b.classList.add('on');
 drawSim(); updateStats();
}
function updateSim(){
 document.getElementById('lblV').textContent = gV();
 document.getElementById('lblA').textContent = gA();
 document.getElementById('lblAngle').textContent = document.getElementById('slAngle').value+'°';
 document.getElementById('lblV2').textContent = gV2();
 resetSim();
}
function changeSim(){
 sim.type = document.getElementById('simType').value;
 const aRow = document.getElementById('rowA'), angRow = document.getElementById('rowAngle'), v2Row = document.getElementById('rowV2');
 aRow.style.display = ['accel','freefall','projectile'].includes(sim.type)?'flex':'none';
 angRow.style.display = sim.type==='projectile'?'flex':'none';
 v2Row.style.display = sim.type==='relative'?'flex':'none';
 const formulas = {'1d':'x = vt','accel':'v = u+at, s=ut+½at²','projectile':'R=u²sin2θ/g','circular':'ac=v²/r','vectors':'R=A+B','freefall':'h=½gt²','relative':'v_rel=v_A−v_B'};
 document.getElementById('simFormula').textContent = formulas[sim.type]||'';
 document.getElementById('simLabel').textContent = document.getElementById('simType').selectedOptions[0].text;
 resetSim();
}

function runSim(){
 lastTs=null;
 function step(ts){
 if(!sim.playing) return;
 if(!lastTs) lastTs=ts;
 const dt = Math.min((ts-lastTs)/1000*0.6,0.05); lastTs=ts;
 const W=simCanvas.width, H=simCanvas.height;
 const v=gV(), a=gA(), ang=gAng();

 if(sim.type==='1d'){ sim.x+=v*dt*45; if(sim.x>W-20) sim.x=30; }
 else if(sim.type==='accel'){ sim.t+=dt; sim.x=40+0.5*a*sim.t*sim.t*22; if(sim.x>W-20) resetSim(); }
 else if(sim.type==='freefall'){ sim.t+=dt; sim.y=H*0.08+0.5*9.8*sim.t*sim.t*18; if(sim.y>H*0.82) resetSim(); }
 else if(sim.type==='projectile'){
 sim.t+=dt;
 sim.x=40+v*Math.cos(ang)*sim.t*45;
 sim.y=H*0.78-(v*Math.sin(ang)*sim.t-0.5*9.8*sim.t*sim.t)*18;
 sim.trail.push({x:sim.x,y:sim.y});
 if(sim.trail.length>120) sim.trail.shift();
 if(sim.y>H*0.82||sim.x>W-10) resetSim();
 }
 else if(sim.type==='circular'){
 sim.t+=dt*v*0.4;
 const r=Math.min(W,H)*0.28;
 sim.x=W/2+Math.cos(sim.t)*r; sim.y=H/2+Math.sin(sim.t)*r;
 }
 else if(sim.type==='vectors'){ sim.t+=dt; if(sim.t>6.28) sim.t=0; }
 else if(sim.type==='relative'){ sim.t+=dt; sim.x=(sim.t*(v)*40)%W; sim.y=H*0.4+(sim.t*gV2()*40)%(H*0.3); }

 drawSim(); updateStats();
 animId = requestAnimationFrame(step);
 }
 animId = requestAnimationFrame(step);
}

function updateStats(){
 const v=gV(), a=gA(), W=simCanvas.width;
 document.getElementById('stX').textContent = ((sim.x-40)/50).toFixed(1)+' m';
 document.getElementById('stT').textContent = sim.t.toFixed(2)+' s';
 if(sim.type==='1d'){ document.getElementById('stV').textContent=v+' m/s'; document.getElementById('stA').textContent='0 m/s²'; }
 else if(sim.type==='accel'){ document.getElementById('stV').textContent=(a*sim.t).toFixed(1)+' m/s'; document.getElementById('stA').textContent=a+' m/s²'; }
 else if(sim.type==='freefall'){ document.getElementById('stV').textContent=(9.8*sim.t).toFixed(1)+' m/s'; document.getElementById('stA').textContent='9.8 m/s²'; }
 else{ document.getElementById('stV').textContent=v+' m/s'; document.getElementById('stA').textContent=a+' m/s²'; }
}

function drawSim(){
 const W=simCanvas.width, H=simCanvas.height;
 sctx.clearRect(0,0,W,H);
 // Grid
 sctx.strokeStyle='rgba(30,45,74,0.6)'; sctx.lineWidth=1;
 for(let x=0;x<W;x+=40){sctx.beginPath();sctx.moveTo(x,0);sctx.lineTo(x,H);sctx.stroke();}
 for(let y=0;y<H;y+=40){sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(W,y);sctx.stroke();}

 const type=sim.type;

 if(type==='1d'){
 drawGround(H*0.62);
 const bx=Math.max(20,Math.min(W-20,sim.x||60)), by=H*0.50;
 drawArrowS(bx,by,bx+gV()*7,by,'#3b82f6','v');
 drawBall(bx,by+18,13,'#60a5fa','#1d4ed8');
 drawRuler(0,H*0.62,W,H*0.62);
 }
 else if(type==='accel'){
 drawGround(H*0.65);
 const bx=Math.max(20,Math.min(W-20,sim.x||40)), by=H*0.51;
 const cv=(gA()*sim.t); drawArrowS(bx,by,bx+Math.min(cv*7,60),by,'#06b6d4','v');
 drawArrowS(bx,by+18,bx+28,by+18,'#f59e0b','a');
 drawBall(bx,by+32,13,'#34d399','#065f46');
 // v-t mini graph inset
 drawMiniGraph(W-70,H-55,60,45);
 }
 else if(type==='freefall'){
 const bx=W/2, by=Math.min(H*0.82,sim.y||H*0.08);
 sctx.setLineDash([3,7]); sctx.strokeStyle='rgba(59,130,246,.25)'; sctx.lineWidth=1.5;
 sctx.beginPath(); sctx.moveTo(bx,H*0.08); sctx.lineTo(bx,by); sctx.stroke(); sctx.setLineDash([]);
 drawArrowS(bx+22,by,bx+22,by+28,'#f59e0b','g');
 drawBall(bx,by,13,'#fb923c','#9a3412');
 sctx.fillStyle='#1e2d4a'; sctx.fillRect(0,H*0.82,W,4);
 }
 else if(type==='projectile'){
 const ang=gAng(), v=gV();
 sctx.beginPath(); sctx.strokeStyle='rgba(139,92,246,.3)'; sctx.lineWidth=1.5; sctx.setLineDash([4,7]);
 for(let t2=0;t2<=5;t2+=0.04){
 const px=40+v*Math.cos(ang)*t2*45;
 const py=H*0.78-(v*Math.sin(ang)*t2-0.5*9.8*t2*t2)*18;
 if(t2===0) sctx.moveTo(px,py); else sctx.lineTo(px,py);
 if(py>H*0.82) break;
 } sctx.stroke(); sctx.setLineDash([]);
 // Trail
 if(sim.trail.length>2){
 sctx.beginPath(); sctx.strokeStyle='rgba(6,182,212,.4)'; sctx.lineWidth=2;
 sim.trail.forEach((p,i)=>i===0?sctx.moveTo(p.x,p.y):sctx.lineTo(p.x,p.y)); sctx.stroke();
 }
 sctx.fillStyle='#1e2d4a'; sctx.fillRect(0,H*0.82,W,4);
 const bx=Math.max(20,Math.min(W-20,sim.x||40)), by=Math.max(20,sim.y||H*0.78);
 const vy=Math.max(0,v*Math.sin(ang)-9.8*sim.t);
 const vx=v*Math.cos(ang);
 drawArrowS(bx,by,bx+vx*5,by,'#3b82f6','vₓ');
 drawArrowS(bx,by,bx,by-vy*5,'#10b981','vᵧ');
 drawBall(bx,by,12,'#c084fc','#6d28d9');
 // Angle arc
 sctx.beginPath(); sctx.strokeStyle='#f59e0b'; sctx.lineWidth=1.5;
 sctx.arc(40,H*0.82,32,-ang,0); sctx.stroke();
 sctx.fillStyle='#f59e0b'; sctx.font='11px JetBrains Mono';
 sctx.fillText(document.getElementById('slAngle').value+'°',72,H*0.82-6);
 }
 else if(type==='circular'){
 const cx=W/2, cy=H/2, r=Math.min(W,H)*0.28;
 sctx.beginPath(); sctx.arc(cx,cy,r,0,Math.PI*2);
 sctx.strokeStyle='rgba(59,130,246,.18)'; sctx.lineWidth=1.5; sctx.setLineDash([5,6]); sctx.stroke(); sctx.setLineDash([]);
 drawBall(cx,cy,4,'#1e2d4a','#263554');
 const bx=sim.x||cx+r, by=sim.y||cy;
 sctx.beginPath(); sctx.strokeStyle='rgba(16,185,129,.4)'; sctx.lineWidth=1.5;
 sctx.moveTo(cx,cy); sctx.lineTo(bx,by); sctx.stroke();
 const dx=cx-bx, dy=cy-by, mg=Math.sqrt(dx*dx+dy*dy);
 drawArrowS(bx,by,bx+dx/mg*28,by+dy/mg*28,'#f59e0b','ac');
 const tx=-dy/mg, ty=dx/mg;
 drawArrowS(bx,by,bx+tx*28,by+ty*28,'#3b82f6','v');
 drawBall(bx,by,13,'#22d3ee','#0891b2');
 sctx.fillStyle='rgba(100,116,139,.5)'; sctx.font='10px JetBrains Mono';
 sctx.fillText('ω = v/r',cx-25,cy+r+18);
 }
 else if(type==='vectors'){
 const cx=W*0.3, cy=H/2, v=gV(), a=gA(), t=sim.t||0;
 const Ax=v*22,Ay=0;
 const Bx=a*16*Math.cos(t*0.4), By=-a*16*Math.sin(t*0.4);
 drawArrowS(cx,cy,cx+Ax,cy+Ay,'#3b82f6','A');
 drawArrowS(cx+Ax,cy+Ay,cx+Ax+Bx,cy+Ay+By,'#10b981','B');
 sctx.beginPath(); sctx.strokeStyle='#f87171'; sctx.lineWidth=2.5; sctx.setLineDash([5,5]);
 sctx.moveTo(cx,cy); sctx.lineTo(cx+Ax+Bx,cy+Ay+By); sctx.stroke(); sctx.setLineDash([]);
 sctx.fillStyle='#f87171'; sctx.font='700 10px JetBrains Mono';
 sctx.fillText('R',cx+(Ax+Bx)/2-4,cy+(Ay+By)/2-8);
 const mag=Math.sqrt((Ax+Bx)**2+(Ay+By)**2).toFixed(1);
 sctx.fillStyle='#64748b'; sctx.font='10px JetBrains Mono';
 sctx.fillText('|R|='+mag,10,H-12);
 sctx.fillText('Triangle Law →',10,16);
 }
 else if(type==='relative'){
 drawGround(H*0.42); drawGround(H*0.72);
 const v1=gV(), v2=gV2();
 const b1x=(sim.x||50)%(W-30)+20;
 const b2x=(sim.y||100)%(W-30)+20;
 drawBall(b1x,H*0.32,11,'#60a5fa','#1d4ed8');
 drawArrowS(b1x,H*0.32,b1x+v1*8,H*0.32,'#3b82f6','v₁='+v1);
 drawBall(b2x,H*0.62,11,'#34d399','#065f46');
 drawArrowS(b2x,H*0.62,b2x+v2*8,H*0.62,'#10b981','v₂='+v2);
 sctx.fillStyle='#64748b'; sctx.font='700 10px JetBrains Mono';
 sctx.fillText('v_rel = v₁ − v₂ = '+(v1-v2)+' m/s',8,H-12);
 }
}

function drawGround(y){
 sctx.strokeStyle='#1e2d4a'; sctx.lineWidth=2;
 sctx.beginPath(); sctx.moveTo(0,y); sctx.lineTo(simCanvas.width,y); sctx.stroke();
}
function drawBall(x,y,r,c1,c2){
 const g=sctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
 g.addColorStop(0,c1); g.addColorStop(1,c2);
 sctx.beginPath(); sctx.arc(x,y,r,0,Math.PI*2);
 sctx.fillStyle=g; sctx.fill();
 sctx.strokeStyle='rgba(255,255,255,.1)'; sctx.lineWidth=1; sctx.stroke();
}
function drawArrowS(x1,y1,x2,y2,color,label){
 const dx=x2-x1,dy=y2-y1;
 if(Math.abs(dx)<3&&Math.abs(dy)<3) return;
 sctx.strokeStyle=color; sctx.lineWidth=2; sctx.setLineDash([]);
 sctx.beginPath(); sctx.moveTo(x1,y1); sctx.lineTo(x2,y2); sctx.stroke();
 const ang=Math.atan2(dy,dx);
 sctx.fillStyle=color; sctx.beginPath();
 sctx.moveTo(x2,y2);
 sctx.lineTo(x2-8*Math.cos(ang-.4),y2-8*Math.sin(ang-.4));
 sctx.lineTo(x2-8*Math.cos(ang+.4),y2-8*Math.sin(ang+.4));
 sctx.closePath(); sctx.fill();
 if(label){ sctx.fillStyle=color; sctx.font='700 9px JetBrains Mono'; sctx.fillText(label,x2+4,y2-3); }
}
function drawRuler(x1,y,x2){
 sctx.fillStyle='#1e2d4a'; sctx.fillRect(x1,y,x2-x1,2);
 for(let i=0;i<=8;i++){
 const x=x1+i*(x2-x1)/8;
 sctx.fillStyle='#475569'; sctx.font='9px JetBrains Mono';
 sctx.fillText(i+'m',x-5,y+14);
 }
}
function drawMiniGraph(x,y,w,h){
 sctx.fillStyle='rgba(7,9,15,.7)'; sctx.strokeStyle='#1e2d4a'; sctx.lineWidth=1;
 sctx.beginPath(); sctx.rect(x,y,w,h); sctx.fill(); sctx.stroke();
 sctx.strokeStyle='#3b82f6'; sctx.lineWidth=1.5;
 sctx.beginPath(); sctx.moveTo(x+4,y+h-4);
 const steps=20;
 for(let i=0;i<=steps;i++){
 const t2=i/steps*Math.min(sim.t+0.1,3);
 const vv=gA()*t2;
 const px=x+4+i*(w-8)/steps;
 const py=y+h-4-Math.min(vv/30*(h-8),h-8);
 if(i===0) sctx.moveTo(px,py); else sctx.lineTo(px,py);
 } sctx.stroke();
 sctx.fillStyle='#475569'; sctx.font='8px JetBrains Mono';
 sctx.fillText('v-t',x+2,y+10);
}

drawSim();

// ══════════════════════════════════════════════════
// GRAPH PANEL
// ══════════════════════════════════════════════════
const gCanvas = document.getElementById('graphCanvas');
const gctx = gCanvas.getContext('2d');

function resizeGraph(){
 const wrap = gCanvas.parentElement;
 gCanvas.width = wrap.clientWidth - 24;
 gCanvas.height = Math.min(window.innerHeight*0.4, 320);
}
resizeGraph();

function drawGraph(){
 resizeGraph();
 const W=gCanvas.width, H=gCanvas.height;
 const type=document.getElementById('graphType').value;
 const u=+document.getElementById('gU').value||20;
 const a=+document.getElementById('gA').value||5;
 gctx.clearRect(0,0,W,H);

 const PAD={t:20,r:20,b:40,l:55};
 const PW=W-PAD.l-PAD.r, PH=H-PAD.t-PAD.b;

 // Background
 gctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#07090f';
 gctx.fillRect(0,0,W,H);
 // Grid
 gctx.strokeStyle='rgba(30,45,74,0.7)'; gctx.lineWidth=1;
 for(let i=0;i<=5;i++){
 const y=PAD.t+PH*i/5;
 gctx.beginPath(); gctx.moveTo(PAD.l,y); gctx.lineTo(PAD.l+PW,y); gctx.stroke();
 const x=PAD.l+PW*i/5;
 gctx.beginPath(); gctx.moveTo(x,PAD.t); gctx.lineTo(x,PAD.t+PH); gctx.stroke();
 }
 // Axes
 gctx.strokeStyle='#263554'; gctx.lineWidth=1.5;
 gctx.beginPath(); gctx.moveTo(PAD.l,PAD.t); gctx.lineTo(PAD.l,PAD.t+PH); gctx.lineTo(PAD.l+PW,PAD.t+PH); gctx.stroke();

 const legendItems=[];

 function plotLine(points,color,label){
 if(points.length<2) return;
 gctx.strokeStyle=color; gctx.lineWidth=2.5; gctx.setLineDash([]);
 gctx.beginPath();
 points.forEach((p,i)=>{ i===0?gctx.moveTo(p.px,p.py):gctx.lineTo(p.px,p.py); });
 gctx.stroke();
 legendItems.push({color,label});
 }

 function toPixel(xv,yv,xMax,yMin,yMax){
 return { px: PAD.l+xv/xMax*PW, py: PAD.t+PH-(yv-yMin)/(yMax-yMin||1)*PH };
 }

 if(type==='xt'){
 const tMax=10, pts1=[],pts2=[];
 let yMax=u*tMax+0.5*a*tMax*tMax+1, yMin=0;
 for(let t=0;t<=tMax;t+=0.1){
 pts1.push(toPixel(t,u*t,tMax,yMin,yMax));
 pts2.push(toPixel(t,u*t+0.5*a*t*t,tMax,yMin,yMax));
 }
 plotLine(pts1,'#3b82f6',`Uniform (v=${u}m/s)`);
 plotLine(pts2,'#10b981',`Accelerated (a=${a}m/s²)`);
 drawAxisLabels(gctx,PAD,PW,PH,'Time (s)','Position (m)',10,yMax);
 }
 else if(type==='vt'){
 const tMax=10, pts1=[],pts2=[];
 for(let t=0;t<=tMax;t+=0.1){
 pts1.push(toPixel(t,u,tMax,0,u+a*tMax+1));
 pts2.push(toPixel(t,u+a*t,tMax,0,u+a*tMax+1));
 }
 // Shade area = displacement
 gctx.fillStyle='rgba(59,130,246,.08)';
 gctx.beginPath(); gctx.moveTo(PAD.l,PAD.t+PH);
 pts2.forEach(p=>gctx.lineTo(p.px,p.py));
 gctx.lineTo(PAD.l+PW,PAD.t+PH); gctx.closePath(); gctx.fill();
 gctx.fillStyle='rgba(16,185,129,.06)';
 gctx.beginPath(); gctx.moveTo(PAD.l,PAD.t+PH);
 pts1.forEach(p=>gctx.lineTo(p.px,p.py));
 gctx.lineTo(PAD.l+PW,PAD.t+PH); gctx.closePath(); gctx.fill();
 plotLine(pts1,'#10b981',`Constant v=${u}m/s`);
 plotLine(pts2,'#3b82f6',`u=${u}, a=${a}m/s²`);
 // Slope annotation
 gctx.fillStyle='rgba(245,158,11,.8)'; gctx.font='700 10px JetBrains Mono';
 gctx.fillText('slope = a = '+a+' m/s²',PAD.l+PW*0.4,PAD.t+20);
 drawAxisLabels(gctx,PAD,PW,PH,'Time (s)','Velocity (m/s)',10,u+a*tMax+1);
 }
 else if(type==='at'){
 const tMax=10, pts=[];
 for(let t=0;t<=tMax;t+=0.1) pts.push(toPixel(t,a,tMax,-1,a+2));
 plotLine(pts,'#f59e0b',`a = ${a} m/s² (uniform)`);
 gctx.fillStyle='rgba(245,158,11,.6)'; gctx.font='700 10px JetBrains Mono';
 gctx.fillText('Area = Δv',PAD.l+PW*0.4,PAD.t+PH*0.5);
 drawAxisLabels(gctx,PAD,PW,PH,'Time (s)','Acceleration (m/s²)',10,a+2);
 }
 else if(type==='range'){
 const pts=[]; let yMax=0;
 for(let deg=0;deg<=90;deg+=1){
 const r=u*u*Math.sin(2*deg*Math.PI/180)/9.8;
 if(r>yMax) yMax=r;
 pts.push(toPixel(deg,r,90,0,yMax));
 }
 // Recalculate with correct yMax
 const pts2=[];
 for(let deg=0;deg<=90;deg+=1){
 const r=u*u*Math.sin(2*deg*Math.PI/180)/9.8;
 pts2.push(toPixel(deg,r,90,0,yMax*1.05));
 }
 plotLine(pts2,'#8b5cf6',`Range (u=${u}m/s)`);
 // 45° marker
 const p45=pts2[45];
 gctx.beginPath(); gctx.arc(p45.px,p45.py,5,0,Math.PI*2);
 gctx.fillStyle='#f59e0b'; gctx.fill();
 gctx.fillStyle='#f59e0b'; gctx.font='700 10px JetBrains Mono';
 gctx.fillText('Max at 45°',p45.px+8,p45.py-6);
 drawAxisLabels(gctx,PAD,PW,PH,'Angle (°)','Range (m)',90,yMax*1.05);
 }
 else if(type==='height'){
 const pts2=[]; let yMax=0;
 for(let deg=0;deg<=90;deg+=1){
 const h=u*u*Math.sin(deg*Math.PI/180)**2/(2*9.8);
 if(h>yMax) yMax=h;
 }
 for(let deg=0;deg<=90;deg+=1){
 const h=u*u*Math.sin(deg*Math.PI/180)**2/(2*9.8);
 pts2.push(toPixel(deg,h,90,0,yMax*1.05));
 }
 plotLine(pts2,'#f43f5e',`Max Height (u=${u}m/s)`);
 drawAxisLabels(gctx,PAD,PW,PH,'Angle (°)','Height (m)',90,yMax*1.05);
 }

 // Legend
 const leg=document.getElementById('graphLegend');
 leg.innerHTML=legendItems.map(l=>`<div class="gleg"><div class="gleg-dot" style="background:${l.color}"></div><span>${l.label}</span></div>`).join('');
}

function drawAxisLabels(ctx,PAD,PW,PH,xLabel,yLabel,xMax,yMax){
 ctx.fillStyle='#475569'; ctx.font='10px JetBrains Mono';
 // X ticks
 for(let i=0;i<=5;i++){
 const x=PAD.l+PW*i/5, val=(xMax*i/5).toFixed(0);
 ctx.fillText(val,x-8,PAD.t+PH+14);
 }
 // Y ticks
 for(let i=0;i<=5;i++){
 const y=PAD.t+PH*i/5, val=(yMax*(5-i)/5).toFixed(1);
 ctx.fillText(val,PAD.l-42,y+4);
 }
 // Labels
 ctx.fillStyle='#64748b'; ctx.font='11px JetBrains Mono';
 ctx.fillText(xLabel,PAD.l+PW/2-xLabel.length*3,PAD.t+PH+30);
 ctx.save(); ctx.translate(14,PAD.t+PH/2); ctx.rotate(-Math.PI/2);
 ctx.fillText(yLabel,-(yLabel.length*3.5),0); ctx.restore();
}

function formatMsg(text){
 // Escape HTML entities first for safety, then re-apply formatting
 let t = text;
 // Headers
 t = t.replace(/^### (.+)/gm,'<h4 style="color:var(--cyan);font-size:.88rem;margin:8px 0 3px;font-family:var(--font-head)">$1</h4>');
 t = t.replace(/^## (.+)/gm,'<h4 style="color:var(--cyan);font-size:.9rem;margin:8px 0 3px;font-family:var(--font-head)">$1</h4>');
 t = t.replace(/^# (.+)/gm,'<h4 style="color:var(--cyan);font-size:.95rem;margin:8px 0 3px;font-family:var(--font-head)">$1</h4>');
 // Bold & italic
 t = t.replace(/\*\*\*(.*?)\*\*\*/g,'<strong><em style="color:var(--amber)">$1</em></strong>');
 t = t.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#7dd3fc">$1</strong>');
 t = t.replace(/\*(.*?)\*/g,'<em style="color:var(--amber)">$1</em>');
 // Inline code
 t = t.replace(/`([^`]+)`/g,'<code style="background:rgba(59,130,246,.15);padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:.82em;color:#60a5fa">$1</code>');
 // FORMULA blocks
 t = t.replace(/FORMULA:\s*\n?([\s\S]*?)(?=\n\n|\n[A-Z⟶]|$)/gm,(m,eq)=>`<div class="fmla">${eq.trim()}</div>`);
 // Horizontal rule
 t = t.replace(/^---+$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">');
 // Numbered lists: lines starting with "1. 2. 3."
 t = t.replace(/((?:^\d+\.\s+.+\n?)+)/gm,(block)=>{
 const items=block.trim().split('\n').map(l=>l.replace(/^\d+\.\s+/,'').trim()).filter(Boolean);
 return '<ol style="padding-left:18px;margin:5px 0">'+items.map(i=>`<li style="margin:3px 0;color:var(--dim)">${i}</li>`).join('')+'</ol>';
 });
 // Bullet lists: lines starting with "- " or "• "
 t = t.replace(/((?:^[-•]\s+.+\n?)+)/gm,(block)=>{
 const items=block.trim().split('\n').map(l=>l.replace(/^[-•]\s+/,'').trim()).filter(Boolean);
 return '<ul style="padding-left:18px;margin:5px 0">'+items.map(i=>`<li style="margin:3px 0;color:var(--dim)">${i}</li>`).join('')+'</ul>';
 });
 // Paragraphs
 t = t.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
 return t;
}

Components: Aₓ = A cosθ, Aᵧ = A sinθ</div>
<strong>Addition Laws:</strong><br>• <strong>Triangle Law</strong>: Head-to-tail, resultant from first tail to last head<br>• <strong>Parallelogram Law</strong>: Resultant = diagonal<br><br>
<span class="badge b-tip">Unit Vectors</span> î, ĵ, k̂ have magnitude=1 and show pure direction. Any vector: <strong>A = Aₓî + Aᵧĵ + A_zk̂</strong><br><br>
<span class="badge b-sim"> Try it</span> Switch the simulation to "Vector Addition" above!`,

 projectile:`<h4> Projectile Motion</h4>
<span class="badge b-def">Key Idea</span> Horizontal & vertical motions are <strong>completely independent</strong>!<br><br>
<div class="fmla">uₓ = u cosθ (constant — no horizontal force!)
uᵧ = u sinθ (decreases due to gravity)
Time of Flight: T = 2u sinθ / g
Max Height: H = u² sin²θ / 2g
Range: R = u² sin(2θ) / g
Max Range: R_max = u²/g at θ = 45°</div>
<span class="badge b-tip"> Path Shape</span> Parabola! At highest point: vᵧ = 0 but vₓ ≠ 0<br><br>
<span class="badge b-sim"></span> Set simulation to Projectile and try changing the angle!`,

 circular:`<h4> Uniform Circular Motion</h4>
<span class="badge b-def">Key Idea</span> Speed is constant, but velocity changes (direction changes) → acceleration exists!<br><br>
<div class="fmla">Centripetal acceleration: aᶜ = v²/r = ω²r
Angular velocity: ω = 2π/T = 2πf (rad/s)
Linear velocity: v = rω
Period: T = 2πr/v</div>
<strong>Direction of aᶜ:</strong> Always toward the center (centripetal = center-seeking)<br><br>
<strong>Examples:</strong> Moon , car turning , ball on string 🪀, planet orbits `,

 relative:`<h4>↔ Relative Velocity</h4>
<span class="badge b-def">Concept</span> All motion is relative. The observed velocity depends on who's watching!<br><br>
<div class="fmla">v_AB = v_A − v_B (A relative to B)
Same direction: v_rel = |v_A − v_B|
Opposite: v_rel = v_A + v_B
2D: |v_AB| = √(v_A² + v_B² − 2v_A v_B cosθ)</div>
<strong>Rain-Man Problem:</strong> Tilt umbrella forward at angle arctan(v_man / v_rain) to stay dry! ️<br><br>
<span class="badge b-sim"></span> Try "Relative Velocity" in the simulation — watch both objects move!`
};

function setTopic(topic){
 currentTopic=topic;
 document.querySelectorAll('.sb-item').forEach(b=>{ b.classList.toggle('active',b.dataset.topic===topic); });
 // Update sim
 const simMap={projectile:'projectile',circular:'circular',vectors:'vectors',freefall:'freefall',acceleration:'accel',velocity:'1d',displacement:'1d',intro:'1d',graphs:'accel',equations:'accel',relative:'relative'};
 if(simMap[topic]){ document.getElementById('simType').value=simMap[topic]; changeSim(); }
 // Show card
 if(TOPIC_CARDS[topic]) addMsg('bot',TOPIC_CARDS[topic],true);
 // Quick prompts
 const qps=QUICK_PROMPTS[topic]||QUICK_PROMPTS.intro;
 document.getElementById('qpBar').innerHTML=qps.map(p=>`<button class="qp" onclick="sendQ(this)">${p}</button>`).join('');
 // XP for visiting — mark as partial first visit, done after quiz on that topic
 if(!visitedTopics.has(topic)){
 visitedTopics.add(topic); addXP(10);
 const dot=document.querySelector(`.sb-item[data-topic="${topic}"] .sb-prog`);
 if(dot){ dot.classList.remove('prog-none'); dot.classList.add('prog-partial'); }
 }
 switchTab('chat');
}

function markTopicDone(topic){
 const dot=document.querySelector(`.sb-item[data-topic="${topic}"] .sb-prog`);
 if(dot){ dot.classList.remove('prog-none','prog-partial'); dot.classList.add('prog-done'); }
}

function addXP(pts){
 xp+=pts;
 const level=Math.floor(xp/100)+1;
 const pct=xp%100;
 document.getElementById('xpLabel').textContent=`${pct} / 100 XP`;
 document.getElementById('xpLevel').textContent=`Lv.${level}`;
 document.getElementById('xpFill').style.width=pct+'%';
}

function toggleVoice(){
 if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
 showToast(' Voice not supported — try Chrome','#f43f5e'); return;
 }
 if(voiceRecording){ recognition?.stop(); voiceRecording=false;
 document.getElementById('voiceBtn').classList.remove('recording'); return;
 }
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 recognition=new SR(); recognition.lang='en-US'; recognition.interimResults=false;
 recognition.onresult=e=>{
 document.getElementById('userInput').value=e.results[0][0].transcript;
 voiceRecording=false; document.getElementById('voiceBtn').classList.remove('recording');
 sendMessage();
 };
 recognition.onerror=()=>{ voiceRecording=false; document.getElementById('voiceBtn').classList.remove('recording'); showToast(' Voice error','#f43f5e'); };
 recognition.start(); voiceRecording=true; document.getElementById('voiceBtn').classList.add('recording');
 showToast(' Listening…','var(--blue)');
}

let notes=[];
function saveNote(){
 const area=document.getElementById('noteArea');
 const tagEl=document.getElementById('noteTag');
 const text=area.value.trim();
 if(!text){ showToast('️ Write something first!','var(--amber)'); return; }
 const tag=tagEl.value.trim()||currentTopic;
 notes.unshift({ text, tag, time:new Date().toLocaleString() });
 area.value=''; tagEl.value='';
 renderNotes();
 showToast(' Note saved!');
 addXP(5);
}
function renderNotes(){
 const container=document.getElementById('notesSaved');
 if(!container) return;
 if(notes.length===0){ container.innerHTML='<div class="notes-empty">No notes yet. Write something above and hit Save! </div>'; return; }
 container.innerHTML=notes.map((n,i)=>`
 <div class="note-card">
 <div>
 <div class="note-card-text">${n.text.slice(0,200)}${n.text.length>200?'…':''}</div>
 <div style="font-size:.62rem;color:var(--muted);margin-top:3px">${n.time}</div>
 </div>
 <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
 <span class="note-card-tag">${n.tag}</span>
 <button class="note-del" onclick="deleteNote(${i})"></button>
 </div>
 </div>`).join('');
}
function deleteNote(i){ notes.splice(i,1); renderNotes(); showToast(' Note deleted','var(--rose)'); }
function clearNotes(){ if(notes.length===0) return; notes=[]; renderNotes(); showToast(' All notes cleared','var(--rose)'); }
function exportNotes(){
 if(notes.length===0){ showToast(' No notes to export','var(--amber)'); return; }
 const text=notes.map(n=>`[${n.tag}] ${n.time}\n${n.text}`).join('\n\n---\n\n');
 const blob=new Blob([text],{type:'text/plain'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download='kinematics_notes.txt'; a.click();
 showToast(' Notes exported!');
}

// QUIZ — topic-filtered AI quiz
// ══════════════════════════════════════════════════
const QUIZ_TOPICS=['All Topics','Intro & Basics','Distance & Displacement','Velocity & Speed','Acceleration','Equations of Motion','Motion Graphs','Free Fall','Vectors','Projectile Motion','Circular Motion','Relative Velocity'];
let selectedQuizTopic='All Topics';

function renderQuiz(){
 const wrap=document.getElementById('quizWrap');
 if(quizData.length===0){
 wrap.innerHTML=`
 <div style="width:100%;max-width:600px">
 <div style="font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Select Topic for Quiz</div>
 <div class="quiz-topic-bar">${QUIZ_TOPICS.map(t=>`<button class="qtopic-btn${t===selectedQuizTopic?' active':''}" onclick="selectQuizTopic('${t}')">${t}</button>`).join('')}</div>
 <div class="quiz-empty">
 <div style="font-size:2rem;margin-bottom:8px"></div>
 <div style="font-size:1rem;font-weight:600;color:var(--dim);margin-bottom:6px">Ready to test yourself?</div>
 <div style="color:var(--muted);font-size:.8rem;margin-bottom:16px">Topic: <strong style="color:var(--violet)">${selectedQuizTopic}</strong> · Earn 15 XP per correct answer!</div>
 <button class="quiz-gen-btn" onclick="startQuiz()"> Start from Bank</button>
 <button class="quiz-gen-btn" style="background:linear-gradient(135deg,var(--violet),var(--blue));margin-left:8px;margin-top:6px" onclick="generateAIQuiz()"> AI Generate Quiz</button>
 </div>
 </div>`;
 return;
 }
 if(quizIdx>=quizData.length){
 const pct=Math.round(quizScore/quizData.length*100);
 // Mark topic as done if score ≥ 60%
 if(pct>=60) markTopicDone(currentTopic);
 wrap.innerHTML=`<div class="quiz-result">
 <div class="big-score">${pct}%</div>
 <div style="font-size:1rem;color:var(--dim);margin:8px 0">${quizScore} / ${quizData.length} correct · +${quizScore*15} XP earned</div>
 <div style="font-size:.85rem;color:var(--muted);margin-bottom:20px">${pct>=80?' Excellent! Topic mastered!':pct>=60?' Good job! A bit more practice and you\'ll ace it.':' Keep going! Review the formulas and try again.'}</div>
 <button class="quiz-gen-btn" onclick="quizData=[];quizIdx=0;quizScore=0;renderQuiz()">← Back</button>
 <button class="quiz-gen-btn" onclick="startQuiz()" style="margin-left:6px">↺ Retry</button>
 <button class="quiz-gen-btn" onclick="generateAIQuiz()" style="background:linear-gradient(135deg,var(--violet),var(--blue));margin-left:6px"> New AI Quiz</button>
 </div>`;
 return;
 }
 const q=quizData[quizIdx];
 const progPct=Math.round(quizIdx/quizData.length*100);
 wrap.innerHTML=`
 <div class="quiz-prog-bar"><div class="quiz-prog-fill" style="width:${progPct}%"></div></div>
 <div class="quiz-header">
 <div class="quiz-progress">Question ${quizIdx+1} of ${quizData.length} · <span style="color:var(--violet)">${selectedQuizTopic}</span></div>
 <div class="quiz-score-badge">⭐ ${quizScore} correct</div>
 </div>
 <div class="quiz-card">
 <div class="quiz-q"><span class="qnum">Q${quizIdx+1}</span>${q.q}</div>
 <div class="quiz-opts" id="quizOpts">
 ${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
 </div>
 <div class="quiz-exp" id="quizExp">${q.exp||''}</div>
 <button class="quiz-next" id="quizNext" onclick="nextQuestion()">Next Question →</button>
 </div>`;
 quizLocked=false;
}

function selectQuizTopic(t){ selectedQuizTopic=t; renderQuiz(); }

function startQuiz(){
 // Filter quiz bank by topic if not "All Topics"
 let bank=QUIZ_BANK;
 if(selectedQuizTopic!=='All Topics'){
 const topicMap={'Vectors':['vector','scalar','resultant','unit vector'],'Projectile Motion':['projectile','range','trajectory','parabola'],'Free Fall':['free fall','drop','gravity','stone'],'Equations of Motion':['accelerat','SUVAT','equation']};
 const kws=Object.entries(topicMap).find(([k])=>selectedQuizTopic.includes(k));
 if(kws) bank=QUIZ_BANK.filter(q=>kws[1].some(kw=>q.q.toLowerCase().includes(kw)));
 if(bank.length<3) bank=QUIZ_BANK; // fallback
 }
 quizData=[...bank].sort(()=>Math.random()-.5).slice(0,8);
 quizIdx=0; quizScore=0; quizLocked=false; renderQuiz();
}

function answerQuiz(i){
 if(quizLocked) return; quizLocked=true;
 const q=quizData[quizIdx];
 const opts=document.querySelectorAll('.quiz-opt');
 opts.forEach((o,j)=>{
 if(j===q.ans) o.classList.add('correct');
 else if(j===i) o.classList.add('wrong');
 o.style.cursor='not-allowed';
 });
 if(i===q.ans){ quizScore++; addXP(15); showToast(' Correct! +15 XP'); }
 else{ addXP(3); showToast(' Incorrect. Read the explanation below.','var(--rose)'); }
 document.getElementById('quizExp').style.display='block';
 document.getElementById('quizNext').style.display='block';
}

function nextQuestion(){ quizIdx++; renderQuiz(); }

async function generateAIQuiz(){
 // Replaced by loadStaticQuiz: fetch the pre-generated bank for the
 // current selectedQuizTopic from same-origin (CSP allows). Bank
 // files live at ./quizzes/<topic>.json and are committed alongside
 // this HTML (M3 of the KineBot 1.D sprint).
 const wrap=document.getElementById('quizWrap');
 wrap.innerHTML=`<div style="color:var(--muted);text-align:center;padding:40px"><div style="font-size:.85rem">Loading questions on <strong style="color:var(--violet)">${selectedQuizTopic}</strong>...</div></div>`;
 try{
 const resp=await fetch(`./quizzes/${encodeURIComponent(selectedQuizTopic)}.json`);
 if(!resp.ok) throw new Error('bank-missing');
 const bank=await resp.json();
 const qs=Array.isArray(bank.questions)?bank.questions:[];
 if(qs.length===0) throw new Error('bank-empty');
 // Adapt the static-bank shape {prompt, options, correct, explanation}
 // into the existing renderQuiz shape {q, opts, ans, exp}.
 quizData=qs.map(q=>({q:q.prompt,opts:q.options,ans:q.correct,exp:q.explanation}));
 quizIdx=0; quizScore=0; quizLocked=false;
 renderQuiz();
 }catch(e){ startQuiz(); }
}

// (Patching the graph type select to add more options)
function patchGraphSelect(){
 const sel=document.getElementById('graphType');
 const extra=[
 {value:'decel',text:'Deceleration (v-t)'},
 {value:'freefall_xt',text:'Free Fall (x-t)'},
 ];
 extra.forEach(o=>{ const opt=document.createElement('option'); opt.value=o.value; opt.text=o.text; sel.appendChild(opt); });
}

// Patch drawGraph to handle extra types
const _origDrawGraph=drawGraph;
function drawGraph(){
 const type=document.getElementById('graphType').value;
 if(type==='decel'||type==='freefall_xt'){
 resizeGraph();
 const W=gCanvas.width,H=gCanvas.height;
 const u=+document.getElementById('gU').value||20;
 const a=+document.getElementById('gA').value||5;
 const PAD={t:20,r:20,b:40,l:55};
 const PW=W-PAD.l-PAD.r,PH=H-PAD.t-PAD.b;
 gctx.clearRect(0,0,W,H);
 gctx.fillStyle='#07090f'; gctx.fillRect(0,0,W,H);
 gctx.strokeStyle='rgba(30,45,74,0.7)'; gctx.lineWidth=1;
 for(let i=0;i<=5;i++){
 gctx.beginPath(); gctx.moveTo(PAD.l,PAD.t+PH*i/5); gctx.lineTo(PAD.l+PW,PAD.t+PH*i/5); gctx.stroke();
 gctx.beginPath(); gctx.moveTo(PAD.l+PW*i/5,PAD.t); gctx.lineTo(PAD.l+PW*i/5,PAD.t+PH); gctx.stroke();
 }
 gctx.strokeStyle='#263554'; gctx.lineWidth=1.5;
 gctx.beginPath(); gctx.moveTo(PAD.l,PAD.t); gctx.lineTo(PAD.l,PAD.t+PH); gctx.lineTo(PAD.l+PW,PAD.t+PH); gctx.stroke();
 const legendItems=[];
 function toP(xv,yv,xMax,yMin,yMax){ return {px:PAD.l+xv/xMax*PW,py:PAD.t+PH-(yv-yMin)/(yMax-yMin||1)*PH}; }
 if(type==='decel'){
 // Object decelerating from u to 0
 const tStop=u/a, pts=[];
 for(let t=0;t<=tStop+0.1;t+=0.05){
 const v=Math.max(0,u-a*t); pts.push(toP(t,v,tStop*1.2,0,u*1.1));
 }
 gctx.strokeStyle='#f43f5e'; gctx.lineWidth=2.5; gctx.setLineDash([]);
 gctx.beginPath(); pts.forEach((p,i)=>i===0?gctx.moveTo(p.px,p.py):gctx.lineTo(p.px,p.py)); gctx.stroke();
 // Stop marker
 const stopPx=PAD.l+(tStop/(tStop*1.2))*PW;
 gctx.strokeStyle='rgba(245,158,11,.6)'; gctx.lineWidth=1; gctx.setLineDash([4,4]);
 gctx.beginPath(); gctx.moveTo(stopPx,PAD.t); gctx.lineTo(stopPx,PAD.t+PH); gctx.stroke(); gctx.setLineDash([]);
 gctx.fillStyle='#f59e0b'; gctx.font='700 10px JetBrains Mono';
 gctx.fillText('stops at t='+tStop.toFixed(1)+'s',stopPx-55,PAD.t+15);
 // Shade area = displacement
 gctx.fillStyle='rgba(244,63,94,.08)';
 gctx.beginPath(); gctx.moveTo(PAD.l,PAD.t+PH);
 pts.forEach(p=>gctx.lineTo(p.px,p.py)); gctx.lineTo(PAD.l+PW*Math.min(1,tStop/(tStop*1.2)),PAD.t+PH); gctx.closePath(); gctx.fill();
 gctx.fillStyle='#f43f5e'; gctx.font='10px JetBrains Mono';
 gctx.fillText('Area = displacement = '+(u*tStop/2).toFixed(1)+'m',PAD.l+10,PAD.t+PH-8);
 drawAxisLabels(gctx,PAD,PW,PH,'Time (s)','Velocity (m/s)',tStop*1.2,u*1.1);
 document.getElementById('graphLegend').innerHTML=`<div class="gleg"><div class="gleg-dot" style="background:#f43f5e"></div><span>Deceleration: u=${u}m/s, a=-${a}m/s²</span></div>`;
 } else {
 // Free fall x-t
 const tMax=Math.sqrt(2*200/9.8);
 const pts=[];
 for(let t=0;t<=tMax;t+=0.1){ pts.push(toP(t,0.5*9.8*t*t,tMax,0,0.5*9.8*tMax*tMax*1.05)); }
 gctx.strokeStyle='#fb923c'; gctx.lineWidth=2.5;
 gctx.beginPath(); pts.forEach((p,i)=>i===0?gctx.moveTo(p.px,p.py):gctx.lineTo(p.px,p.py)); gctx.stroke();
 gctx.fillStyle='rgba(245,158,11,.7)'; gctx.font='700 10px JetBrains Mono';
 gctx.fillText('h = ½gt² (parabola)',PAD.l+10,PAD.t+20);
 drawAxisLabels(gctx,PAD,PW,PH,'Time (s)','Height fallen (m)',tMax,0.5*9.8*tMax*tMax*1.05);
 document.getElementById('graphLegend').innerHTML=`<div class="gleg"><div class="gleg-dot" style="background:#fb923c"></div><span>Free Fall: h = ½gt² (g=9.8m/s²)</span></div>`;
 }
 return;
 }
 _origDrawGraph();
}
