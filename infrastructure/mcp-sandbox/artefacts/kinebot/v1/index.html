<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KineBot — Kinematics Workbench</title>
<style>
:root {
 --bg:#ffffff; --s1:#f8fafc; --s2:#f1f5f9; --s3:#e2e8f0;
 --border:#e2e8f0; --border2:#cbd5e1;
 --blue:#2563eb; --cyan:#0891b2; --violet:#7c3aed;
 --green:#16a34a; --amber:#d97706; --rose:#e11d48;
 --text:#0f172a; --dim:#475569; --muted:#64748b;
 --glow:rgba(37,99,235,.08);
 --font-body:'Inter',sans-serif;
 --font-head:'Syne',sans-serif;
 --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ═══ SCROLLBARS ═══ */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ═══ MAIN ═══ */
.main{display:flex;flex:1;overflow:hidden;}

/* ═══ CONTENT AREA ═══ */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* ═══ SIM PANEL — fills the whole iframe (sim-only artefact) ═══ */
.sim-panel{flex:1;min-height:0;display:flex;gap:0;}
.sim-canvas-wrap{flex:1;background:var(--bg);position:relative;overflow:hidden;min-width:0;min-height:240px;}
canvas#simCanvas{width:100%;height:100%;display:block;}
.sim-overlay{position:absolute;top:8px;left:10px;display:flex;gap:6px;flex-wrap:wrap;}
.sim-tag{font-size:.62rem;font-family:var(--font-mono);padding:2px 7px;border-radius:4px;
 background:rgba(248,250,252,.95);border:1px solid var(--border2);color:var(--cyan);}
.sim-right{width:175px;flex-shrink:0;background:var(--s1);border-left:1px solid var(--border);
 display:flex;flex-direction:column;padding:10px;gap:7px;overflow-y:auto;}
.sr-title{font-size:.68rem;font-weight:700;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase;}
.sr-select{width:100%;font-size:.7rem;padding:5px 7px;border-radius:6px;
 background:var(--s2);border:1px solid var(--border);color:var(--dim);cursor:pointer;font-family:var(--font-body);}
.sr-row{display:flex;align-items:center;gap:6px;}
.sr-row label{font-size:.67rem;color:var(--muted);width:50px;flex-shrink:0;}
.sr-row input[type=range]{flex:1;min-width:0;accent-color:var(--blue);cursor:pointer;}
.sr-row .val{font-size:.67rem;font-family:var(--font-mono);color:var(--blue);width:38px;text-align:right;}
.sr-btns{display:flex;gap:5px;}
.sr-btn{flex:1;padding:5px 0;font-size:.7rem;font-weight:600;border-radius:6px;
 border:1px solid var(--border);background:var(--s2);color:var(--dim);cursor:pointer;transition:all .12s;}
.sr-btn:hover,.sr-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.sr-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.sstat{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:4px 6px;}
.sstat-l{font-size:.58rem;color:var(--muted);}
.sstat-v{font-size:.7rem;font-family:var(--font-mono);color:var(--cyan);}

/* ═══ COPY TOAST ═══ */
.toast{position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:8px;
 background:var(--green);color:#fff;font-size:.8rem;font-weight:600;z-index:999;
 opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* ═══ RESPONSIVE ═══ */
/* Sim-only artefact: on narrow viewports stack the controls BELOW the
 canvas instead of squeezing a fixed-width column beside it (that was
 the cramped-overflow bug). The canvas keeps a min-height so it stays
 usable; the controls flow full-width underneath. */
@media(max-width:760px){
 .sim-panel{flex-direction:column;}
 .sim-right{width:100%;flex-shrink:0;border-left:none;border-top:1px solid var(--border);
  flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;}
 .sim-canvas-wrap{min-height:280px;}
 .sr-title{width:100%;}
 .sr-select{flex:1 1 100%;}
 .sr-row{flex:1 1 140px;}
 .sr-btns{flex:1 1 100%;}
 .sr-stats{flex:1 1 100%;}
}
</style>
</head>
<body>

<div class="main">

<!-- ══ CONTENT — SIM ONLY. Quiz + graph + topic nav + formulas + notes
        all live in the React workbench (the host). This iframe is the
        single live simulation surface, full-height + responsive. ══ -->
<div class="content">

 <!-- TOAST -->
 <div class="toast" id="toast"></div>

 <!-- TOPIC NAV — self-contained (USR-1): was in the React workbench; clicking a
      tab switches the sim (__applyTopic) AND emits to the tutor. -->
 <style>#topicTabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc}#topicTabs button{flex:0 0 auto;padding:6px 11px;border:1px solid #cbd5e1;background:#fff;border-radius:999px;font:inherit;font-size:.8rem;cursor:pointer;color:#334155;white-space:nowrap}#topicTabs button:hover{background:#f1f5f9}#topicTabs button.active{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}</style>
 <div id="topicTabs">
  <button data-topic="intro" class="active">Intro</button>
  <button data-topic="displacement">Displacement</button>
  <button data-topic="velocity">Velocity</button>
  <button data-topic="graphs">Motion graphs</button>
  <button data-topic="acceleration">Acceleration</button>
  <button data-topic="equations">Equations</button>
  <button data-topic="freefall">Free fall</button>
  <button data-topic="vectors">Vectors</button>
  <button data-topic="projectile">Projectile</button>
  <button data-topic="circular">Circular</button>
  <button data-topic="relative">Relative</button>
 </div>

 <!-- SIMULATION (fills the whole iframe) -->
 <div class="sim-panel" id="simPanel">
 <div class="sim-canvas-wrap">
 <canvas id="simCanvas"></canvas>
 <div class="sim-overlay">
 <span class="sim-tag" id="simLabel">1D Uniform</span>
 <span class="sim-tag" id="simFormula">x = vt</span>
 </div>
 </div>
 <div class="sim-right">
 <div class="sr-title" id="srTitle">Simulator</div>
 <select class="sr-select" id="simType" onchange="changeSim()">
 <option value="1d">1D Uniform Motion</option>
 <option value="accel">Uniformly Accelerated</option>
 <option value="projectile">Projectile Motion</option>
 <option value="circular">Circular Motion</option>
 <option value="vectors">Vector Addition</option>
 <option value="freefall">Free Fall</option>
 <option value="relative">Relative Velocity</option>
 </select>
 <div class="sr-row"><label>Velocity</label><input type="range" id="slV" min="1" max="12" value="5" oninput="updateSim()"><span class="val" id="lblV">5</span></div>
 <div class="sr-row" id="rowA"><label>Accel.</label><input type="range" id="slA" min="0" max="10" value="3" oninput="updateSim()"><span class="val" id="lblA">3</span></div>
 <div class="sr-row" id="rowAngle" style="display:none"><label>Angle</label><input type="range" id="slAngle" min="5" max="85" value="45" oninput="updateSim()"><span class="val" id="lblAngle">45°</span></div>
 <div class="sr-row" id="rowV2" style="display:none"><label>V₂</label><input type="range" id="slV2" min="1" max="12" value="3" oninput="updateSim()"><span class="val" id="lblV2">3</span></div>
 <div class="sr-btns">
 <button class="sr-btn on" id="btnPlay" onclick="togglePlay()">Play</button>
 <button class="sr-btn" onclick="resetSim()">Reset</button>
 </div>
 <div class="sr-stats">
 <div class="sstat"><div class="sstat-l">Position</div><div class="sstat-v" id="stX">0 m</div></div>
 <div class="sstat"><div class="sstat-l">Velocity</div><div class="sstat-v" id="stV">0 m/s</div></div>
 <div class="sstat"><div class="sstat-l">Time</div><div class="sstat-v" id="stT">0 s</div></div>
 <div class="sstat"><div class="sstat-l">Accel.</div><div class="sstat-v" id="stA">0 m/s²</div></div>
 </div>
 </div>
 </div>

</div><!-- /content -->
</div><!-- /main -->

<!-- @aipla-bridge:start (GENERATED — edit infrastructure/mcp-sandbox/bridge/aipla-mcp-bridge.js, then `make sim-build`) -->
<script>
/* ============================================================================
 * AIPLA MCP App guest bridge — ONE canonical transport for every host.
 *
 * SOURCE OF TRUTH. This file is inlined verbatim into every artefact's
 * index.html between the `@aipla-bridge:start … @aipla-bridge:end` markers by
 * `scripts/build-artefact-bridge.mjs` (run `make sim-build`). NEVER hand-edit
 * the inlined copy — edit THIS file and rebuild. CI (`--check`) fails on drift.
 *
 * It speaks whichever host is present:
 *   - AIPLA app / SEP-1865 hosts  → JSON-RPC `ui/update-model-context` over
 *                                   window.parent.postMessage (the app reads
 *                                   structuredContent + renders the trust card).
 *   - ChatGPT (OpenAI Apps SDK)   → window.openai.setWidgetState (durable state)
 *                                   + window.openai.sendFollowUpMessage (turns a
 *                                   deliberate commit into an immediate turn).
 *   - Claude Desktop / Inspector  → the same SEP-1865 postMessage + `content`.
 *
 * The window.openai block is guarded end-to-end: absent in the AIPLA app and
 * Claude, so it is a pure no-op there and the postMessage path stays
 * authoritative. See docs/design/aipla/v1.1.0-feedback/shared-mcp-app-bridge.md.
 *
 * Public surface (window.AIPLA_BRIDGE):
 *   emit(kind, extra)                 — report a student interaction. `kind` is
 *                                       the FULL event kind (e.g. "boldkast.play").
 *                                       `extra.label` (a curated string) marks a
 *                                       DELIBERATE COMMIT — only labelled emits
 *                                       inject a ChatGPT follow-up turn.
 *   init({ name, version })           — run the ui/initialize handshake. Call once
 *                                       at the bottom of the artefact script.
 *   onChatFlush(cb)                   — cb() runs on ui/notifications/chat-flush.
 *   onHostNotification(method, cb)    — cb(params, msg) runs on any host→iframe
 *                                       JSON-RPC notification with that method.
 *   hostContext()                     — the hostContext returned by ui/initialize.
 *
 * Conservative JS (var/function) so it runs unchanged in any host iframe engine.
 * ========================================================================== */
(function () {
  "use strict";

  var __rpcNextId = 1;
  var __initialized = false;
  var __pendingEmits = [];
  var __hostContext = null;
  var __handlers = {}; // method -> [cb]

  function __post(msg) {
    try {
      // targetOrigin "*" is safe: the outer sandbox proxy validates origin on
      // its side per ADR-013, then re-postMessages to the host with the host's
      // specific origin. In standalone (artefact opened directly) parent may not
      // exist — swallow.
      window.parent.postMessage(msg, "*");
    } catch (e) {
      /* no host */
    }
  }

  function rpcNotify(method, params) {
    __post({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function rpcRequest(method, params) {
    return new Promise(function (resolve, reject) {
      var id = __rpcNextId++;
      var listener = function (e) {
        var d = e.data;
        if (!d || d.id !== id) return;
        window.removeEventListener("message", listener);
        if (d.result !== undefined) resolve(d.result);
        else reject(new Error((d.error && d.error.message) || "rpc error"));
      };
      window.addEventListener("message", listener);
      __post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  // Single host→iframe listener: respond to ping (spec), dispatch registered
  // notification handlers. rpcRequest installs its own short-lived id-matched
  // listener separately for responses.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.jsonrpc !== "2.0") return;
    if (d.method === "ping" && d.id !== undefined && d.id !== null) {
      __post({ jsonrpc: "2.0", id: d.id, result: {} });
      return;
    }
    if (d.method && __handlers[d.method]) {
      var cbs = __handlers[d.method];
      for (var i = 0; i < cbs.length; i++) {
        try {
          cbs[i](d.params, d);
        } catch (err) {
          /* a handler throwing must not break the bridge */
        }
      }
    }
  });

  // Derive a human-readable `content` text for generic MCP hosts (ChatGPT /
  // Claude feed `content` to the model and treat `structuredContent` as
  // schema-validated app data — without a text the model never sees the
  // interaction). Prefers the curated `label`; else summarises the payload.
  // The AIPLA frontend reads structuredContent and IGNORES content, so this is
  // purely additive for our own app.
  function __contentText(kind, p) {
    if (p && typeof p.label === "string" && p.label) return p.label;
    if (!p) return kind;
    var parts = [];
    for (var k in p) {
      if (k === "label") continue;
      var v = p[k];
      if (Array.isArray(v)) {
        parts.push(k + "=[" + v.length + "]");
      } else if (v && typeof v === "object") {
        for (var k2 in v) {
          if (v[k2] == null || typeof v[k2] !== "object") parts.push(k2 + "=" + v[k2]);
        }
      } else {
        parts.push(k + "=" + v);
      }
    }
    return kind + (parts.length ? " (" + parts.join(", ") + ")" : "");
  }

  function emit(kind, extra) {
    extra = extra || {};
    var sc = Object.assign({}, extra, { kind: kind });
    var params = { structuredContent: sc };
    var label = typeof extra.label === "string" && extra.label ? extra.label : "";
    var text = label || __contentText(kind, extra);
    if (text) params.content = [{ type: "text", text: text }];

    // ── ChatGPT (OpenAI Apps SDK) ──────────────────────────────────────────
    // Absent in the AIPLA app / Claude → whole block no-ops. Guard every call.
    var oa = typeof window !== "undefined" ? window.openai : undefined;
    if (oa) {
      try {
        if (oa.setWidgetState) oa.setWidgetState(sc);
      } catch (e) {
        /* best effort */
      }
      // Inject a turn ONLY on a deliberate commit (has a curated label) — never
      // on a passive settle or a derived-text event. Gated on `label`, NOT on
      // `content` (content is near-always present via __contentText).
      if (label && oa.sendFollowUpMessage) {
        try {
          oa.sendFollowUpMessage({ prompt: label });
        } catch (e) {
          /* best effort */
        }
      }
    }

    // ── SEP-1865 postMessage (AIPLA app + native hosts) — authoritative ─────
    var msg = { jsonrpc: "2.0", method: "ui/update-model-context", params: params };
    if (!__initialized) {
      __pendingEmits.push(msg);
      return;
    }
    __post(msg);
  }

  function onHostNotification(method, cb) {
    if (!__handlers[method]) __handlers[method] = [];
    __handlers[method].push(cb);
  }

  function onChatFlush(cb) {
    onHostNotification("ui/notifications/chat-flush", function () {
      cb();
    });
  }

  function init(clientInfo) {
    var ci = {
      name: (clientInfo && clientInfo.name) || "aipla-sim",
      version: (clientInfo && clientInfo.version) || "1.0.0",
    };
    // If parent isn't a sandbox proxy (standalone testing) this rejects and we
    // flip __initialized so queued emits stop queuing (they become __post
    // no-ops via the try/catch).
    rpcRequest("ui/initialize", {
      protocolVersion: "2026-01-26",
      capabilities: {},
      clientInfo: ci,
    })
      .then(function (result) {
        __hostContext = (result && result.hostContext) || null;
        rpcNotify("ui/notifications/initialized", { clientInfo: ci });
        __initialized = true;
        while (__pendingEmits.length) __post(__pendingEmits.shift());
      })
      .catch(function () {
        __initialized = true;
        __pendingEmits.length = 0;
      });
  }

  window.AIPLA_BRIDGE = {
    emit: emit,
    init: init,
    onChatFlush: onChatFlush,
    onHostNotification: onHostNotification,
    hostContext: function () {
      return __hostContext;
    },
  };
})();
</script>
<!-- @aipla-bridge:end -->
<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let currentTopic = 'intro';

// ══════════════════════════════════════════════════
// TELEMETRY — shared MCP App guest bridge (AIPLA_BRIDGE, inlined above from
// bridge/aipla-mcp-bridge.js — run `make sim-build`; never hand-edit it).
// It owns the SEP-1865 postMessage + window.openai channels, the ui/initialize
// handshake, ping + notification routing, the emit queue, and the content-text
// derivation. Local emit() just keeps kinebot's short event names by
// auto-prefixing "kinebot." (init + inbound handlers wired at the bottom).
// ══════════════════════════════════════════════════
function emit(event,payload){return AIPLA_BRIDGE.emit(event.indexOf('.')>=0?event:'kinebot.'+event,payload)}

// Map topic key (sent by the React workbench via kinebot.set-topic)
// to the iframe's simType + an English label, so a topic click in
// React selects the right sim. Topics that don't have a paired sim
// fall back to '1d' (uniform motion) — students can still take the
// quiz + plot graphs for that topic.
const __TOPIC_TO_SIM={
  intro:'1d', displacement:'1d', velocity:'1d', graphs:'1d',
  acceleration:'accel', equations:'accel',
  freefall:'freefall', vectors:'vectors',
  projectile:'projectile', circular:'circular', relative:'relative'
};
function __applyTopic(topic){
  if(typeof topic!=='string') return;
  currentTopic=topic;
  const simType=__TOPIC_TO_SIM[topic];
  if(simType){
    const sel=document.getElementById('simType');
    if(sel){sel.value=simType; if(typeof changeSim==='function') changeSim();}
  }
  document.querySelectorAll('#topicTabs button').forEach(b=>b.classList.toggle('active', b.dataset.topic===topic));
}
// USR-1: a topic-tab click switches the sim AND emits to the tutor (the React
// workbench used to emit kinebot.set-topic; the artefact now owns both).
function __selectTopic(topic){__applyTopic(topic); emit('set-topic',{topic:topic});}
document.querySelectorAll('#topicTabs button').forEach(b=>{b.addEventListener('click',()=>__selectTopic(b.dataset.topic));});

// Phase-2 commit-on-submit: slider input writes to pendingChanges;
// togglePlay (start) flushes as state-change with triggeredBy:'play'.
// Chat-flush from host also flushes as triggeredBy:'chat-submit'.
const pendingChanges={};
function flushPendingChanges(triggeredBy){
  const keys=Object.keys(pendingChanges);
  if(!keys.length) return;
  const params={velocity:gV(),acceleration:gA()};
  // Optional sliders only included if they're currently visible.
  if(document.getElementById('rowAngle')&&document.getElementById('rowAngle').style.display!=='none') params.angle=Math.round(gAng()*180/Math.PI);
  if(document.getElementById('rowV2')&&document.getElementById('rowV2').style.display!=='none') params.v2=gV2();
  emit('state-change',{changed:keys,state:params,triggeredBy:triggeredBy});
  for(const k of keys) delete pendingChanges[k];
}

// Inbound host->iframe notifications — set-topic + chat-flush. The bridge owns
// the ping responder + envelope parsing; we just register what each does.
AIPLA_BRIDGE.onHostNotification('kinebot.set-topic',function(params){if(params)__applyTopic(params.topic)});
AIPLA_BRIDGE.onChatFlush(function(){flushPendingChanges('chat-submit')});

// ══════════════════════════════════════════════════
// SIMULATION ENGINE
// ══════════════════════════════════════════════════
const simCanvas = document.getElementById('simCanvas');
const sctx = simCanvas.getContext('2d');
let sim = { playing:false, t:0, x:0, y:0, type:'1d', trail:[] };
let animId = null, lastTs = null;

function resizeSim(){
 const w = simCanvas.parentElement.clientWidth, h = simCanvas.parentElement.clientHeight;
 simCanvas.width = w; simCanvas.height = h;
}
window.addEventListener('resize', ()=>{ resizeSim(); drawSim(); });
resizeSim();

function gV(){ return +document.getElementById('slV').value; }
function gA(){ return +document.getElementById('slA').value; }
function gAng(){ return +document.getElementById('slAngle').value * Math.PI/180; }
function gV2(){ return +document.getElementById('slV2').value; }

function togglePlay(){
 sim.playing = !sim.playing;
 const b = document.getElementById('btnPlay');
 if(sim.playing){
   b.textContent='Pause'; b.classList.add('on');
   // Commit-on-submit: flush any pending slider changes BEFORE the
   // sim-run event so the agent sees the parameter snapshot first,
   // then the sim-run that uses them.
   flushPendingChanges('play');
   const params={simType:sim.type,velocity:gV(),acceleration:gA()};
   if(document.getElementById('rowAngle').style.display!=='none') params.angle=Math.round(gAng()*180/Math.PI);
   if(document.getElementById('rowV2').style.display!=='none') params.v2=gV2();
   // `label` = the deliberate-commit signal: it renders the trust card in the
   // AIPLA app AND fires the ChatGPT sendFollowUpMessage turn. Without it the
   // model only sees this on the student's next typed message.
   const simName=document.getElementById('simType').selectedOptions[0].text;
   emit('sim-run',{simType:sim.type,params:params,label:'Ran the '+simName+' simulation (v='+gV()+' m/s, a='+gA()+' m/s²)'});
   runSim();
 }
 else{ b.textContent='Play'; b.classList.remove('on'); cancelAnimationFrame(animId); }
}
function resetSim(){
 sim.playing=false; sim.t=0; sim.x=60; sim.y=0; sim.trail=[];
 cancelAnimationFrame(animId); lastTs=null;
 const b=document.getElementById('btnPlay'); b.textContent='▶ Play'; b.classList.add('on');
 drawSim(); updateStats();
}
function updateSim(){
 document.getElementById('lblV').textContent = gV();
 document.getElementById('lblA').textContent = gA();
 document.getElementById('lblAngle').textContent = document.getElementById('slAngle').value+'°';
 document.getElementById('lblV2').textContent = gV2();
 // Slider input — accumulate pendingChanges locally; do NOT emit yet.
 // Committed on togglePlay (Play) or inbound chat-flush.
 pendingChanges.velocity=gV();
 pendingChanges.acceleration=gA();
 if(document.getElementById('rowAngle').style.display!=='none') pendingChanges.angle=Math.round(gAng()*180/Math.PI);
 if(document.getElementById('rowV2').style.display!=='none') pendingChanges.v2=gV2();
 resetSim();
}
function changeSim(){
 sim.type = document.getElementById('simType').value;
 const aRow = document.getElementById('rowA'), angRow = document.getElementById('rowAngle'), v2Row = document.getElementById('rowV2');
 aRow.style.display = ['accel','freefall','projectile'].includes(sim.type)?'flex':'none';
 angRow.style.display = sim.type==='projectile'?'flex':'none';
 v2Row.style.display = sim.type==='relative'?'flex':'none';
 const formulas = {'1d':'x = vt','accel':'v = u+at, s=ut+½at²','projectile':'R=u²sin2θ/g','circular':'ac=v²/r','vectors':'R=A+B','freefall':'h=½gt²','relative':'v_rel=v_A−v_B'};
 document.getElementById('simFormula').textContent = formulas[sim.type]||'';
 document.getElementById('simLabel').textContent = document.getElementById('simType').selectedOptions[0].text;
 resetSim();
}

function runSim(){
 lastTs=null;
 function step(ts){
 if(!sim.playing) return;
 if(!lastTs) lastTs=ts;
 const dt = Math.min((ts-lastTs)/1000*0.6,0.05); lastTs=ts;
 const W=simCanvas.width, H=simCanvas.height;
 const v=gV(), a=gA(), ang=gAng();

 if(sim.type==='1d'){ sim.x+=v*dt*45; if(sim.x>W-20) sim.x=30; }
 else if(sim.type==='accel'){ sim.t+=dt; sim.x=40+0.5*a*sim.t*sim.t*22; if(sim.x>W-20) resetSim(); }
 else if(sim.type==='freefall'){ sim.t+=dt; sim.y=H*0.08+0.5*9.8*sim.t*sim.t*18; if(sim.y>H*0.82) resetSim(); }
 else if(sim.type==='projectile'){
 sim.t+=dt;
 sim.x=40+v*Math.cos(ang)*sim.t*45;
 sim.y=H*0.78-(v*Math.sin(ang)*sim.t-0.5*9.8*sim.t*sim.t)*18;
 sim.trail.push({x:sim.x,y:sim.y});
 if(sim.trail.length>120) sim.trail.shift();
 if(sim.y>H*0.82||sim.x>W-10) resetSim();
 }
 else if(sim.type==='circular'){
 sim.t+=dt*v*0.4;
 const r=Math.min(W,H)*0.28;
 sim.x=W/2+Math.cos(sim.t)*r; sim.y=H/2+Math.sin(sim.t)*r;
 }
 else if(sim.type==='vectors'){ sim.t+=dt; if(sim.t>6.28) sim.t=0; }
 else if(sim.type==='relative'){ sim.t+=dt; sim.x=(sim.t*(v)*40)%W; sim.y=H*0.4+(sim.t*gV2()*40)%(H*0.3); }

 drawSim(); updateStats();
 animId = requestAnimationFrame(step);
 }
 animId = requestAnimationFrame(step);
}

function updateStats(){
 const v=gV(), a=gA(), W=simCanvas.width;
 document.getElementById('stX').textContent = ((sim.x-40)/50).toFixed(1)+' m';
 document.getElementById('stT').textContent = sim.t.toFixed(2)+' s';
 if(sim.type==='1d'){ document.getElementById('stV').textContent=v+' m/s'; document.getElementById('stA').textContent='0 m/s²'; }
 else if(sim.type==='accel'){ document.getElementById('stV').textContent=(a*sim.t).toFixed(1)+' m/s'; document.getElementById('stA').textContent=a+' m/s²'; }
 else if(sim.type==='freefall'){ document.getElementById('stV').textContent=(9.8*sim.t).toFixed(1)+' m/s'; document.getElementById('stA').textContent='9.8 m/s²'; }
 else{ document.getElementById('stV').textContent=v+' m/s'; document.getElementById('stA').textContent=a+' m/s²'; }
}

function drawSim(){
 const W=simCanvas.width, H=simCanvas.height;
 sctx.clearRect(0,0,W,H);
 // Grid
 sctx.strokeStyle='rgba(100,116,139,0.15)'; sctx.lineWidth=1;
 for(let x=0;x<W;x+=40){sctx.beginPath();sctx.moveTo(x,0);sctx.lineTo(x,H);sctx.stroke();}
 for(let y=0;y<H;y+=40){sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(W,y);sctx.stroke();}

 const type=sim.type;

 if(type==='1d'){
 drawGround(H*0.62);
 const bx=Math.max(20,Math.min(W-20,sim.x||60)), by=H*0.50;
 drawArrowS(bx,by,bx+gV()*7,by,'#3b82f6','v');
 drawBall(bx,by+18,13,'#60a5fa','#1d4ed8');
 drawRuler(0,H*0.62,W,H*0.62);
 }
 else if(type==='accel'){
 drawGround(H*0.65);
 const bx=Math.max(20,Math.min(W-20,sim.x||40)), by=H*0.51;
 const cv=(gA()*sim.t); drawArrowS(bx,by,bx+Math.min(cv*7,60),by,'#06b6d4','v');
 drawArrowS(bx,by+18,bx+28,by+18,'#f59e0b','a');
 drawBall(bx,by+32,13,'#34d399','#065f46');
 // v-t mini graph inset
 drawMiniGraph(W-70,H-55,60,45);
 }
 else if(type==='freefall'){
 const bx=W/2, by=Math.min(H*0.82,sim.y||H*0.08);
 sctx.setLineDash([3,7]); sctx.strokeStyle='rgba(59,130,246,.25)'; sctx.lineWidth=1.5;
 sctx.beginPath(); sctx.moveTo(bx,H*0.08); sctx.lineTo(bx,by); sctx.stroke(); sctx.setLineDash([]);
 drawArrowS(bx+22,by,bx+22,by+28,'#f59e0b','g');
 drawBall(bx,by,13,'#fb923c','#9a3412');
 sctx.fillStyle='#e2e8f0'; sctx.fillRect(0,H*0.82,W,4);
 }
 else if(type==='projectile'){
 const ang=gAng(), v=gV();
 sctx.beginPath(); sctx.strokeStyle='rgba(139,92,246,.3)'; sctx.lineWidth=1.5; sctx.setLineDash([4,7]);
 for(let t2=0;t2<=5;t2+=0.04){
 const px=40+v*Math.cos(ang)*t2*45;
 const py=H*0.78-(v*Math.sin(ang)*t2-0.5*9.8*t2*t2)*18;
 if(t2===0) sctx.moveTo(px,py); else sctx.lineTo(px,py);
 if(py>H*0.82) break;
 } sctx.stroke(); sctx.setLineDash([]);
 // Trail
 if(sim.trail.length>2){
 sctx.beginPath(); sctx.strokeStyle='rgba(6,182,212,.4)'; sctx.lineWidth=2;
 sim.trail.forEach((p,i)=>i===0?sctx.moveTo(p.x,p.y):sctx.lineTo(p.x,p.y)); sctx.stroke();
 }
 sctx.fillStyle='#e2e8f0'; sctx.fillRect(0,H*0.82,W,4);
 const bx=Math.max(20,Math.min(W-20,sim.x||40)), by=Math.max(20,sim.y||H*0.78);
 const vy=Math.max(0,v*Math.sin(ang)-9.8*sim.t);
 const vx=v*Math.cos(ang);
 drawArrowS(bx,by,bx+vx*5,by,'#3b82f6','vₓ');
 drawArrowS(bx,by,bx,by-vy*5,'#10b981','vᵧ');
 drawBall(bx,by,12,'#c084fc','#6d28d9');
 // Angle arc
 sctx.beginPath(); sctx.strokeStyle='#f59e0b'; sctx.lineWidth=1.5;
 sctx.arc(40,H*0.82,32,-ang,0); sctx.stroke();
 sctx.fillStyle='#f59e0b'; sctx.font='11px JetBrains Mono';
 sctx.fillText(document.getElementById('slAngle').value+'°',72,H*0.82-6);
 }
 else if(type==='circular'){
 const cx=W/2, cy=H/2, r=Math.min(W,H)*0.28;
 sctx.beginPath(); sctx.arc(cx,cy,r,0,Math.PI*2);
 sctx.strokeStyle='rgba(59,130,246,.18)'; sctx.lineWidth=1.5; sctx.setLineDash([5,6]); sctx.stroke(); sctx.setLineDash([]);
 drawBall(cx,cy,4,'#e2e8f0','#263554');
 const bx=sim.x||cx+r, by=sim.y||cy;
 sctx.beginPath(); sctx.strokeStyle='rgba(16,185,129,.4)'; sctx.lineWidth=1.5;
 sctx.moveTo(cx,cy); sctx.lineTo(bx,by); sctx.stroke();
 const dx=cx-bx, dy=cy-by, mg=Math.sqrt(dx*dx+dy*dy);
 drawArrowS(bx,by,bx+dx/mg*28,by+dy/mg*28,'#f59e0b','ac');
 const tx=-dy/mg, ty=dx/mg;
 drawArrowS(bx,by,bx+tx*28,by+ty*28,'#3b82f6','v');
 drawBall(bx,by,13,'#22d3ee','#0891b2');
 sctx.fillStyle='rgba(100,116,139,.5)'; sctx.font='10px JetBrains Mono';
 sctx.fillText('ω = v/r',cx-25,cy+r+18);
 }
 else if(type==='vectors'){
 const cx=W*0.3, cy=H/2, v=gV(), a=gA(), t=sim.t||0;
 const Ax=v*22,Ay=0;
 const Bx=a*16*Math.cos(t*0.4), By=-a*16*Math.sin(t*0.4);
 drawArrowS(cx,cy,cx+Ax,cy+Ay,'#3b82f6','A');
 drawArrowS(cx+Ax,cy+Ay,cx+Ax+Bx,cy+Ay+By,'#10b981','B');
 sctx.beginPath(); sctx.strokeStyle='#f87171'; sctx.lineWidth=2.5; sctx.setLineDash([5,5]);
 sctx.moveTo(cx,cy); sctx.lineTo(cx+Ax+Bx,cy+Ay+By); sctx.stroke(); sctx.setLineDash([]);
 sctx.fillStyle='#f87171'; sctx.font='700 10px JetBrains Mono';
 sctx.fillText('R',cx+(Ax+Bx)/2-4,cy+(Ay+By)/2-8);
 const mag=Math.sqrt((Ax+Bx)**2+(Ay+By)**2).toFixed(1);
 sctx.fillStyle='#64748b'; sctx.font='10px JetBrains Mono';
 sctx.fillText('|R|='+mag,10,H-12);
 sctx.fillText('Triangle Law →',10,16);
 }
 else if(type==='relative'){
 drawGround(H*0.42); drawGround(H*0.72);
 const v1=gV(), v2=gV2();
 const b1x=(sim.x||50)%(W-30)+20;
 const b2x=(sim.y||100)%(W-30)+20;
 drawBall(b1x,H*0.32,11,'#60a5fa','#1d4ed8');
 drawArrowS(b1x,H*0.32,b1x+v1*8,H*0.32,'#3b82f6','v₁='+v1);
 drawBall(b2x,H*0.62,11,'#34d399','#065f46');
 drawArrowS(b2x,H*0.62,b2x+v2*8,H*0.62,'#10b981','v₂='+v2);
 sctx.fillStyle='#64748b'; sctx.font='700 10px JetBrains Mono';
 sctx.fillText('v_rel = v₁ − v₂ = '+(v1-v2)+' m/s',8,H-12);
 }
}

function drawGround(y){
 sctx.strokeStyle='#e2e8f0'; sctx.lineWidth=2;
 sctx.beginPath(); sctx.moveTo(0,y); sctx.lineTo(simCanvas.width,y); sctx.stroke();
}
function drawBall(x,y,r,c1,c2){
 const g=sctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
 g.addColorStop(0,c1); g.addColorStop(1,c2);
 sctx.beginPath(); sctx.arc(x,y,r,0,Math.PI*2);
 sctx.fillStyle=g; sctx.fill();
 sctx.strokeStyle='rgba(255,255,255,.1)'; sctx.lineWidth=1; sctx.stroke();
}
function drawArrowS(x1,y1,x2,y2,color,label){
 const dx=x2-x1,dy=y2-y1;
 if(Math.abs(dx)<3&&Math.abs(dy)<3) return;
 sctx.strokeStyle=color; sctx.lineWidth=2; sctx.setLineDash([]);
 sctx.beginPath(); sctx.moveTo(x1,y1); sctx.lineTo(x2,y2); sctx.stroke();
 const ang=Math.atan2(dy,dx);
 sctx.fillStyle=color; sctx.beginPath();
 sctx.moveTo(x2,y2);
 sctx.lineTo(x2-8*Math.cos(ang-.4),y2-8*Math.sin(ang-.4));
 sctx.lineTo(x2-8*Math.cos(ang+.4),y2-8*Math.sin(ang+.4));
 sctx.closePath(); sctx.fill();
 if(label){ sctx.fillStyle=color; sctx.font='700 9px JetBrains Mono'; sctx.fillText(label,x2+4,y2-3); }
}
function drawRuler(x1,y,x2){
 sctx.fillStyle='#e2e8f0'; sctx.fillRect(x1,y,x2-x1,2);
 for(let i=0;i<=8;i++){
 const x=x1+i*(x2-x1)/8;
 sctx.fillStyle='#475569'; sctx.font='9px JetBrains Mono';
 sctx.fillText(i+'m',x-5,y+14);
 }
}
function drawMiniGraph(x,y,w,h){
 sctx.fillStyle='rgba(248,250,252,.95)'; sctx.strokeStyle='#e2e8f0'; sctx.lineWidth=1;
 sctx.beginPath(); sctx.rect(x,y,w,h); sctx.fill(); sctx.stroke();
 sctx.strokeStyle='#3b82f6'; sctx.lineWidth=1.5;
 sctx.beginPath(); sctx.moveTo(x+4,y+h-4);
 const steps=20;
 for(let i=0;i<=steps;i++){
 const t2=i/steps*Math.min(sim.t+0.1,3);
 const vv=gA()*t2;
 const px=x+4+i*(w-8)/steps;
 const py=y+h-4-Math.min(vv/30*(h-8),h-8);
 if(i===0) sctx.moveTo(px,py); else sctx.lineTo(px,py);
 } sctx.stroke();
 sctx.fillStyle='#475569'; sctx.font='8px JetBrains Mono';
 sctx.fillText('v-t',x+2,y+10);
}

// ══════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════
function showToast(msg, color='var(--green)'){
 const t=document.getElementById('toast');
 t.textContent=msg; t.style.background=color; t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2200);
}

// INIT — boots the sim canvas only. Graph + quiz + chat + notes all
// moved to the React workbench; this iframe is the sim surface alone.
window.onload=()=>{
 drawSim();
};

// Spec lifecycle handshake (bridge-owned). Standalone (no sandbox proxy) → the
// bridge flips to initialized so emits become no-ops.
AIPLA_BRIDGE.init({name:'kinebot',version:'1.0.0'});
