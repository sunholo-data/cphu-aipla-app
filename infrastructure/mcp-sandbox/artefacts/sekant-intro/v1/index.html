<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hældningslab</title>
<!--
  Hældningslab (id: sekant-intro) v2 — a coordinate bench for introductory differential calculus
  (stx A/B). It starts with one graph window; the student adds more with "+"
  (up to six graph windows and one Δx-window). The student types the functions to plot; the
  instruments are the grid, a coordinate probe, a slope triangle and two line
  tools. The student measures coordinates and works out slopes.

  THE Δx-WINDOW (added 3 Oct 2026, for UV2; called the k-window until 10 Oct,
  when the increment was renamed Δx to match Mathematicus and most textbooks —
  "h" was not an option, since the UV1/UV2 function is called h. Internally the
  code and the payload still say k; k IS Δx). A window, added with "+", with its
  own function list plus one extra instrument: click a point P = (x0, f(x0)) on
  a curve (or type x0), press "+Δx", and a slider sets Δx. The bench marks Δx on
  the x-axis and f(x0+Δx) - f(x0) on the y-axis, draws the Δx/Δy triangle and
  the line through the two points, and can zoom in on the triangle. It still
  never divides: the quotient is the student's to form, and watching it as Δx
  shrinks is the lesson.

  THE NAME avoids "sekant" and "tangent" on purpose: the title is visible to
  students, and both words are terms the tutor introduces only when the group
  has described the idea itself. v1 was called "Sekantbænk", which put one of
  them on screen from the first minute. The internal id stays sekant-intro so
  the link to AIPLA is not broken.

  v2 (3 Oct 2026) replaces the fixed curves of v1 (f, g in one view, h in
  another) with student-entered functions in three windows. The bench now knows
  nothing about any particular lesson: which functions to use is the activity's
  business, not the instrument's.

  IT DELIBERATELY DOES NOT SHOW:
    - any quotient dy/dx, for any line
    - the legs dx and dy of a secant — the student typed both points
    - function values in the k-window — only where f(x0) and f(x0 + k) are
    - any derivative or tangent slope
    - the words "sekant" and "tangent" anywhere in the interface (10 Oct 2026:
      the two-point tool was called "Indsæt sekant" until then; in testing it
      led the tutor to treat secants as a known tool and push them early. It is
      now "Linje gennem to punkter". Internally the code still says "secant".)
  The bench shows WHERE things are; the student works out WHAT they are, in
  the program they normally use. That is so the calculation does not end up
  belonging to the simulation: they must be able to do it without it later.
  (Values still go to the tutor in the event payloads, invisibly, so it can
  check the student's arithmetic.) The one measurement the bench does give is
  the probe, which stands in for reading a point off a paper graph.

  FORMULAS ARE PARSED, NEVER EXECUTED. AIPLA forbids dynamic code evaluation, and a
  formula is untrusted input. A small recursive-descent parser turns it into a
  tree of closures. Implicit multiplication binds like "*", left to right, so
  1/3x^2 means (1/3)x^2 — what a student writing ⅓x² intends.

  The probe snaps to the nearest place where the curve crosses a grid line —
  vertical or horizontal — and reports y as the function's value there, so a
  probed point always lies on the curve. The grid controls WHICH points can be
  measured, not how precisely y is reported; with the grid off, any x can be
  measured.

  The axes do not share a scale; one x-unit and one y-unit are different sizes on
  screen. Visual steepness is therefore not comparable across the two axes.

  DELIBERATE NON-FEATURE — PLEASE DO NOT "FIX" THIS:
  The bench does NOT check whether the points typed into the secant fields lie on
  a curve, and does not warn or refuse. A wrong y draws a line that visibly misses
  the curve, and that is the feedback. Two reasons it has to stay that way:
    - the bench should return the consequence of an action, not forbid it;
    - "your y is wrong" is a CONCLUSION, and this bench is used in a study whose
      whole manipulation is which tutor configuration withholds conclusions. A
      validating bench would leak one arm's behaviour into both, through the
      interface, where the logs would not show it.
  The same goes for formulas: the bench says when it cannot READ a formula, never
  whether it is the RIGHT one.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --border: #e2e8f0;
    --accent: #2563eb; --accent-soft: #eff6ff;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --surface: #f8fafc;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  .wrap { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

  .panel { border: 1px solid var(--border); border-radius: 6px; padding: 12px; background: var(--bg); }
  .phead {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 8px 0; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .orient { color: var(--muted); font-size: 13px; margin: 0 0 2px 0; }

  button {
    font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #cbd5e1; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

  .iconbtn { padding: 5px 8px; line-height: 1; }
  .bars { display: inline-block; width: 14px; }
  .bars span { display: block; height: 2px; background: var(--fg); border-radius: 1px; margin: 3px 0; }

  canvas { display: block; width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); touch-action: none; cursor: grab; }
  /* Three cursor states: crosshair over a curve (you can read a point there),
     grab elsewhere (you can move the window), grabbing while dragging. The
     dragging rule comes last so it wins when both classes are present. */
  canvas.over-curve { cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }
  /* The tick-label strips along the bottom and left edge stretch an axis. */
  canvas.over-xaxis { cursor: ew-resize; }
  /* Grid control: a small icon in the plot's top-right corner opens the four
     choices. On the graph itself, because the grid is about what you see. */
  .plotwrap { position: relative; }
  /* Windows are added by the student: one graph window to begin with, "+" adds
     another graph window or the (single) Δx-window. */
  .tabbar { align-items: center; }
  .addwrap { position: relative; }
  #win-add { font-weight: 600; min-width: 30px; }
  #win-pop { position: absolute; top: 34px; left: 0; z-index: 6; background: #fff;
             border: 1px solid var(--border); border-radius: 6px; padding: 6px;
             box-shadow: 0 4px 14px rgba(15,23,42,.12); display: flex; flex-direction: column; gap: 4px;
             white-space: nowrap; }
  #win-pop.hidden { display: none; }
  #grid-btn { position: absolute; top: 8px; right: 8px; padding: 4px; line-height: 0;
              background: rgba(255,255,255,.92); }
  #grid-btn[aria-pressed="true"] { border-color: #2563eb; color: #2563eb; }
  #grid-pop { position: absolute; top: 40px; right: 8px; z-index: 5; background: #fff;
              border: 1px solid var(--border); border-radius: 6px; padding: 8px;
              box-shadow: 0 4px 14px rgba(15,23,42,.12); }
  #grid-pop .row { flex-wrap: nowrap; gap: 6px; }
  #grid-pop .grid-opt { padding: 4px; line-height: 0; }
  #grid-pop .grid-opt[aria-pressed="true"] { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
  canvas.over-yaxis { cursor: ns-resize; }
  @media (min-width: 720px) { canvas { height: 480px; } }

  .readout {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; text-align: right; font-size: 13px;
  }
  /* Variables set as LaTeX sets inline maths: italic serif. Numbers stay
     monospace and tabular so columns line up. No maths renderer is possible
     here — external resources are forbidden — so this is the typography. */
  .wrap i, .mv { font-family: "Cambria Math", Cambria, Georgia, "Times New Roman", serif;
                 font-style: italic; font-size: 1.05em; }
  .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .toolnote { font-size: 12px; color: var(--muted); margin: 2px 0 8px 0; }
  .readout .unit { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  label.fieldlab { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
  input[type="text"] {
    font: inherit; font-family: var(--mono); font-size: 13px; width: 100%;
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .fields3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  .lines-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lines-list li {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .del { margin-left: auto; border: none; background: none; color: var(--muted);
         font-size: 14px; line-height: 1; padding: 2px 6px; cursor: pointer; }
  .del:hover { color: var(--bad); }
  /* Finger-sized targets on touch devices only, so the desktop look is unchanged. */
  @media (pointer: coarse) {
    button { padding: 13px 12px; }
    .del { padding: 12px 14px; }
    input[type="text"] { padding: 12px 8px; }
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 11px; }
  .hidden { display: none; }
  .langbar { display: flex; gap: 4px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .func-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .func-list li {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; display: flex; gap: 8px; align-items: center;
  }
  .func-list .fx { font-family: "Cambria Math", Cambria, Georgia, "Times New Roman", serif; font-style: italic; font-size: 15px; }
  .entry { display: flex; gap: 6px; }
  .entry input { flex: 1 1 auto; }
  .zoomrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .err { color: var(--bad); font-size: 12px; min-height: 1em; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .kgrid { display: flex; gap: 8px; align-items: center; }
  .kgrid input[type="range"] { flex: 1 1 auto; }
  .kbtn { font-size: 15px; padding: 6px 16px; background: var(--accent); border-color: var(--accent); color: #fff; }
  .kbtn:disabled { opacity: .3; background: var(--bg); border-color: var(--border); color: var(--muted); }
  .kgrid input[type="text"] { width: 7.5em; }
  /* The magnifier: follows the Δx triangle while pressed. Bright when on. */
  #k-zoom { padding: 5px 8px; line-height: 0; }
  .x0lab { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 14px; }
  .kgrid input#x0-in { width: 6em; }
  #k-zoom[aria-pressed="true"] { background: #d97706; border-color: #d97706; color: #fff; }
  .kout { font-size: 13px; line-height: 1.7; }
  .kout .kx { color: #b45309; } .kout .ky { color: #15803d; }
</style>
</head>
<body>
<div class="wrap">

  <p class="orient" data-t="orient"></p>

  <!-- PLOT -->
  <div class="panel">
    <div class="phead">
      <span data-t="plotHead"></span>
      <span class="row">
        <span class="langbar">
          <button id="lang-da" class="iconbtn" aria-pressed="true">Dansk</button>
          <button id="lang-en" class="iconbtn" aria-pressed="false">English</button>
        </span>
        <button id="menu-toggle" class="iconbtn" aria-expanded="false" aria-controls="menu">
          <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </span>
    </div>
    <div class="tabs tabbar" style="margin-bottom:8px">
      <span id="win-tabs" class="tabs"></span>
      <span class="addwrap">
        <button id="win-add" class="iconbtn" aria-expanded="false" aria-controls="win-pop" data-ta="winAdd">+</button>
        <div id="win-pop" class="hidden">
          <button id="add-graph" data-t="addGraph"></button>
          <button id="add-kwin" data-t="addKWin"></button>
        </div>
      </span>
    </div>
    <div class="plotwrap">
      <canvas id="plot"></canvas>
      <button id="grid-btn" class="iconbtn" aria-expanded="false" aria-controls="grid-pop" aria-pressed="false" data-ta="gridHead">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <rect x="1.5" y="1.5" width="15" height="15" rx="1.5"/><path d="M6.5 1.5v15M11.5 1.5v15M1.5 6.5h15M1.5 11.5h15"/>
        </svg>
      </button>
      <div id="grid-pop" class="hidden">
        <div class="sub" data-t="gridHead"></div>
        <div class="row" style="margin-top:6px">
          <button class="grid-opt iconbtn" data-step="0" aria-pressed="true" data-ta="gridNone"><svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="1.5"/><path d="M3 15 15 3"/></svg></button>
          <button class="grid-opt iconbtn" data-step="1" aria-pressed="false" data-ta="gridWhole"><svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="1.5"/><path d="M9.00 2v14M2 9.00h14" stroke-width="1.2"/></svg></button>
          <button class="grid-opt iconbtn" data-step="0.5" aria-pressed="false" data-ta="gridHalf"><svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="1.5"/><path d="M5.50 2v14M2 5.50h14 M9.00 2v14M2 9.00h14 M12.50 2v14M2 12.50h14" stroke-width="0.9"/></svg></button>
          <button class="grid-opt iconbtn" data-step="0.25" aria-pressed="false" data-ta="gridQuarter"><svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="1.5"/><path d="M4.33 2v14M2 4.33h14 M6.67 2v14M2 6.67h14 M9.00 2v14M2 9.00h14 M11.33 2v14M2 11.33h14 M13.67 2v14M2 13.67h14" stroke-width="0.6"/></svg></button>
        </div>
      </div>
    </div>
    <!-- k — only in the k-window, right under the graph so it is in sight. -->
    <div id="kbar" class="hidden" style="margin-top:8px">
      <p class="toolnote" data-th="kNote" style="margin:0 0 6px 0"></p>
      <div class="kgrid">
        <label class="x0lab"><i>x</i>&#8320; =
          <input type="text" id="x0-in" inputmode="decimal" autocomplete="off" data-tp="x0Hint" data-ta="x0Label">
        </label>
        <button id="k-add" class="kbtn" disabled>+Δ<i>x</i></button>
        <input type="range" id="k-range" min="-2" max="2" step="0.001" value="1" aria-label="Δx" class="hidden">
        <input type="text" id="k-in" inputmode="decimal" autocomplete="off" aria-label="Δx" class="hidden">
        <button id="k-zoom" class="iconbtn hidden" aria-pressed="false" data-ta="kZoom">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="7.5" cy="7.5" r="5"/><path d="M11.3 11.3 16 16"/>
          </svg>
        </button>
        <button id="k-remove" class="iconbtn hidden" data-ta="kRemove">&times;</button>
      </div>
      <div id="k-out" class="readout kout hidden" style="margin-top:6px; text-align:left"></div>
    </div>
    <div style="margin-top:8px">
      <div class="sub" data-t="probeHead"></div>
      <div id="probe-out" class="readout"></div>
      <div id="probe-note" class="note" style="margin-top:4px"></div>
    </div>
  </div>

  <!-- TOOLS — collapsed on load; the orienting line says where they are. Placed
       right under the graph (11 Oct 2026): at the bottom of the page it opened out
       of sight, and the student typed points without seeing the graph. -->
  <div class="panel hidden" id="menu">
    <div class="phead"><span data-t="menuHead"></span></div>
    <div class="stack">

      <div>
        <div class="sub" data-t="secantHead"></div>
        <p class="toolnote" data-th="secantNote"></p>
        <div class="fields">
          <div><label class="fieldlab" for="sx1"><i>x</i>&#8321;</label><input type="text" id="sx1" inputmode="decimal" autocomplete="off"></div>
          <div><label class="fieldlab" for="sy1"><i>y</i>&#8321;</label><input type="text" id="sy1" inputmode="decimal" autocomplete="off"></div>
          <div><label class="fieldlab" for="sx2"><i>x</i>&#8322;</label><input type="text" id="sx2" inputmode="decimal" autocomplete="off"></div>
          <div><label class="fieldlab" for="sy2"><i>y</i>&#8322;</label><input type="text" id="sy2" inputmode="decimal" autocomplete="off"></div>
        </div>
        <button id="add-secant" class="primary" data-t="addSecant"></button>
        <div id="secant-err" class="note" style="margin-top:4px"></div>
      </div>

      <div>
        <div class="sub" data-t="lineHead"></div>
        <p class="toolnote" data-th="lineNote"></p>
        <div class="fields3">
          <div><label class="fieldlab" for="px"><i>x</i>&#8320;</label><input type="text" id="px" inputmode="decimal" autocomplete="off"></div>
          <div><label class="fieldlab" for="py"><i>y</i>&#8320;</label><input type="text" id="py" inputmode="decimal" autocomplete="off"></div>
          <div><label class="fieldlab" for="pa" data-t="slopeField"></label><input type="text" id="pa" inputmode="decimal" autocomplete="off"></div>
        </div>
        <button id="add-line" data-t="addLine"></button>
        <div id="line-err" class="note" style="margin-top:4px"></div>
      </div>

      <div>
        <button id="clear-lines" data-t="clearLines"></button>
      </div>

      <div>
        <div class="sub" data-t="linesHead"></div>
        <ul id="lines-list" class="lines-list" style="margin-top:6px"></ul>
      </div>

    </div>
  </div>

  <!-- FUNCTIONS — the student plots what the task asks for. Each window has its
       own list. A formula that names itself (f(x) = ...) keeps its name; one
       that does not gets the next free letter. -->
  <div class="panel">
    <div class="phead"><span data-t="funcHead"></span></div>
    <ul id="func-list" class="func-list"></ul>
    <div class="entry" style="margin-top:8px">
      <input type="text" id="func-in" autocomplete="off" autocapitalize="off" spellcheck="false" data-tp="funcPlaceholder">
      <button id="func-add" class="primary" data-t="funcAdd"></button>
    </div>
    <div id="func-err" class="err" style="margin-top:4px"></div>
    <p class="toolnote" data-th="funcNote" style="margin-top:4px"></p>
  </div>

  <!-- VIEW — always visible. -->
  <div class="panel">
    <div class="phead"><span data-t="viewHead"></span></div>
    <div class="stack">


      <div>
        <div class="sub" data-t="windowHead"></div>
        <p class="toolnote" data-t="windowNote"></p>
        <div class="zoomrow">
          <button id="zoom-in" class="iconbtn" data-ta="zoomIn">+</button>
          <button id="zoom-out" class="iconbtn" data-ta="zoomOut">&minus;</button>
          <button id="reset-window" data-t="resetWindow"></button>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- @aipla-bridge:start -->
<script>
/* ============================================================================
 * AIPLA MCP App guest bridge — ONE canonical transport for every host.
 *
 * SOURCE OF TRUTH. This file is inlined verbatim into every artefact's
 * index.html between the `@aipla-bridge:start … @aipla-bridge:end` markers by
 * `scripts/build-artefact-bridge.mjs` (run `make sim-build`). NEVER hand-edit
 * the inlined copy — edit THIS file and rebuild. CI (`--check`) fails on drift.
 *
 * It speaks whichever host is present:
 *   - AIPLA app / SEP-1865 hosts  → JSON-RPC `ui/update-model-context` over
 *                                   window.parent.postMessage (the app reads
 *                                   structuredContent + renders the trust card).
 *   - ChatGPT (OpenAI Apps SDK)   → window.openai.setWidgetState (durable state)
 *                                   + window.openai.sendFollowUpMessage (turns a
 *                                   deliberate commit into an immediate turn).
 *   - Claude Desktop / Inspector  → the same SEP-1865 postMessage + `content`.
 *
 * The window.openai block is guarded end-to-end: absent in the AIPLA app and
 * Claude, so it is a pure no-op there and the postMessage path stays
 * authoritative. See docs/design/aipla/v1.1.0-feedback/shared-mcp-app-bridge.md.
 *
 * Public surface (window.AIPLA_BRIDGE):
 *   emit(kind, extra)                 — report a student interaction. `kind` is
 *                                       the FULL event kind (e.g. "boldkast.play").
 *                                       `extra.label` (a curated string) marks a
 *                                       DELIBERATE COMMIT — only labelled emits
 *                                       inject a ChatGPT follow-up turn.
 *   init({ name, version })           — run the ui/initialize handshake. Call once
 *                                       at the bottom of the artefact script.
 *   onChatFlush(cb)                   — cb() runs on ui/notifications/chat-flush.
 *   onHostNotification(method, cb)    — cb(params, msg) runs on any host→iframe
 *                                       JSON-RPC notification with that method.
 *   hostContext()                     — the hostContext returned by ui/initialize.
 *
 * Conservative JS (var/function) so it runs unchanged in any host iframe engine.
 * ========================================================================== */
(function () {
  "use strict";

  var __rpcNextId = 1;
  var __initialized = false;
  var __pendingEmits = [];
  var __hostContext = null;
  var __handlers = {}; // method -> [cb]
  var __lastReportedHeight = 0;
  var __appLinkShown = false;
  var __appLinkOpts = null;

      let j = i;
      while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
      let w = s.slice(i, j).toLowerCase();
      while (w.length) {
        const m = PARSE_WORDS.find(function (f) { return w.indexOf(f) === 0; });
        if (m) {
          out.push(m === "pi" ? { t: "num", v: Math.PI } : { t: "fn", v: m });
          w = w.slice(m.length); continue;
        }
        if (w[0] === "x") out.push({ t: "x" });
        else if (w[0] === "e") out.push({ t: "num", v: Math.E });
        else throw new ParseError("name");
        w = w.slice(1);
      }
      i = j; continue;
    }
    if ("+-*/^()".indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
    throw new ParseError("char");
  }
  return out;
}

function parseExpr(src) {
  const toks = tokenize(src);
  let p = 0;
  const peek = function () { return toks[p]; };
  const take = function () { return toks[p++]; };
  const startsAtom = function (tk) {
    return tk && (tk.t === "num" || tk.t === "x" || tk.t === "fn" || tk.t === "(");
  };

  function expr() {
    let left = term();
    while (peek() && (peek().t === "+" || peek().t === "-")) {
      const op = take().t, a = left, b = term();
      left = op === "+" ? function (x) { return a(x) + b(x); } : function (x) { return a(x) - b(x); };
    }
    return left;
  }
  function term() {
    let left = unary();
    for (;;) {
      const tk = peek();
      if (tk && (tk.t === "*" || tk.t === "/")) {
        take();
        const a = left, b = unary();
        left = tk.t === "*" ? function (x) { return a(x) * b(x); } : function (x) { return a(x) / b(x); };
      } else if (startsAtom(tk)) {
        const a = left, b = unary();
        left = function (x) { return a(x) * b(x); };
      } else break;
    }
    return left;
  }
  function unary() {
    const tk = peek();
    if (tk && tk.t === "-") { take(); const a = unary(); return function (x) { return -a(x); }; }
    if (tk && tk.t === "+") { take(); return unary(); }
    return power();
  }
  function power() {
    const base = atom();
    if (peek() && peek().t === "^") {
      take();
      const ex = unary();
      return function (x) { return Math.pow(base(x), ex(x)); };
    }
    return base;
  }
  function atom() {
    const tk = take();
    if (!tk) throw new ParseError("end");
    if (tk.t === "num") { const v = tk.v; return function () { return v; }; }
    if (tk.t === "x") return function (x) { return x; };
    if (tk.t === "fn") {
      const f = PARSE_FUNCS[tk.v];
      const arg = peek() && peek().t === "(" ? atom() : power();
      return function (x) { return f(arg(x)); };
    }
    if (tk.t === "(") {
      const inner = expr();
      const close = take();
      if (!close || close.t !== ")") throw new ParseError("paren");
      return inner;
    }
    throw new ParseError("token");
  }

  if (!toks.length) throw new ParseError("empty");
  const fn = expr();
  if (p < toks.length) throw new ParseError("trailing");
  return fn;
}

// Splits "f(x) = ..." / "y = ..." / "..." into a name (or null) and the
// right-hand side. Throws on a left-hand side the bench cannot use.
const RESERVED_NAMES = ["x", "y", "e"];
function splitDefinition(src) {
  const s = src.trim();
  const eq = s.indexOf("=");
  if (eq < 0) return { name: null, rhs: s };
  if (s.indexOf("=", eq + 1) >= 0) throw new ParseError("equals");
  const lhs = s.slice(0, eq).replace(/\s+/g, "");
  const rhs = s.slice(eq + 1).trim();
  if (lhs === "y") return { name: null, rhs: rhs };
  const m = /^([a-zA-Z])\(x\)$/.exec(lhs);
  if (!m || RESERVED_NAMES.indexOf(m[1].toLowerCase()) >= 0) throw new ParseError("lhs");
  return { name: m[1], rhs: rhs };
}

// For display only: what the student typed, set the way the textbook sets it.
// Decimal separators follow the bench language, so 0.6 typed in a Danish bench
// is shown as 0,6 — whichever the student used. Computed at render time, so
// switching language updates the legend and the list.
//
// It must show what is PLOTTED, not just what was typed (Ida, 10 Oct 2026). A
// student who types 2x2 for 2x² gets 2·x·2 = 4x from the parser, so the
// legend makes that multiplication visible: "2x·2". A number directly after x
// or ")" — or after another number, across a space — is an implicit
// multiplication, and is shown with a dot.
function prettyExpr(rhs) {
  const sep = typeof lang !== "undefined" && lang === "en" ? "." : ",";
  return rhs.trim()
    .replace(/([xX)])\s*(?=[0-9.,])/g, "$1*")
    .replace(/(\d)\s+(?=\d)/g, "$1*")
    .replace(/(\d)[.,](\d)/g, "$1" + sep + "$2")
    .replace(/\s+/g, " ")
    .replace(/\^\s*2(?![0-9.,])/g, "²").replace(/\^\s*3(?![0-9.,])/g, "³")
    .replace(/\*/g, "·").replace(/-/g, "−").replace(/sqrt/gi, "√");
}

/* -------------------------------------------------------------------- state */

const CURVE_COLOURS = ["#2563eb", "#d97706", "#16a34a", "#9333ea", "#0f766e", "#b91c1c", "#64748b"];
const LINE_COLOURS = ["#dc2626", "#7c3aed", "#0891b2", "#be185d", "#4d7c0f"];
// Letters handed out to formulas that do not name themselves. i, j, l, o look
// like digits or are reserved by convention; e, x, y are taken by the parser.
const AUTO_NAMES = ["f", "g", "h", "k", "m", "n", "p", "q", "r", "s", "u", "v", "w"];
const DEFAULT_X = [-5, 5];

// kind "graph" or "k" (the Δx-window); n numbers the graph windows 1, 2, 3 …
// in the order they were made, so "Grafvindue 2" keeps its name.
function makeWindow(kind, n) {
  return { kind: kind || "graph", n: n || 1, curves: [], v: { xmin: -5, xmax: 5, ymin: -5, ymax: 5 }, auto: true, colourSeq: 0 };
}
// One graph window to begin with (Ida, 11 Oct 2026). Students add more with
// "+", and the Δx-window only exists once someone adds it — so an activity
// that never mentions it (UV1) does not show it.
const WINDOWS = [makeWindow("graph", 1)];
const MAX_GRAPH_WINDOWS = 6;
let K_WIN = -1;              // index of the Δx-window, -1 until it is added
function windowName(ww) { return ww.kind === "k" ? t("kTab") : t("winTab") + " " + ww.n; }
let win = 0;                 // index of the active graph window
const W_ = () => WINDOWS[win];

// No grid to begin with: free clicking is the first thing you try, and the grid
// is what you reach for when hitting the right spot turns out to be hard.
let gridStep = 0;
let lines = [];              // {kind:"secant"|"point", p1, p2?, a?, colour, win}
let probe = null;            // {x, hits:[{curve,y}]} — x snapped, y from the function
let probeMissed = false;
let lineSeq = 0;
let toolsOpen = false;
let lastFunctionError = null; // {text, window} — failed entries are data too
let kTool = null;            // {curve, x0, k} in the k-window, or null

const pendingChanges = {};

const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");

function curveLabel(c) { return c.name + "(x) = " + c.rhs.trim(); }
function displayOf(c) { return c.name + "(x) = " + prettyExpr(c.rhs); }

function simState() {
  const w = W_();
  return {
    graph_window: windowName(W_()),
    functions_in_window: w.curves.map(curveLabel),
    all_windows: WINDOWS.map(function (ww, i) {
      return { graph_window: windowName(ww), functions: ww.curves.map(curveLabel) };
    }),
    grid_step_units: gridStep,
    tools_panel_open: toolsOpen,
    window: { x_min: w.v.xmin, x_max: w.v.xmax, y_min: w.v.ymin, y_max: w.v.ymax },
    window_is_auto: w.auto,
    last_reading: probe ? {
      x: probe.x,
      readings: probe.hits.map(function (h) { return { curve: h.curve, y: h.y }; }),
      x_snapped_to_grid_step: gridStep,
    } : null,
    inserted_lines: lines.filter((L) => L.win === win).slice(-20).map((L) =>
      L.kind === "secant"
        ? { kind: "line_through_two_points", x1: L.p1.x, y1: L.p1.y, x2: L.p2.x, y2: L.p2.y, dx: legs(L.p1, L.p2).dx, dy: legs(L.p1, L.p2).dy }
        : { kind: "line_through_point", x0: L.p1.x, y0: L.p1.y, slope_a: L.a }
    ),
    inserted_line_count: lines.filter((L) => L.win === win).length,
    last_function_error: lastFunctionError,
    k_tool: kState(),
  };
}

function kCurve() {
  if (!kTool) return null;
  return WINDOWS[K_WIN].curves.find((c) => c.name === kTool.curve) || null;
}
// The two points and the two increments. Never their quotient.
function kState() {
  const c = kCurve();
  if (!c) return null;
  const y0 = c.fn(kTool.x0), y1 = c.fn(kTool.x0 + kTool.k);
  return { curve: c.name, x0: kTool.x0, k: kTool.k, x0_plus_k: kTool.x0 + kTool.k,
           y0: y0, y_at_x0_plus_k: y1, dy: y1 - y0 };
}
// Enough decimals that k and the y-increment can still be divided: at k =
// 0.001 four decimals would show dy as 0,0026 and lose a digit of the quotient.
function kDecimals(k) {
  const a = Math.abs(k);
  return a > 0 ? Math.min(10, Math.max(DP, Math.ceil(-Math.log10(a)) + 3)) : DP;
}

// Pure: snap a value to the nearest multiple of step. step 0 means no snapping.
function gridSnap(v, step) {
  if (!step) return v;
  return Math.round(v / step) * step;
}

// Pure: the two legs of the slope triangle. The bench never divides them.
function legs(p1, p2) {
  return { dx: p2.x - p1.x, dy: p2.y - p1.y };
}

// Pure: a y-range that shows the curves over the default x-range. Percentiles,
// not min and max, so 1/x or e^x does not flatten everything else, and a steep
// curve may leave the top of the frame rather than squash the others.
// The automatic window frames what is interesting about the curves, not the
// fixed strip x in [-5, 5] (11 Oct 2026). With [-5, 5] a parabola such as
// 2x^2 - 4x ran to y = 50, and the region around its vertex — where the
// lesson happens — was a flat smear at the bottom. Now x covers the zeros,
// turning points, y-intercept and crossings between the curves, with room
// around them; y follows from the curves over that x-range.
function interestingX(curves) {
  const N = 2000, A = -10, B = 10, xs = [0];
  const sample = curves.map(function (c) {
    const ys = [];
    for (let i = 0; i <= N; i++) ys.push(c.fn(A + ((B - A) * i) / N));
    return ys;
  });
  const at = (i) => A + ((B - A) * i) / N;
  sample.forEach(function (ys) {
    for (let i = 1; i < N; i++) {
      const a = ys[i - 1], b = ys[i], c = ys[i + 1];
      if (!isFinite(a) || !isFinite(b) || !isFinite(c)) continue;
      if ((a < 0 && b >= 0) || (a > 0 && b <= 0)) xs.push(at(i));      // zero
      if ((b - a) * (c - b) < 0) xs.push(at(i));                       // turning point
    }
  });
  for (let p = 0; p < sample.length; p++) for (let q = p + 1; q < sample.length; q++) {
    for (let i = 1; i <= N; i++) {
      const d0 = sample[p][i - 1] - sample[q][i - 1], d1 = sample[p][i] - sample[q][i];
      if (isFinite(d0) && isFinite(d1) && ((d0 < 0 && d1 >= 0) || (d0 > 0 && d1 <= 0))) xs.push(at(i)); // crossing
    }
  }
  return xs;
}
function fitWindow(w) {
  let xmin = DEFAULT_X[0], xmax = DEFAULT_X[1];
  if (w.curves.length) {
    const xs = interestingX(w.curves);
    const lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
    const MIN_SPAN = 5;
    const span = Math.max(MIN_SPAN, (hi - lo) * 1.8);
    const mid = (lo + hi) / 2;
    xmin = mid - span / 2; xmax = mid + span / 2;
  }
  const ys = [];
  w.curves.forEach(function (c) {
    for (let i = 0; i <= 200; i++) {
      const y = c.fn(xmin + ((xmax - xmin) * i) / 200);
      if (isFinite(y)) ys.push(y);
    }
  });
  let ymin = -5, ymax = 5;
  if (ys.length) {
    ys.sort(function (a, b) { return a - b; });
    ymin = ys[Math.floor(0.05 * (ys.length - 1))];
    ymax = ys[Math.ceil(0.90 * (ys.length - 1))];
    // keep the x-axis in view when it is close
    if (ymin > 0 && ymin < 0.5 * (ymax - ymin)) ymin = 0;
    if (ymax < 0 && -ymax < 0.5 * (ymax - ymin)) ymax = 0;
    if (ymax - ymin < 2) { const m = (ymax + ymin) / 2; ymin = m - 1; ymax = m + 1; }
    const pad = 0.08 * (ymax - ymin);
    ymin -= pad; ymax += pad;
  }
  w.v = { xmin: xmin, xmax: xmax, ymin: ymin, ymax: ymax };
}

/* ---------------------------------------------------------------- telemetry */

const ARTEFACT_NAME = "sekant-intro";
const bridge = () => (typeof AIPLA_BRIDGE === "undefined" ? null : AIPLA_BRIDGE);
function emit(type, extra) {
  const b = bridge();
  return b && b.emit(ARTEFACT_NAME + "." + type, extra);
}

function flushPendingChanges(triggeredBy) {
  const changed = Object.keys(pendingChanges);
  if (!changed.length) return;
  emit("state-change", { changed: changed, state: simState(), triggeredBy: triggeredBy });
  changed.forEach((k) => delete pendingChanges[k]);
}

/* ------------------------------------------------------------------ drawing */

let W = 0, H = 0;

function sizeCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const PAD = { l: 42, r: 10, t: 10, b: 26 };

function sx(x) { const v = W_().v; return PAD.l + ((x - v.xmin) / (v.xmax - v.xmin)) * (W - PAD.l - PAD.r); }
function sy(y) { const v = W_().v; return H - PAD.b - ((y - v.ymin) / (v.ymax - v.ymin)) * (H - PAD.t - PAD.b); }
function wx(px) { const v = W_().v; return v.xmin + ((px - PAD.l) / (W - PAD.l - PAD.r)) * (v.xmax - v.xmin); }
function wy(py) { const v = W_().v; return v.ymin + ((H - PAD.b - py) / (H - PAD.t - PAD.b)) * (v.ymax - v.ymin); }

// Pure: a 1-2-5 tick step giving roughly `target` ticks over `span`.
function niceStep(span, target) {
  const raw = span / target;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
function stepDecimals(step) { return Math.max(0, -Math.floor(Math.log10(step) + 1e-9)); }

// The axes do not share a scale, so one grid step can be roomy on one axis and
// crammed on the other (y from -5 to 33 with a half-unit grid gave a line every
// 6 px). Each axis therefore uses the smallest multiple of the chosen step that
// leaves at least GRID_MIN_PX between lines — and the probe snaps to exactly
// the lines that are drawn, so what you see is what you can hit.
const GRID_MIN_PX = 12;
function axisStep(rangeUnits, spanPx) {
  if (!gridStep) return 0;
  const mults = [1, 2, 4, 5, 10, 20, 40, 50, 100, 200, 500, 1000];
  for (let i = 0; i < mults.length; i++) {
    const st = gridStep * mults[i];
    if ((st / rangeUnits) * spanPx >= GRID_MIN_PX) return st;
  }
  return gridStep * mults[mults.length - 1];
}
function gridStepX() { const v = W_().v; return axisStep(v.xmax - v.xmin, W - PAD.l - PAD.r); }
function gridStepY() { const v = W_().v; return axisStep(v.ymax - v.ymin, H - PAD.t - PAD.b); }

function drawGrid() {
  const v = W_().v;
  if (gridStep) {
    const stX = gridStepX(), stY = gridStepY();
    ctx.lineWidth = 1;
    {
      for (let x = Math.ceil(v.xmin / stX) * stX; x <= v.xmax + 1e-9; x += stX) {
        const isInt = Math.abs(x - Math.round(x)) < 1e-9;
        ctx.strokeStyle = isInt ? "#e2e8f0" : "#f1f5f9";
        ctx.beginPath(); ctx.moveTo(sx(x), PAD.t); ctx.lineTo(sx(x), H - PAD.b); ctx.stroke();
      }
    }
    {
      for (let y = Math.ceil(v.ymin / stY) * stY; y <= v.ymax + 1e-9; y += stY) {
        const isInt = Math.abs(y - Math.round(y)) < 1e-9;
        ctx.strokeStyle = isInt ? "#e2e8f0" : "#f1f5f9";
        ctx.beginPath(); ctx.moveTo(PAD.l, sy(y)); ctx.lineTo(W - PAD.r, sy(y)); ctx.stroke();
      }
    }
  }

  // axes
  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
  if (v.ymin <= 0 && v.ymax >= 0) { ctx.beginPath(); ctx.moveTo(PAD.l, sy(0)); ctx.lineTo(W - PAD.r, sy(0)); ctx.stroke(); }
  if (v.xmin <= 0 && v.xmax >= 0) { ctx.beginPath(); ctx.moveTo(sx(0), PAD.t); ctx.lineTo(sx(0), H - PAD.b); ctx.stroke(); }

  // tick labels — the step adapts to the zoom
  ctx.fillStyle = "#64748b";
  ctx.font = "11px system-ui, sans-serif";
  const xs = niceStep(v.xmax - v.xmin, Math.max(3, Math.floor((W - PAD.l - PAD.r) / 55)));
  const xd = stepDecimals(xs);
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let x = Math.ceil(v.xmin / xs) * xs; x <= v.xmax + 1e-9; x += xs) {
    if (Math.abs(x) < xs / 1e6) continue;
    ctx.fillText(num(x, xd), sx(x), H - PAD.b + 5);
  }
  const ys = niceStep(v.ymax - v.ymin, Math.max(3, Math.floor((H - PAD.t - PAD.b) / 40)));
  const yd = stepDecimals(ys);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let y = Math.ceil(v.ymin / ys) * ys; y <= v.ymax + 1e-9; y += ys) {
    if (Math.abs(y) < ys / 1e6) continue;
    ctx.fillText(num(y, yd), PAD.l - 6, sy(y));
  }
}

function drawCurve(c) {
  const v = W_().v;
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAD.l, PAD.t, W - PAD.l - PAD.r, H - PAD.t - PAD.b);
  ctx.clip();
  ctx.strokeStyle = c.colour; ctx.lineWidth = 2;
  ctx.beginPath();
  const steps = Math.max(400, Math.round(W * 1.5));
  let pen = false, lastPy = 0;
  for (let i = 0; i <= steps; i++) {
    const x = v.xmin + ((v.xmax - v.xmin) * i) / steps;
    const y = c.fn(x);
    if (!isFinite(y)) { pen = false; continue; }
    const px = sx(x), py = sy(y);
    // lift the pen across an asymptote instead of drawing a vertical streak
    if (pen && Math.abs(py - lastPy) > 3 * H) pen = false;
    if (!pen) { ctx.moveTo(px, py); pen = true; } else { ctx.lineTo(px, py); }
    lastPy = py;
  }
  ctx.stroke();
  ctx.restore();
}

function drawLegend() {
  const items = W_().curves;
  if (!items.length) return;
  ctx.save();
  ctx.font = "italic 15px 'Cambria Math', Cambria, Georgia, 'Times New Roman', serif";
  let wmax = 0;
  items.forEach((c) => { wmax = Math.max(wmax, ctx.measureText(displayOf(c)).width); });
  const bx = PAD.l + 10, by = PAD.t + 8;
  const bw = Math.min(wmax + 44, W - PAD.l - PAD.r - 20), bh = items.length * 22 + 10;
  ctx.globalAlpha = 0.92; ctx.fillStyle = "#ffffff";
  ctx.fillRect(bx, by, bw, bh);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  items.forEach((c, i) => {
    const y = by + 16 + i * 22;
    ctx.fillStyle = c.colour;
    ctx.fillRect(bx + 10, y - 2, 20, 3);
    ctx.fillStyle = "#0f172a";
    ctx.fillText(displayOf(c), bx + 36, y, bw - 44);
  });
  ctx.restore();
}

function drawLines() {
  const v = W_().v;
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAD.l, PAD.t, W - PAD.l - PAD.r, H - PAD.t - PAD.b);
  ctx.clip();

  lines.filter((L) => L.win === win).forEach((L) => {
    let a, b;
    if (L.kind === "secant") {
      const d = legs(L.p1, L.p2);
      a = d.dy / d.dx;            // geometry of the drawn line, never displayed
      b = L.p1.y - a * L.p1.x;
    } else {
      a = L.a;
      b = L.p1.y - a * L.p1.x;
    }
    ctx.strokeStyle = L.colour; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx(v.xmin), sy(a * v.xmin + b));
    ctx.lineTo(sx(v.xmax), sy(a * v.xmax + b));
    ctx.stroke();

    if (L.kind === "secant") {
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = L.colour; ctx.globalAlpha = 0.8; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx(L.p1.x), sy(L.p1.y));
      ctx.lineTo(sx(L.p2.x), sy(L.p1.y));
      ctx.lineTo(sx(L.p2.x), sy(L.p2.y));
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;

      // The triangle is drawn but not measured: the legs are the student's
      // to work out from the points they typed.
    }

    [L.p1, L.p2].forEach((p) => {
      if (!p) return;
      ctx.fillStyle = L.colour;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 3.5, 0, Math.PI * 2); ctx.fill();
    });
  });
  ctx.restore();
}

function drawProbe() {
  if (!probe) return;
  ctx.save();
  probe.hits.forEach((hit) => {
    ctx.strokeStyle = "#94a3b8"; ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx(probe.x), sy(hit.y)); ctx.lineTo(sx(probe.x), H - PAD.b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(probe.x), sy(hit.y)); ctx.lineTo(PAD.l, sy(hit.y)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(sx(probe.x), sy(hit.y), 4, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

function render() {
  if (!W || !H) sizeCanvas();
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  W_().curves.forEach(drawCurve);
  drawLines();
  drawKTool();
  drawProbe();
  drawLegend();
}

/* ---------------------------------------------------------------- readouts */

function renderReadouts() {
  const out = document.getElementById("probe-out");
  const note = document.getElementById("probe-note");
  if (!W_().curves.length) {
    out.textContent = t("probeNoCurves");
    note.textContent = "";
  } else if (probeMissed) {
    out.textContent = t("probeMiss");
    note.textContent = "";
  } else if (!probe) {
    out.textContent = t("probeEmpty");
    note.textContent = "";
  } else {
    // Function notation, not "y": the probe computes the value from the
    // function. The inserted-lines list deliberately does NOT use this form —
    // those points are whatever the student typed.
    out.innerHTML =
      '<i>x</i> = <span class="n">' + num(probe.x, DP) + '</span>' +
      probe.hits.map(function (hit) {
        return '&nbsp;&nbsp;&nbsp;&nbsp;<i>' + escapeHtml(hit.curve) + '</i>(<span class="n">' +
               num(probe.x, DP) + '</span>) = <span class="n">' + num(hit.y, DP) + '</span>';

}

}
function addWindow(kind) {

function setWin(i) {

function addFunction() {
  const inp = document.getElementById("func-in");
  const err = document.getElementById("func-err");
  const text = inp.value;
  if (!text.trim()) return;
  const w = W_();
  let def, fn;
  try {
    def = splitDefinition(text);
    fn = parseExpr(def.rhs);
  } catch (e) {
    const code = e instanceof ParseError ? e.code : "parse";
    err.textContent = code === "lhs" ? t("errFuncLhs") : code === "equals" ? t("errFuncEq") : t("errFunc");
    // A formula the bench could not read says something about what the
    // student tried; it goes to the tutor rather than vanishing.
    lastFunctionError = { text: text, graph_window: windowName(W_()) };
    emit("state-change", { changed: ["last_function_error"], state: simState(), triggeredBy: "function-error" });
    return;
  }
  let name = def.name;
  const existing = name ? w.curves.find((c) => c.name === name) : null;
  if (!name) {
    name = AUTO_NAMES.find((n) => !w.curves.some((c) => c.name === n));
    if (!name) { err.textContent = t("errFuncFull"); return; }
  }
  err.textContent = "";
  lastFunctionError = null;
  // Retyping a name replaces that function: correcting a typo is the
  // common case, and it keeps the curve's colour.
  if (existing) {
    existing.rhs = def.rhs; existing.fn = fn;
  } else {
    w.curves.push({ name: name, rhs: def.rhs, fn: fn,
                    colour: CURVE_COLOURS[w.colourSeq++ % CURVE_COLOURS.length] });
  }
  if (w.auto) fitWindow(w);
  probe = null; probeMissed = false;
  inp.value = "";
  flushPendingChanges("plot-function");
  // An x0 typed into the Δx-window before there was a curve to put it on
  // takes effect as soon as there is one.
  let pendingX0 = NaN;
  if (win === K_WIN && !probe && !kTool) pendingX0 = parseNum(document.getElementById("x0-in").value);
  emit("commit", {
    state: simState(),
    label: (existing ? t("funcChangedLabel") : t("funcLabel")) + " " + name + "(x) = " +
           def.rhs.trim() + " " + t("inWindow") + " " + windowName(W_()),
  });
  render(); renderReadouts(); renderFunctions();
  if (isFinite(pendingX0)) setX0(pendingX0); else renderK();
}

function removeFunction(c) {
  const w = W_();
  const i = w.curves.indexOf(c);
  if (i < 0) return;
  w.curves.splice(i, 1);
  if (w.auto) fitWindow(w);
  probe = null; probeMissed = false;
  if (win === K_WIN && kTool && !kCurve()) kTool = null;
  // Not `reset`: kinds ending .reset never reach the tutor.
  emit("state-change", { changed: ["functions_in_window"], state: simState(), triggeredBy: "delete-function" });
  render(); renderReadouts(); renderFunctions(); renderK();
}

function resetWindow() {
  manualWindow();
  const w = W_();
  w.auto = true;
  fitWindow(w);
  pendingChanges.window = true;
  render();
}

function manualWindow() { if (win === K_WIN && kZoom) setKZoom(false); }
function panBy(dxPx, dyPx) {
  manualWindow();
  const w = W_(), v = w.v;
  const wpx = (v.xmax - v.xmin) / (W - PAD.l - PAD.r);
  const wpy = (v.ymax - v.ymin) / (H - PAD.t - PAD.b);
  v.xmin -= dxPx * wpx; v.xmax -= dxPx * wpx;
  v.ymin += dyPx * wpy; v.ymax += dyPx * wpy;
  w.auto = false;
  render();
}

// Zoom by factor f (>1 out, <1 in) keeping the world point under (px, py) fixed.
function zoomAt(f, px, py) {
  manualWindow();
  const w = W_(), v = w.v;
  const nx = (v.xmax - v.xmin) * f, ny = (v.ymax - v.ymin) * f;
  if (nx < 1e-3 || ny < 1e-3 || nx > 1e5 || ny > 1e5) return;
  const cx = wx(px), cy = wy(py);
  v.xmin = cx - (cx - v.xmin) * f; v.xmax = cx + (v.xmax - cx) * f;
  v.ymin = cy - (cy - v.ymin) * f; v.ymax = cy + (v.ymax - cy) * f;
  w.auto = false;
  pendingChanges.window = true;
  render();
}
// Stretch ONE axis by factor f (>1 shows more, <1 shows less). The fixed
// point is the origin when it is in view — the axes then grow out of 0, as in
// GeoGebra — and otherwise the middle of the window.
function scaleAxis(axis, f) {
  manualWindow();
  const w = W_(), v = w.v;
  const lo = axis === "x" ? "xmin" : "ymin", hi = axis === "x" ? "xmax" : "ymax";
  const n = (v[hi] - v[lo]) * f;
  if (n < 1e-3 || n > 1e5) return;
  const c = v[lo] <= 0 && v[hi] >= 0 ? 0 : (v[lo] + v[hi]) / 2;
  v[lo] = c - (c - v[lo]) * f; v[hi] = c + (v[hi] - c) * f;
  w.auto = false;
  render();
}
// Which strip a canvas point lies in: the x-axis labels below the plot, the
// y-axis labels to its left, or neither.
function axisZone(px, py) {
  if (py > H - PAD.b && px > PAD.l) return "x";
  if (px < PAD.l && py < H - PAD.b) return "y";
  return null;
}
function zoomCentre(f) { zoomAt(f, (PAD.l + W - PAD.r) / 2, (PAD.t + H - PAD.b) / 2); }

// Every curve within tolerance of a point on the canvas, nearest first. Not
// just the nearest: where two curves cross, picking either arbitrarily
// mislabels the reading and puts the wrong curve in the log.
const HIT_PX = 26;     // how close a click has to be to register on a curve
const AMBIG_PX = 13;   // how close the runners-up have to be to count as well
function curvesNear(px, py) {
  const xw = wx(px);
  const hits = [];
  W_().curves.forEach((c) => {
    const y = c.fn(xw);
    if (!isFinite(y)) return;
    const d = Math.abs(sy(y) - py);
    if (d < HIT_PX) hits.push({ c: c, d: d });
  });
  hits.sort((a, b) => a.d - b.d);
  return hits.filter((h) => h.d - hits[0].d <= AMBIG_PX);
}

// With a grid on, a click snaps to the nearest place where the curve crosses
// a grid LINE — vertical (x on the grid) or horizontal (y on the grid) — not
// only where it crosses a vertical one (Ida, 10 Oct 2026). Whichever crossing
// lies closest to the click on screen wins. Either way the point lies ON the
// curve: y is always the function's value at the chosen x.
function snapProbeX(px, py, c) {
  const xw = wx(px);
  const xa = gridSnap(xw, gridStepX());
  let best = { x: xa, d: Math.hypot(sx(xa) - px, sy(c.fn(xa)) - py) };
  if (!isFinite(best.d)) best.d = Infinity;
  const y0 = gridSnap(c.fn(xw), gridStepY());
  if (!isFinite(y0)) return xa;
  const SPAN = 40, N = 80;          // search ±40 px around the click
  let prevX = wx(px - SPAN), prevV = c.fn(prevX) - y0;
  for (let i = 1; i <= N; i++) {
    const x = wx(px - SPAN + (2 * SPAN * i) / N);
    const v = c.fn(x) - y0;
    if (isFinite(v) && isFinite(prevV) && (v === 0 || prevV * v < 0)) {
      let a = prevX, b = x, fa = prevV;
      for (let k = 0; k < 60; k++) {
        const m = (a + b) / 2, fm = c.fn(m) - y0;
        if (fa * fm <= 0) { b = m; } else { a = m; fa = fm; }
      }
      const root = (a + b) / 2;
      const d = Math.hypot(sx(root) - px, sy(y0) - py);
      if (d < best.d) best = { x: root, d: d };
    }
    prevX = x; prevV = v;
  }
  return best.x;
}

function handleProbe(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const px = clientX - r.left, py = clientY - r.top;
  const near = curvesNear(px, py);
  const xs = gridStep && near.length ? snapProbeX(px, py, near[0].c) : gridSnap(wx(px), gridStepX());
  // y is the function's value at xs, so the probed point lies ON the curve.
  const hits = near
    .map((h) => ({ curve: h.c.name, y: h.c.fn(xs) }))
    .filter((h) => isFinite(h.y));
  if (!hits.length) {
    probe = null;
    probeMissed = W_().curves.length > 0;   // a miss is reported, not ignored
    render(); renderReadouts();
    return;
  }
  probeMissed = false;
  probe = { x: xs, hits: hits };
  pendingChanges.last_reading = true;
  // In the k-window the probe chooses P; k stays where the student left it.
  if (win === K_WIN && kTool) {
    kTool.x0 = xs; kTool.curve = hits[0].curve;
    pendingChanges.k_tool = true;
    fitK();
  }
  render(); renderReadouts(); renderK();
}

/* ------------------------------------------------------------- k instrument */

// 1 rather than 1,0000 where the value is the point the student chose.
// A number the student typed, shown as they typed it: no padding to four
// decimals ("0" not "0,0000"), and no rounding away of the extra decimals
// they computed themselves (2,90026001 stays 2,90026001).
function typed(v) { return shortNum(v, 10); }
function shortNum(v, dp) {
  return num(v, dp).replace(/([.,]\d*?)0+$/, "$1").replace(/[.,]$/, "");
}

// The magnifier. While it is on, the Δx-window keeps the triangle in view —
// whatever Δx is, from 2 down to 0,0001 — re-fitting every time Δx or the
// point changes. The units-per-pixel ratio of the two axes is kept from the
// moment it was switched on, so the secant does not change angle on screen
// just because of the zoom: what changes is the curve, which straightens out
// as Δx shrinks. Panning, zooming or stretching an axis by hand switches it
// off; so does pressing it again, which also restores the earlier window.
let kZoom = false;
let kZoomSaved = null;   // {v, auto, ratio}
function setKZoom(on) {
  const w = WINDOWS[K_WIN];
  if (on === kZoom) return;
  kZoom = on;
  if (on) {
    const v = w.v;
    kZoomSaved = { v: Object.assign({}, v), auto: w.auto,
                   ratio: ((v.ymax - v.ymin) / (H - PAD.t - PAD.b)) / ((v.xmax - v.xmin) / (W - PAD.l - PAD.r)) };
    fitK();
  } else if (kZoomSaved && arguments[1] === "restore") {
    w.v = Object.assign({}, kZoomSaved.v); w.auto = kZoomSaved.auto;
  }
  document.getElementById("k-zoom").setAttribute("aria-pressed", String(kZoom));
  pendingChanges.window = true;
  render();
}
function fitK() {
  if (!kZoom || !kTool) return;
  const st = kState();
  if (!st || !isFinite(st.y0) || !isFinite(st.y_at_x0_plus_k)) return;
  const w = WINDOWS[K_WIN];
  const pw = W - PAD.l - PAD.r, ph = H - PAD.t - PAD.b;
  const ratio = kZoomSaved ? kZoomSaved.ratio : 1;     // y-units per pixel ÷ x-units per pixel
  const dx = Math.max(Math.abs(st.k), 1e-6), dy = Math.abs(st.dy);
  // x-span: the triangle takes about 40 % of the width …
  let xs = dx / 0.4;
  // … unless Δy would then not fit in 60 % of the height
  const ysNeeded = dy / 0.6;
  if (xs * ratio * ph / pw < ysNeeded) xs = ysNeeded / (ratio * ph / pw);
  const ys = xs * ratio * ph / pw;
  const cx = (st.x0 + st.x0_plus_k) / 2, cy = (st.y0 + st.y_at_x0_plus_k) / 2;
  w.v = { xmin: cx - xs / 2, xmax: cx + xs / 2, ymin: cy - ys / 2, ymax: cy + ys / 2 };
  w.auto = false;
}

// Typing x0 instead of clicking: a point such as x0 = -0,3 lies between the
// finest grid lines and cannot be hit by a click (Ida, 11 Oct 2026). The typed
// x0 becomes the probe — on the curve the Δx tool is already using, otherwise
// on the first curve in the window — and moves P if the tool is on. y is the
// function's value there, as always.
function setX0(x0) {
  const w = WINDOWS[K_WIN];
  if (!isFinite(x0) || !w.curves.length) return;
  const c = (kTool && kCurve()) || w.curves[0];
  // Enter and the later change event both arrive: do the same thing once
  if (probe && probe.x === x0 && probe.hits[0] && probe.hits[0].curve === c.name &&
      (!kTool || kTool.x0 === x0)) return;
  const y = c.fn(x0);
  if (!isFinite(y)) return;
  probe = { x: x0, hits: [{ curve: c.name, y: y }] };
  probeMissed = false;
  pendingChanges.last_reading = true;
  if (kTool) { kTool.x0 = x0; kTool.curve = c.name; pendingChanges.k_tool = true; fitK(); }
  if (kTool) commitK("type-x0"); else { render(); renderK(); }
  renderReadouts();
}

function renderK() {
  const add = document.getElementById("k-add");
  const on = !!(kTool && kCurve());
  const x0in = document.getElementById("x0-in");
  const x0now = kTool ? kTool.x0 : (probe ? probe.x : null);
  if (document.activeElement !== x0in) x0in.value = x0now === null ? "" : shortNum(x0now, DP);
  add.disabled = !(probe && probe.hits.length);
  add.title = add.disabled ? t("kPick") : "";
  add.classList.toggle("hidden", on);
  ["k-range", "k-in", "k-zoom", "k-remove", "k-out"].forEach((id) => document.getElementById(id).classList.toggle("hidden", !on));
  if (!on) { if (kZoom) setKZoom(false); return; }
  const st = kState(), d = kDecimals(st.k), n = escapeHtml(st.curve);
  const rng = document.getElementById("k-range");
  if (document.activeElement !== rng) rng.value = String(Math.max(-2, Math.min(2, st.k)));
  const kin = document.getElementById("k-in");
  if (document.activeElement !== kin) kin.value = shortNum(st.k, d);
  // Only what the student chose: the point and k. The function values are
  // for them to work out.
  document.getElementById("k-out").innerHTML =
    '<i>x</i>&#8320; = <span class="n">' + shortNum(st.x0, DP) + '</span>&nbsp;&nbsp;&nbsp; ' +
    '<span class="kx">Δ<i>x</i> = <span class="n">' + shortNum(st.k, d) + '</span></span>';
}

function startK() {
  if (kTool || !probe || !probe.hits.length) return;
  kTool = { curve: probe.hits[0].curve, x0: probe.x, k: 1 };
  commitK("start-k");
}
function setK(k, commit) {
  if (!kTool || !isFinite(k)) return;
  kTool.k = k;
  pendingChanges.k_tool = true;
  fitK();
  render(); renderK();
  if (commit) commitK("set-k");
}
function commitK(why) {
  const st = kState();
  flushPendingChanges(why);
  if (st) {
    const d = kDecimals(st.k);
    emit("reading", {
      state: simState(),
      // Shown to the student in the chat: the point and k, never a value.
      label: t("kLabel") + " " + shortNum(st.k, d) + " (x\u2080 = " + shortNum(st.x0, DP) + ")",
    });
  }
  render(); renderK();
}
function removeK() {
  if (!kTool) return;
  kTool = null;
  emit("state-change", { changed: ["k_tool"], state: simState(), triggeredBy: "remove-k" });
  render(); renderK();
}

// Text on a white plate, so a label stays readable where it crosses a curve.
function plateText(text, x, y, align, baseline, colour) {
  const w = ctx.measureText(text).width, h = 16, pad = 3;
  let left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  let top = baseline === "bottom" ? y - h : baseline === "middle" ? y - h / 2 : y;
  left = Math.max(PAD.l + 2, Math.min(left, W - PAD.r - w - 2));
  top = Math.max(PAD.t + 2, Math.min(top, H - PAD.b - h - 2));
  ctx.save();
  ctx.globalAlpha = 0.92; ctx.fillStyle = "#ffffff";
  ctx.fillRect(left - pad, top - 1, w + 2 * pad, h + 2);
  ctx.globalAlpha = 1; ctx.fillStyle = colour;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(text, left, top + h / 2);
  ctx.restore();
}

function drawKTool() {
  if (win !== K_WIN) return;
  const st = kState();
  if (!st || !isFinite(st.y0) || !isFinite(st.y_at_x0_plus_k)) return;
  const v = W_().v;
  const P = { x: st.x0, y: st.y0 }, Q = { x: st.x0_plus_k, y: st.y_at_x0_plus_k };
  const d = kDecimals(st.k);
  // Markers sit on the axes when the axes are in view, otherwise on the frame.
  const yb = (v.ymin <= 0 && v.ymax >= 0) ? sy(0) : H - PAD.b;
  const xb = (v.xmin <= 0 && v.xmax >= 0) ? sx(0) : PAD.l;
  const KX = "#d97706", KY = "#16a34a", SEC = "#7c3aed";
  ctx.save();
  ctx.beginPath(); ctx.rect(PAD.l, PAD.t, W - PAD.l - PAD.r, H - PAD.t - PAD.b); ctx.clip();

  // the line through the two points — drawn, never measured
  if (Math.abs(st.k) > 1e-12) {
    const a = st.dy / st.k, b = P.y - a * P.x;
    ctx.strokeStyle = SEC; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(sx(v.xmin), sy(a * v.xmin + b)); ctx.lineTo(sx(v.xmax), sy(a * v.xmax + b)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // guides from both points to both axes
  ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
  [[P, "#94a3b8"], [Q, "#94a3b8"]].forEach(function (pc) {
    ctx.strokeStyle = pc[1];
    ctx.beginPath(); ctx.moveTo(sx(pc[0].x), sy(pc[0].y)); ctx.lineTo(sx(pc[0].x), yb); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(pc[0].x), sy(pc[0].y)); ctx.lineTo(xb, sy(pc[0].y)); ctx.stroke();
  });
  ctx.setLineDash([]);

  // k on the x-axis
  ctx.strokeStyle = KX; ctx.fillStyle = KX; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx(P.x), yb); ctx.lineTo(sx(Q.x), yb); ctx.stroke();
  ctx.lineWidth = 2;
  [P.x, Q.x].forEach(function (x) { ctx.beginPath(); ctx.moveTo(sx(x), yb - 6); ctx.lineTo(sx(x), yb + 6); ctx.stroke(); });
  ctx.font = "italic 13px 'Cambria Math', Cambria, Georgia, serif";
  // endpoints on the x-axis: x0 and x0 + k, as the student would write them
  const a = shortNum(st.x0, DP);
  const qRight = Q.x >= P.x;
  plateText(a, sx(P.x) + (qRight ? -3 : 3), yb + 10, qRight ? "right" : "left", "top", KX);
  plateText(a + " + Δx", sx(Q.x) + (qRight ? 3 : -3), yb + 10, qRight ? "left" : "right", "top", KX);

  // the y-increment on the y-axis
  ctx.strokeStyle = KY; ctx.fillStyle = KY; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(xb, sy(P.y)); ctx.lineTo(xb, sy(Q.y)); ctx.stroke();
  ctx.lineWidth = 2;
  [P.y, Q.y].forEach(function (y) { ctx.beginPath(); ctx.moveTo(xb - 6, sy(y)); ctx.lineTo(xb + 6, sy(y)); ctx.stroke(); });
  const n = st.curve;
  // endpoints on the y-axis: f(x0) and f(x0 + k), each at its own height, on
  // the far side of the axis from P, pushed apart so they never overlap
  const onRight = sx(P.x) < xb;
  const qUp = sy(Q.y) <= sy(P.y);
  const lx = onRight ? xb + 10 : xb - 10, al = onRight ? "left" : "right";
  plateText(n + "(" + a + ")", lx, sy(P.y) + (qUp ? 3 : -3), al, qUp ? "top" : "bottom", KY);
  plateText(n + "(" + a + " + Δx)", lx, sy(Q.y) + (qUp ? -3 : 3), al, qUp ? "bottom" : "top", KY);

  // The increment triangle at the graph, as in the textbooks (webmatematik's
  // figure): a horizontal leg labelled Δx from P, a vertical leg labelled Δy up
  // or down to Q. Names only, never values (Ida, 10 Oct 2026).
  if (Math.abs(st.k) > 1e-12) {
    const C = { x: Q.x, y: P.y };
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = KX;
    ctx.beginPath(); ctx.moveTo(sx(P.x), sy(P.y)); ctx.lineTo(sx(C.x), sy(C.y)); ctx.stroke();
    ctx.strokeStyle = KY;
    ctx.beginPath(); ctx.moveTo(sx(C.x), sy(C.y)); ctx.lineTo(sx(Q.x), sy(Q.y)); ctx.stroke();
    ctx.font = "italic 14px 'Cambria Math', Cambria, Georgia, serif";
    const up = sy(Q.y) < sy(P.y);
    // Δx under the horizontal leg when Q is above it, over it when below
    plateText("Δx", (sx(P.x) + sx(C.x)) / 2, sy(P.y) + (up ? 5 : -5), "center", up ? "top" : "bottom", KX);
    // Δy beside the vertical leg, on the side away from P
    const right = sx(Q.x) >= sx(P.x);
    plateText("Δy", sx(C.x) + (right ? 6 : -6), (sy(C.y) + sy(Q.y)) / 2, right ? "left" : "right", "middle", KY);
  }

  // the two points
  ctx.fillStyle = "#0f172a";
  ctx.beginPath(); ctx.arc(sx(P.x), sy(P.y), 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SEC;
  ctx.beginPath(); ctx.arc(sx(Q.x), sy(Q.y), 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* --------------------------------------------------------------------- wire */

document.getElementById("menu-toggle").addEventListener("click", function () {
  const m = document.getElementById("menu");
  const open = m.classList.toggle("hidden") === false;
  this.setAttribute("aria-expanded", String(open));
  if (open) m.scrollIntoView({ block: "nearest", behavior: "smooth" });
  // The tools start collapsed, so opening them marks the move from measuring
  // to constructing. Unlabelled — it is not a commit.
  pendingChanges.tools_panel_open = true;
  toolsOpen = open;
});

});

});

function showGridPop(open) {

});
// A click anywhere else closes the choices again.
document.addEventListener("pointerdown", (e) => {

  if (!e.target.closest("#win-pop, #win-add")) showWinPop(false);
});
document.getElementById("add-secant").addEventListener("click", addSecant);
// Enter in a line field inserts the line, as Enter in the function field plots.
["sx1", "sy1", "sx2", "sy2"].forEach((id) => document.getElementById(id).addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addSecant(); }
}));
["px", "py", "pa"].forEach((id) => document.getElementById(id).addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addLine(); }
}));
document.getElementById("add-line").addEventListener("click", addLine);
document.getElementById("clear-lines").addEventListener("click", clearLines);
document.getElementById("reset-window").addEventListener("click", resetWindow);
document.getElementById("zoom-in").addEventListener("click", () => zoomCentre(1 / 1.5));
document.getElementById("zoom-out").addEventListener("click", () => zoomCentre(1.5));

// One finger or mouse: drag to pan, click to probe. A pointer that moved less
// than 4 px is a click. Two fingers: pinch to zoom, and no probe afterwards.
const pointers = new Map();
let drag = null;
let pinch = null;
let gestureHadPinch = false;
function pinchInfo() {
  const ps = Array.from(pointers.values());
  const r = canvas.getBoundingClientRect();
  return {
    d: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y),
    mx: (ps[0].x + ps[1].x) / 2 - r.left, my: (ps[0].y + ps[1].y) / 2 - r.top,
  };
}
canvas.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1) {
    gestureHadPinch = false;
    const b = canvas.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, moved: 0, axis: axisZone(e.clientX - b.left, e.clientY - b.top) };
    if (!drag.axis) canvas.classList.add("dragging");
  } else if (pointers.size === 2) {
    drag = null;
    gestureHadPinch = true;
    pinch = pinchInfo();
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const now = pinchInfo();
    if (now.d > 0) zoomAt(pinch.d / now.d, now.mx, now.my);
    pinch = now;
    return;
  }
  if (!drag) {
    const b = canvas.getBoundingClientRect();
    const zone = axisZone(e.clientX - b.left, e.clientY - b.top);
    canvas.classList.toggle("over-xaxis", zone === "x");
    canvas.classList.toggle("over-yaxis", zone === "y");
    canvas.classList.toggle("over-curve", !zone && curvesNear(e.clientX - b.left, e.clientY - b.top).length > 0);
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  // Dragging right along the x labels, or up along the y labels, stretches
  // that axis (shows less of it); the other way squeezes it.
  if (drag.axis === "x") scaleAxis("x", Math.exp(-dx / 300));
  else if (drag.axis === "y") scaleAxis("y", Math.exp(dy / 300));
  else if (drag.moved > 4) panBy(dx, dy);
  drag.x = e.clientX; drag.y = e.clientY;
});
function endPointer(e, cancelled) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size > 0) return;
  canvas.classList.remove("dragging");
  const d = drag;
  drag = null;
  if (cancelled || !d) return;
  if (d.moved <= 4 && !gestureHadPinch && !d.axis) handleProbe(e.clientX, e.clientY);
  else pendingChanges.window = true;
}
canvas.addEventListener("pointerup", (e) => endPointer(e, false));
canvas.addEventListener("pointercancel", (e) => endPointer(e, true));
canvas.addEventListener("pointerleave", () => { canvas.classList.remove("over-curve", "over-xaxis", "over-yaxis"); });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  zoomAt(Math.exp(Math.max(-0.5, Math.min(0.5, e.deltaY * 0.0015))), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

document.getElementById("lang-da").addEventListener("click", () => { lang = "da"; langLockedByStudent = true; applyLang(); });
document.getElementById("lang-en").addEventListener("click", () => { lang = "en"; langLockedByStudent = true; applyLang(); });

window.addEventListener("resize", () => { sizeCanvas(); render(); });

sizeCanvas();
applyLang();

/* --------------------------------------------------------------- self-test */

if (TEST_MODE) {
  const cases = [
    ["2x^2-4x", 1.25, -1.875], ["1/3x^2+2x+1", 1, 10 / 3], ["⅓x²+2x+1", 1, 10 / 3],
    ["x²", 3, 9], ["-x^2", 2, -4], ["(x+1)(x-1)", 3, 8], ["0,5x", 2, 1], ["2sqrt(x)", 4, 4],
  ];
  const bad = [];
  cases.forEach(function (c) {
    let got;
    try { got = parseExpr(c[0])(c[1]); } catch (e) { got = NaN; }
    if (!(Math.abs(got - c[2]) < 1e-9)) bad.push(c[0] + " -> " + got);
  });
  ["x^", "2**x", "abc", "(x+1", ""].forEach(function (s) {
    try { parseExpr(s); bad.push("accepted: " + s); } catch (e) { /* expected */ }
  });
  // probe semantics: x snaps to the grid, y comes from the function
  if (Math.abs(parseExpr("2x^2-4x")(gridSnap(1.3, 0.25)) - -1.875) > 1e-9) bad.push("probe snap");
  document.title = (bad.length ? "TEST FAIL" : "TEST PASS") + " — " + strings.da.title;
  if (bad.length) console.error("Self-test failed: " + bad.join("; "));
}

/* ------------------------------------------------------------------ handshake */

const b = bridge();
if (b) {
  b.init({ name: ARTEFACT_NAME, version: "2.1.0" });
  b.onChatFlush(function () { flushPendingChanges("chat-submit"); });
  emit("open", { state: simState() });
  let waited = 0;
  const poll = setInterval(function () {
    waited += 50;
    let hc = null;
    try { hc = b.hostContext && b.hostContext(); } catch (e) { hc = null; }
    if (hc && typeof hc.locale === "string") {
      const two = hc.locale.slice(0, 2);
      if (!langLockedByStudent && (two === "da" || two === "en") && two !== lang) {
        lang = two; applyLang();
      }
      clearInterval(poll);
    }
    if (waited >= 2000) clearInterval(poll);
  }, 50);
}
