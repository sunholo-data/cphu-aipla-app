<title>{{ARTEFACT_TITLE}} — interaktiv visualisering</title>
<!--
  AIPLA MCP App artefact template (v1).

  Copy this directory: `scripts/new-artefact.sh <name>`
  Then edit:
    - <title> tag + header h1 (Danish-first copy)
    - The "givens" line (problem parameters)
    - <canvas id="viz"> physics in <script> below
    - The Vis-markers list + their compute fns
    - (optional) extra component / position graphs
    - The self-test at the bottom (?test=1)

  Rules enforced by the harness (ADR-013):
    1. Single self-contained file, =< 200 KB total
    2. NO external resources: no script-src http, no img-src http, no
       network fetch calls, no eval. The host's CSP blocks these even
       if you try.
    3. NO nested iframe. frame-src 'none'.
    4. Pedagogical guardrail: marker values are redacted (—) until the
       student clicks "Vis". Dragging a slider should reset reveals so
       the student must commit a fresh calculation per parameter set.
    5. Emit postMessage telemetry — see emit() below. The host (and
       OTel) listens for these and surfaces them in Cloud Trace.

  See .claude/skills/mcp-app-artefact/SKILL.md for the full recipe.
-->
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #78716c;
    --border: #e7e5e4;
    --accent: #1e40af;
    --accent-soft: #dbeafe;
    --hidden: #d6d3d1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    font-size: 14px; line-height: 1.4;
  }
  body { padding: 12px; }
  header { margin-bottom: 8px; }
  header h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  header .givens { color: var(--muted); font-size: 12px; }
  main {
    display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  @media (min-width: 720px) {
    main { grid-template-columns: 2fr 1fr; }
  }
  .canvas-wrap {
    background: white; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px;
  }
  canvas { width: 100%; height: auto; display: block; touch-action: none; }
  .panel {
    background: white; border: 1px solid var(--border);
    border-radius: 6px; padding: 10px;
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .controls .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .controls label { font-size: 12px; min-width: 30px; }
  .controls input[type="range"] { flex: 1; }
  .controls .value { font-variant-numeric: tabular-nums; min-width: 55px; text-align: right; font-size: 12px; }
  .buttons { display: flex; gap: 6px; margin-top: 8px; }
  button {
    font: inherit; font-size: 12px; padding: 6px 10px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid transparent; border-radius: 4px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .markers .row {
    display: flex; align-items: baseline; gap: 6px; margin: 6px 0;
    padding: 6px; border-radius: 4px; background: #f5f5f4;
  }
  .markers .label { flex: 1; font-size: 12px; }
  .markers .value {
    font-variant-numeric: tabular-nums; font-weight: 600;
    color: var(--hidden); min-width: 60px; text-align: right;
  }
  .markers .value.revealed { color: var(--accent); }
  .markers button.vis {
    font-size: 11px; padding: 3px 8px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .markers button.vis.revealed { color: var(--accent); border-color: var(--accent); }
  .pedagogy {
    margin-top: 8px; padding: 8px;
    background: #fef3c7; border-left: 3px solid #f59e0b;
    font-size: 11px; color: #78350f;
    border-radius: 0 4px 4px 0;
  }
</style>
</head>
<body>
<header>
  <h1>{{ARTEFACT_TITLE}}</h1>
  <div class="givens">
    <!-- TODO: list the problem's given parameters -->
    parameter₁ = X &nbsp;·&nbsp; parameter₂ = Y
  </div>
</header>
<main>
  <section class="canvas-wrap">
    <canvas id="viz" width="600" height="320" aria-label="Visualisering"></canvas>
  </section>
  <aside>
    <div class="panel controls">
      <h2>Kontrol</h2>
      <!-- TODO: sliders for adjustable parameters -->
      <div class="row">
        <label for="p1">p₁</label>
        <input id="p1" type="range" min="0" max="100" value="50">
        <span class="value" id="p1-out">50</span>
      </div>
      <div class="buttons">
        <button id="play" type="button">▶ Afspil</button>
        <button id="pause" type="button" class="ghost">⏸ Pause</button>
        <button id="reset" type="button" class="ghost">↺ Nulstil</button>
      </div>
    </div>
    <div class="panel markers" style="margin-top: 10px;">
      <h2>Resultater</h2>
      <!-- TODO: one row per answer-marker. data-marker is the postMessage key. -->
      <div class="row">
        <span class="label">Eksempel-resultat</span>
        <span class="value" data-value-for="example">—</span>
        <button class="vis" type="button" data-marker="example">Vis</button>
      </div>
      <p class="pedagogy">
        Værdierne er skjult med vilje. Beregn dem først selv på papir — så afslør for at tjekke.
      </p>
    </div>
  </aside>
</main>
<!-- @aipla-bridge:start (GENERATED — edit infrastructure/mcp-sandbox/bridge/aipla-mcp-bridge.js, then `make sim-build`) -->
<script>
/* ============================================================================
 * AIPLA MCP App guest bridge — ONE canonical transport for every host.
 *
 * SOURCE OF TRUTH. This file is inlined verbatim into every artefact's
 * index.html between the `@aipla-bridge:start … @aipla-bridge:end` markers by
 * `scripts/build-artefact-bridge.mjs` (run `make sim-build`). NEVER hand-edit
 * the inlined copy — edit THIS file and rebuild. CI (`--check`) fails on drift.
 *
 * It speaks whichever host is present:
 *   - AIPLA app / SEP-1865 hosts  → JSON-RPC `ui/update-model-context` over
 *                                   window.parent.postMessage (the app reads
 *                                   structuredContent + renders the trust card).
 *   - ChatGPT (OpenAI Apps SDK)   → window.openai.setWidgetState (durable state)
 *                                   + window.openai.sendFollowUpMessage (turns a
 *                                   deliberate commit into an immediate turn).
 *   - Claude Desktop / Inspector  → the same SEP-1865 postMessage + `content`.
 *
 * The window.openai block is guarded end-to-end: absent in the AIPLA app and
 * Claude, so it is a pure no-op there and the postMessage path stays
 * authoritative. See docs/design/aipla/v1.1.0-feedback/shared-mcp-app-bridge.md.
 *
 * Public surface (window.AIPLA_BRIDGE):
 *   emit(kind, extra)                 — report a student interaction. `kind` is
 *                                       the FULL event kind (e.g. "boldkast.play").
 *                                       `extra.label` (a curated string) marks a
 *                                       DELIBERATE COMMIT — only labelled emits
 *                                       inject a ChatGPT follow-up turn.
 *   init({ name, version })           — run the ui/initialize handshake. Call once
 *                                       at the bottom of the artefact script.
 *   onChatFlush(cb)                   — cb() runs on ui/notifications/chat-flush.
 *   onHostNotification(method, cb)    — cb(params, msg) runs on any host→iframe
 *                                       JSON-RPC notification with that method.
 *   hostContext()                     — the hostContext returned by ui/initialize.
 *
 * Conservative JS (var/function) so it runs unchanged in any host iframe engine.
 * ========================================================================== */
(function () {
  "use strict";

  var __rpcNextId = 1;
  var __initialized = false;
  var __pendingEmits = [];
  var __hostContext = null;
  var __handlers = {}; // method -> [cb]

  function __post(msg) {
    try {
      // targetOrigin "*" is safe: the outer sandbox proxy validates origin on
      // its side per ADR-013, then re-postMessages to the host with the host's
      // specific origin. In standalone (artefact opened directly) parent may not
      // exist — swallow.
      window.parent.postMessage(msg, "*");
    } catch (e) {
      /* no host */
    }
  }

  function rpcNotify(method, params) {
    __post({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function rpcRequest(method, params) {
    return new Promise(function (resolve, reject) {
      var id = __rpcNextId++;
      var listener = function (e) {
        var d = e.data;
        if (!d || d.id !== id) return;
        window.removeEventListener("message", listener);
        if (d.result !== undefined) resolve(d.result);
        else reject(new Error((d.error && d.error.message) || "rpc error"));
      };
      window.addEventListener("message", listener);
      __post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  // Single host→iframe listener: respond to ping (spec), dispatch registered
  // notification handlers. rpcRequest installs its own short-lived id-matched
  // listener separately for responses.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.jsonrpc !== "2.0") return;
    if (d.method === "ping" && d.id !== undefined && d.id !== null) {
      __post({ jsonrpc: "2.0", id: d.id, result: {} });
      return;
    }
    if (d.method && __handlers[d.method]) {
      var cbs = __handlers[d.method];
      for (var i = 0; i < cbs.length; i++) {
        try {
          cbs[i](d.params, d);
        } catch (err) {
          /* a handler throwing must not break the bridge */
        }
      }
    }
  });

  // Derive a human-readable `content` text for generic MCP hosts (ChatGPT /
  // Claude feed `content` to the model and treat `structuredContent` as
  // schema-validated app data — without a text the model never sees the
  // interaction). Prefers the curated `label`; else summarises the payload.
  // The AIPLA frontend reads structuredContent and IGNORES content, so this is
  // purely additive for our own app.
  function __contentText(kind, p) {
    if (p && typeof p.label === "string" && p.label) return p.label;
    if (!p) return kind;
    var parts = [];
    for (var k in p) {
      if (k === "label") continue;
      var v = p[k];
      if (Array.isArray(v)) {
        parts.push(k + "=[" + v.length + "]");
      } else if (v && typeof v === "object") {
        for (var k2 in v) {
          if (v[k2] == null || typeof v[k2] !== "object") parts.push(k2 + "=" + v[k2]);
        }
      } else {
        parts.push(k + "=" + v);
      }
    }
    return kind + (parts.length ? " (" + parts.join(", ") + ")" : "");
  }

  function emit(kind, extra) {
    extra = extra || {};
    var sc = Object.assign({}, extra, { kind: kind });
    var params = { structuredContent: sc };
    var label = typeof extra.label === "string" && extra.label ? extra.label : "";
    var text = label || __contentText(kind, extra);
    if (text) params.content = [{ type: "text", text: text }];

    // ── ChatGPT (OpenAI Apps SDK) ──────────────────────────────────────────
    // Absent in the AIPLA app / Claude → whole block no-ops. Guard every call.
    var oa = typeof window !== "undefined" ? window.openai : undefined;
    if (oa) {
      try {
        if (oa.setWidgetState) oa.setWidgetState(sc);
      } catch (e) {
        /* best effort */
      }
      // Inject a turn ONLY on a deliberate commit (has a curated label) — never
      // on a passive settle or a derived-text event. Gated on `label`, NOT on
      // `content` (content is near-always present via __contentText).
      if (label && oa.sendFollowUpMessage) {
        try {
          oa.sendFollowUpMessage({ prompt: label });
        } catch (e) {
          /* best effort */
        }
      }
    }

    // ── SEP-1865 postMessage (AIPLA app + native hosts) — authoritative ─────
    var msg = { jsonrpc: "2.0", method: "ui/update-model-context", params: params };
    if (!__initialized) {
      __pendingEmits.push(msg);
      return;
    }
    __post(msg);
  }

  function onHostNotification(method, cb) {
    if (!__handlers[method]) __handlers[method] = [];
    __handlers[method].push(cb);
  }

  function onChatFlush(cb) {
    onHostNotification("ui/notifications/chat-flush", function () {
      cb();
    });
  }

  function init(clientInfo) {
    var ci = {
      name: (clientInfo && clientInfo.name) || "aipla-sim",
      version: (clientInfo && clientInfo.version) || "1.0.0",
    };
    // If parent isn't a sandbox proxy (standalone testing) this rejects and we
    // flip __initialized so queued emits stop queuing (they become __post
    // no-ops via the try/catch).
    rpcRequest("ui/initialize", {
      protocolVersion: "2026-01-26",
      capabilities: {},
      clientInfo: ci,
    })
      .then(function (result) {
        __hostContext = (result && result.hostContext) || null;
        rpcNotify("ui/notifications/initialized", { clientInfo: ci });
        __initialized = true;
        while (__pendingEmits.length) __post(__pendingEmits.shift());
      })
      .catch(function () {
        __initialized = true;
        __pendingEmits.length = 0;
      });
  }

  window.AIPLA_BRIDGE = {
    emit: emit,
    init: init,
    onChatFlush: onChatFlush,
    onHostNotification: onHostNotification,
    hostContext: function () {
      return __hostContext;
    },
  };
})();
</script>
<!-- @aipla-bridge:end -->
<script>
  "use strict";
  // ─── Telemetry helper (DO NOT REMOVE) ───────────────────────────────────
  // The transport is the shared MCP App guest bridge (AIPLA_BRIDGE, inlined
  // above from bridge/aipla-mcp-bridge.js — run `make sim-build`; never
  // hand-edit it). It speaks BOTH the AIPLA app (SEP-1865 postMessage) and
  // ChatGPT (window.openai), so your sim works in both with no extra code.
  //
  // Call emit(type, extra) on every pedagogically meaningful interaction. The
  // local wrapper below namespaces the event kind (ARTEFACT_NAME + "." + type).
  // structuredContent carries the payload; the AIPLA frontend reads it and
  // renders a trust card. Conventions:
  //   - extra.label : a curated human string ("Afspillede med v₀=15 m/s"). A
  //                   label marks a DELIBERATE COMMIT → in ChatGPT it fires a
  //                   sendFollowUpMessage turn (so the model reacts now). Omit
  //                   it for passive/continuous events to stay silent.
  //   - marker / param / value / revealed / triggeredBy : typed payload fields
  //     the frontend's useArtefactReportEvent hook understands.
  //
  // To flush debounced changes when the student sends a chat message, register:
  //   AIPLA_BRIDGE.onChatFlush(function () { flushPendingChanges("chat-submit"); });
  const ARTEFACT_NAME = "{{ARTEFACT_NAME}}";
  function emit(type, extra) {
    return AIPLA_BRIDGE.emit(ARTEFACT_NAME + "." + type, extra);
  }

  // ─── State ──────────────────────────────────────────────────────────────
  let p1 = 50;
  let t = 0;
  let playing = false;
  let lastFrameMs = 0;
  const revealed = { example: false };

  // ─── Physics / computation ──────────────────────────────────────────────
  // TODO: replace with the actual physics for the problem.
  function compute(t, params) {
    return { x: t, y: Math.sin(t) * params.p1 };
  }
  function results(params) {
    // TODO: return the answer-markers as a {key: value} dict.
    return { example: params.p1 * 0.42 };
  }

  // ─── DOM ────────────────────────────────────────────────────────────────
  const canvas = document.getElementById("viz");
  const ctx = canvas.getContext("2d");
  const p1Out = document.getElementById("p1-out");

  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.width * 0.55 * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawWorld() {
    // TODO: replace with the actual visualisation.
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#1e40af";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const tt = i / 20;
      const p = compute(tt, { p1 });
      const px = (i / 200) * w;
      const py = h / 2 - p.y;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  function updateMarkers() {
    const r = results({ p1 });
    document.querySelectorAll(".markers [data-value-for]").forEach((el) => {
      const m = el.dataset.valueFor;
      if (!revealed[m]) { el.textContent = "—"; el.classList.remove("revealed"); }
      else { el.textContent = r[m].toFixed(2).replace(".", ","); el.classList.add("revealed"); }
    });
    document.querySelectorAll(".markers button.vis").forEach((b) => {
      const m = b.dataset.marker;
      b.classList.toggle("revealed", !!revealed[m]);
      b.textContent = revealed[m] ? "Skjul" : "Vis";
    });
  }

  function render() {
    fitCanvas();
    drawWorld();
    p1Out.textContent = p1.toString();
  }

  // ─── Animation loop ─────────────────────────────────────────────────────
  function tick(ms) {
    if (!lastFrameMs) lastFrameMs = ms;
    const dt = (ms - lastFrameMs) / 1000;
    lastFrameMs = ms;
    if (playing) {
      t += dt;
      render();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ─── Event wiring ───────────────────────────────────────────────────────
  document.getElementById("p1").addEventListener("input", (e) => {
    p1 = parseFloat(e.target.value);
    // RULE: dragging a slider resets revealed values so the student must
    // recompute per parameter set. Don't remove without explicit consent.
    Object.keys(revealed).forEach((k) => { revealed[k] = false; });
    updateMarkers();
    render();
    emit("param.change", { param: "p1", value: p1 });
  });
  document.getElementById("play").addEventListener("click", () => {
    playing = true; lastFrameMs = 0;
    // COMMIT event — carries a `label`, so it renders the trust card in the
    // AIPLA app AND fires the ChatGPT sendFollowUpMessage turn ("the AI reacts
    // now"). EVERY sim needs at least one labelled commit or it can't broadcast
    // interactions to ChatGPT (checked by scripts/check-artefact-broadcast.mjs).
    // Passive events (param.change on drag, open) stay UNlabelled = silent.
    emit("play", { label: "Ran the simulation (p1=" + p1 + ")" });
  });
  document.getElementById("pause").addEventListener("click", () => {
    playing = false; emit("pause");
  });
  document.getElementById("reset").addEventListener("click", () => {
    t = 0; playing = false; lastFrameMs = 0; render(); emit("reset");
  });
  document.querySelectorAll(".markers button.vis").forEach((b) => {
    b.addEventListener("click", () => {
      const m = b.dataset.marker;
      revealed[m] = !revealed[m];
      updateMarkers(); render();
      emit("show_value", { marker: m, revealed: revealed[m] });
    });
  });
  window.addEventListener("resize", render);
  render();
  updateMarkers();
  emit("open");

  // Run the SEP-1865 lifecycle handshake (bridge-owned). Standalone (no sandbox
  // proxy parent) → the bridge flips to initialized so emits become no-ops.
  AIPLA_BRIDGE.init({ name: ARTEFACT_NAME, version: "1.0.0" });

  // ─── Self-test (URL: ?test=1) ───────────────────────────────────────────
  // The CI smoke (scripts/smoke-artefacts.sh) loads this URL with ?test=1
  // and checks for "TEST PASS" in the title. Implement a single concrete
  // computation check per artefact — e.g. the seeded-problem's known answer.
  if (new URLSearchParams(window.location.search).get("test") === "1") {
    const r = results({ p1: 50 });
    const expected = 21; // TODO: replace with the actual expected value
    const ok = Math.abs(r.example - expected) < 0.01;
    document.title = ok ? "TEST PASS — {{ARTEFACT_TITLE}}" : "TEST FAIL — {{ARTEFACT_TITLE}}";
    if (!ok) console.error("Self-test failed: example=" + r.example + " expected " + expected);
    else console.log("Self-test PASS: example=" + r.example);
  }
</script>
</body>
</html>
