<title>Interferens — to bølger lægges sammen</title>
<!--
  wave-interference v1 — two waves travelling in the SAME medium, added together,
  so the student sees constructive and destructive interference and real beats.

  ⚠️ THE PHYSICS FIX THAT THIS ARTEFACT EXISTS TO CARRY. The mockup it came from
  (docs/design/mockups/wave_simulation.html, interference tab) gave both waves a
  single hardcoded frequency f = 1.2 Hz while letting the student set λ₁ and λ₂
  independently. Since v = f·λ, that makes the two waves travel at DIFFERENT
  SPEEDS — which cannot happen for the same wave type in one medium. The "beats"
  a student saw were a drawing artefact, not physics.

  Here the medium owns the speed. V_MEDIUM is a constant and each wave's
  frequency is DERIVED, f = V/λ. Consequences, all of them wanted:
    λ₁ = λ₂          → f₁ = f₂, and the phase slider alone decides constructive
                        (0°, double amplitude) vs destructive (180°, flat).
    λ₁ ≈ λ₂ slightly → f₁ ≠ f₂ automatically, so the beat envelope the student
                        sees is the real thing, arising from the frequency
                        difference rather than drawn on top.
  It also quietly reinforces v = f·λ: change λ and the displayed f moves with it.

  WHAT IT DELIBERATELY DOES NOT SHOW: V_MEDIUM, and the beat frequency
  |f₁ − f₂|. Both are in the catalogue's tutorBlock, which
  ArtefactMeta.public() strips before anything reaches the browser. The student
  can derive V from any wave's own f and λ — that is the point of the readouts.

  Split from that mockup's two tabs on 2026-09-14; the single-wave tab is the
  separate wave-speed artefact.
-->

  main { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px; }

  .btn.capture { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }

<script>
/* ============================================================================
 * AIPLA MCP App guest bridge — ONE canonical transport for every host.
 *
 * SOURCE OF TRUTH. This file is inlined verbatim into every artefact's
 * index.html between the `@aipla-bridge:start … @aipla-bridge:end` markers by
 * `scripts/build-artefact-bridge.mjs` (run `make sim-build`). NEVER hand-edit
 * the inlined copy — edit THIS file and rebuild. CI (`--check`) fails on drift.
 *
 * It speaks whichever host is present:
 *   - AIPLA app / SEP-1865 hosts  → JSON-RPC `ui/update-model-context` over
 *                                   window.parent.postMessage (the app reads
 *                                   structuredContent + renders the trust card).
 *   - ChatGPT (OpenAI Apps SDK)   → window.openai.setWidgetState (durable state)
 *                                   + window.openai.sendFollowUpMessage (turns a
 *                                   deliberate commit into an immediate turn).
 *   - Claude Desktop / Inspector  → the same SEP-1865 postMessage + `content`.
 *
 * The window.openai block is guarded end-to-end: absent in the AIPLA app and
 * Claude, so it is a pure no-op there and the postMessage path stays
 * authoritative. See docs/design/aipla/v1.1.0-feedback/shared-mcp-app-bridge.md.
 *
 * Public surface (window.AIPLA_BRIDGE):
 *   emit(kind, extra)                 — report a student interaction. `kind` is
 *                                       the FULL event kind (e.g. "boldkast.play").
 *                                       `extra.label` (a curated string) marks a
 *                                       DELIBERATE COMMIT — only labelled emits
 *                                       inject a ChatGPT follow-up turn.
 *   init({ name, version })           — run the ui/initialize handshake. Call once
 *                                       at the bottom of the artefact script.
 *   onChatFlush(cb)                   — cb() runs on ui/notifications/chat-flush.
 *   onHostNotification(method, cb)    — cb(params, msg) runs on any host→iframe
 *                                       JSON-RPC notification with that method.
 *   hostContext()                     — the hostContext returned by ui/initialize.
 *
 * Conservative JS (var/function) so it runs unchanged in any host iframe engine.
 * ========================================================================== */
(function () {
  "use strict";

  var __rpcNextId = 1;
  var __initialized = false;
  var __pendingEmits = [];
  var __hostContext = null;
  var __handlers = {}; // method -> [cb]
  var __lastReportedHeight = 0;
  var __appLinkShown = false;
  var __appLinkOpts = null;
  var __hostIsExternal = false; // a non-AIPLA host (any MCP-Apps host OR ChatGPT)
  var __hostIsAipla = false; // our own app — identified by serverInfo.name below

  // Our app self-identifies in its ui/initialize response so host detection
  // uses the OPEN STANDARD, not the OpenAI-specific window.openai shim. Every
  // other SEP-1865 host (Claude, Inspector, Goose, Copilot) returns a different
  // serverInfo; ChatGPT never answers the handshake (caught by window.openai).
  var AIPLA_HOST_NAME = "aipla-host";

  // Deployed AIPLA app — the deep-link target for the external-host "advertising
  // → app" CTA (design 1.1.55 §0). Public URL; update per env / when a custom
  // domain lands. Overridable per-sim via init({ appUrl: "…" }).
  var APP_URL = "https://aipla-v01-frontend-wgwhd7mspa-lz.a.run.app";

  function __post(msg) {
    try {
      // targetOrigin "*" is safe: the outer sandbox proxy validates origin on
      // its side per ADR-013, then re-postMessages to the host with the host's
      // specific origin. In standalone (artefact opened directly) parent may not
      // exist — swallow.
      window.parent.postMessage(msg, "*");
    } catch (e) {
      /* no host */
    }
  }

  function rpcNotify(method, params) {
    __post({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function rpcRequest(method, params) {
    return new Promise(function (resolve, reject) {
      var id = __rpcNextId++;
      var listener = function (e) {
        var d = e.data;
        if (!d || d.id !== id) return;
        window.removeEventListener("message", listener);
        if (d.result !== undefined) resolve(d.result);
        else reject(new Error((d.error && d.error.message) || "rpc error"));
      };
      window.addEventListener("message", listener);
      __post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  // Single host→iframe listener: respond to ping (spec), dispatch registered
  // notification handlers. rpcRequest installs its own short-lived id-matched
  // listener separately for responses.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.jsonrpc !== "2.0") return;
    if (d.method === "ping" && d.id !== undefined && d.id !== null) {
      __post({ jsonrpc: "2.0", id: d.id, result: {} });
      return;
    }
    if (d.method && __handlers[d.method]) {
      var cbs = __handlers[d.method];
      for (var i = 0; i < cbs.length; i++) {
        try {
          cbs[i](d.params, d);
        } catch (err) {
          /* a handler throwing must not break the bridge */
        }
      }
    }
  });

  // Derive a human-readable `content` text for generic MCP hosts (ChatGPT /
  // Claude feed `content` to the model and treat `structuredContent` as
  // schema-validated app data — without a text the model never sees the
  // interaction). Prefers the curated `label`; else summarises the payload.
  // The AIPLA frontend reads structuredContent and IGNORES content, so this is
  // purely additive for our own app.
  function __contentText(kind, p) {
    if (p && typeof p.label === "string" && p.label) return p.label;
    if (!p) return kind;
    var parts = [];
    for (var k in p) {
      if (k === "label") continue;
      var v = p[k];
      if (Array.isArray(v)) {
        parts.push(k + "=[" + v.length + "]");
      } else if (v && typeof v === "object") {
        for (var k2 in v) {
          if (v[k2] == null || typeof v[k2] !== "object") parts.push(k2 + "=" + v[k2]);
        }
      } else {
        parts.push(k + "=" + v);
      }
    }
    return kind + (parts.length ? " (" + parts.join(", ") + ")" : "");
  }

  function emit(kind, extra) {
    extra = extra || {};
    var sc = Object.assign({}, extra, { kind: kind });
    var params = { structuredContent: sc };
    var label = typeof extra.label === "string" && extra.label ? extra.label : "";
    var text = label || __contentText(kind, extra);
    if (text) params.content = [{ type: "text", text: text }];

    // ── ChatGPT (OpenAI Apps SDK) ──────────────────────────────────────────
    // Absent in the AIPLA app / Claude → whole block no-ops. Guard every call.
    var oa = typeof window !== "undefined" ? window.openai : undefined;
    if (oa) {
      try {
        if (oa.setWidgetState) oa.setWidgetState(sc);
      } catch (e) {
        /* best effort */
      }
      // Inject a turn ONLY on a deliberate commit (has a curated label) — never
      // on a passive settle or a derived-text event. Gated on `label`, NOT on
      // `content` (content is near-always present via __contentText).
      if (label && oa.sendFollowUpMessage) {
        try {
          oa.sendFollowUpMessage({ prompt: label });
        } catch (e) {
          /* best effort */
        }
      }
    }

    // ── SEP-1865 postMessage (AIPLA app + native hosts) — authoritative ─────
    var msg = { jsonrpc: "2.0", method: "ui/update-model-context", params: params };
    if (!__initialized) {
      __pendingEmits.push(msg);
      return;
    }
    __post(msg);
  }

  function onHostNotification(method, cb) {
    if (!__handlers[method]) __handlers[method] = [];
    __handlers[method].push(cb);
  }

  function onChatFlush(cb) {
    onHostNotification("ui/notifications/chat-flush", function () {
      cb();
    });
  }

  // The initial widget state a host restored for this render (ChatGPT/Copilot
  // persist setWidgetState across navigate-away-and-back). A sim that wants to
  // restore its UI reads this in its own init: e.g. AIPLA_BRIDGE.initialState().
  // Returns null in the AIPLA app / Claude (no window.openai). Opt-in per sim.
  function initialState() {
    var oa = typeof window !== "undefined" ? window.openai : undefined;
    return oa && oa.widgetState ? oa.widgetState : null;
  }

  // Report our content height so a host frame fits it. ChatGPT/Copilot default
  // the widget iframe to ~600px and only shrink on this signal; we route it
  // through window.openai only (the AIPLA app owns the workspace-pane height and
  // Claude/Inspector default frames are fine — sending nothing there avoids
  // noise). Guarded + best-effort: no-op where the API/host is absent. For a
  // full-bleed sim (html,body height:100%) body.scrollHeight is the frame
  // height, so this harmlessly reports the current size.
  function reportSize() {
    var oa = typeof window !== "undefined" ? window.openai : undefined;
    if (!oa || typeof oa.notifyIntrinsicHeight !== "function") return;
    var doc = typeof window !== "undefined" ? window.document : undefined;
    if (!doc || !doc.body) return;
    var rect = doc.body.getBoundingClientRect ? doc.body.getBoundingClientRect() : { height: 0 };
    var h = Math.ceil(Math.max(doc.body.scrollHeight || 0, rect.height || 0));
    if (!h || h === __lastReportedHeight) return;
    __lastReportedHeight = h;
    try {
      oa.notifyIntrinsicHeight(h);
    } catch (e) {
      /* best effort */
    }
  }

  // Deep-link CTA — external-host "advertising → app" (design 1.1.55 §0). The
  // low-level injector: drops one unobtrusive floating pill that opens the
  // deployed app for the full tutor (agent + persona + research capture).
  // Idempotent + guarded. The SHOW DECISION (which host) is made by
  // __maybeShowAppLink via the standard handshake — see __hostIsExternal.
  function showAppLink(opts) {
    opts = opts || {};
    if (__appLinkShown || opts.disabled) return;
    var oa = typeof window !== "undefined" ? window.openai : undefined;
    var doc = typeof window !== "undefined" ? window.document : undefined;
    if (!doc || !doc.body || typeof doc.createElement !== "function") return;
    __appLinkShown = true;

    var href = opts.href || APP_URL + (opts.sim ? "?sim=" + encodeURIComponent(opts.sim) : "");
    var a = doc.createElement("a");
    a.textContent = opts.label || "Open the full tutor in AIPLA ↗";
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("role", "button");
    a.style.cssText =
      "position:fixed;right:12px;bottom:12px;z-index:2147483647;" +
      "font:600 12px/1 ui-sans-serif,system-ui,-apple-system,sans-serif;" +
      "padding:8px 12px;border-radius:999px;background:#1e40af;color:#fff;" +
      "text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer";
    a.addEventListener("click", function (e) {
      // Prefer the host's vetted external-open affordance; else the <a> opens natively.
      if (oa && typeof oa.openExternal === "function") {
        try {
          e.preventDefault();
          oa.openExternal({ href: href });
        } catch (err) {
          try {
            window.open(href, "_blank");
          } catch (e2) {
            /* best effort */
          }
        }
      }
    });
    try {
      doc.body.appendChild(a);
    } catch (e) {
      /* best effort */
    }
  }

  // Show the CTA only when we KNOW we're in a host that isn't the AIPLA app.
  // external (ChatGPT via window.openai, or any host whose ui/initialize
  // serverInfo isn't "aipla-host") AND not our app.
  function __maybeShowAppLink() {
    if (__appLinkOpts && __appLinkOpts.disabled) return;
    if (__hostIsAipla || !__hostIsExternal) return;
    showAppLink(__appLinkOpts || {});
  }

  function __setupHostAdaptation() {
    if (typeof window === "undefined") return;
    // ChatGPT never answers the ui/initialize handshake, so it can't be detected
    // via serverInfo — but it injects window.openai, which is a definitive
    // "external, not our app" signal. window.openai may arrive slightly after
    // load → also react to its (re)injection.
    if (window.openai) __hostIsExternal = true;
    try {
      window.addEventListener("openai:set_globals", function () {
        __hostIsExternal = true;
        reportSize();
        __maybeShowAppLink();
      });
    } catch (e) {
      /* older engine */
    }
    var doc = window.document;
    if (typeof ResizeObserver !== "undefined" && doc && doc.body) {
      try {
        new ResizeObserver(reportSize).observe(doc.body);
      } catch (e) {
        /* best effort */
      }
    }
    reportSize();
    __maybeShowAppLink();
  }

  function init(clientInfo) {
    clientInfo = clientInfo || {};
    var ci = {
      name: clientInfo.name || "aipla-sim",
      version: clientInfo.version || "1.0.0",
    };
    // Deep-link CTA options (external-host only). Disable per-sim with
    // init({ appLink: false }); customise with appUrl / appLinkLabel.
    __appLinkOpts = {
      sim: ci.name,
      href: clientInfo.appUrl,
      label: clientInfo.appLinkLabel,
      disabled: clientInfo.appLink === false,
    };
    // If parent isn't a sandbox proxy (standalone testing) this rejects and we
    // flip __initialized so queued emits stop queuing (they become __post
    // no-ops via the try/catch).
    rpcRequest("ui/initialize", {
      protocolVersion: "2026-01-26",
      capabilities: {},
      clientInfo: ci,
    })
      .then(function (result) {
        __hostContext = (result && result.hostContext) || null;
        // Standard host identification: our own app answers with
        // serverInfo.name === "aipla-host"; every other SEP-1865 host (Claude,
        // Inspector, Goose, Copilot) is external → eligible for the app CTA.
        var srvName = result && result.serverInfo && result.serverInfo.name;
        if (srvName === AIPLA_HOST_NAME) {
          __hostIsAipla = true;
        } else {
          __hostIsExternal = true;
        }
        rpcNotify("ui/notifications/initialized", { clientInfo: ci });
        __initialized = true;
        while (__pendingEmits.length) __post(__pendingEmits.shift());
        __maybeShowAppLink();
      })
      .catch(function () {
        __initialized = true;
        __pendingEmits.length = 0;
      });
    // Independent of the postMessage handshake (which never resolves under
    // ChatGPT): adapt to a window.openai host + report our size.
    __setupHostAdaptation();
  }

  window.AIPLA_BRIDGE = {
    emit: emit,
    init: init,
    onChatFlush: onChatFlush,
    onHostNotification: onHostNotification,
    hostContext: function () {
      return __hostContext;
    },
    initialState: initialState,
    reportSize: reportSize,
    showAppLink: showAppLink,
  };
})();
</script>

  const ARTEFACT_NAME = "wave-interference";
  function emit(type, extra) {

  }

  // ─── Language ───────────────────────────────────────────────────────────
  const strings = {

      play: "Afspil", pause: "Pause",
      capture: "Registrér observation", reset: "Nulstil",
      readingsTitle: "Mine observationer",
      readingsEmpty: "Ingen observationer endnu. Prøv først λ₁ = λ₂ med fase 0° og derefter 180°.",
      colN: "#", colPhase: "Fase (°)", colAmp: "Sum-amplitude (m)",
      legW1: "bølge 1", legW2: "bølge 2", legSum: "sum",
      axisM: "m",
      obs: "observation",
    },
    en: {
      title: "Interference — two waves added together",
      labLam1: "Wave 1 — wavelength", labLam2: "Wave 2 — wavelength",
      labPhase: "Phase shift of wave 2", labSum: "Show the sum",
      play: "Play", pause: "Pause",
      capture: "Record observation", reset: "Reset",
      readingsTitle: "My observations",
      readingsEmpty: "No observations yet. Try λ₁ = λ₂ with phase 0° first, then 180°.",
      colN: "#", colPhase: "Phase (°)", colAmp: "Sum amplitude (m)",
      legW1: "wave 1", legW2: "wave 2", legSum: "sum",
      axisM: "m",
      obs: "observation",
    },
  };
  let lang = "da";
  let langLockedByStudent = false;
  const t = (key) => (strings[lang] || strings.da)[key];
  function num(v, dp) {
    const s = Number(v).toFixed(dp);
    return lang === "da" ? s.replace(".", ",") : s;
  }

  // ─── The medium ─────────────────────────────────────────────────────────
  // ⚠️ NEVER RENDERED, NEVER EMITTED. One medium means one speed; each wave's
  // frequency is derived from it. This is the whole physics correction the
  // header comment describes — do not reintroduce an independent f.
  const V_MEDIUM = 4.0;          // m/s
  const AMP = 1.0;               // m, both waves — amplitude is not the variable here

  // ─── State ──────────────────────────────────────────────────────────────
  const st = { lam1: 2.0, lam2: 2.0, phase: 0, tSec: 0, playing: false, raf: null, lastMs: null, showSum: true };
  const readings = [];
  const pendingChanges = {};
  const SPAN_M = 10;

  // ─── Physics (pure — the self-test reaches these) ───────────────────────
  function freqOf(lamM) { return V_MEDIUM / lamM; }

  function waveY(xM, lamM, phaseDeg, tSec) {
    const k = (2 * Math.PI) / lamM;
    const omega = 2 * Math.PI * freqOf(lamM);
    const ph = (phaseDeg * Math.PI) / 180;
    return AMP * Math.sin(k * xM - omega * tSec + ph);
  }
  function sumY(xM, lam1, lam2, phaseDeg, tSec) {
    return waveY(xM, lam1, 0, tSec) + waveY(xM, lam2, phaseDeg, tSec);
  }
  // The observable the student records: how big the sum actually gets across the
  // visible span at this instant. 2.0 for constructive, ~0 for destructive.
  function peakSumAmplitude(lam1, lam2, phaseDeg, tSec) {
    let peak = 0;
    for (let x = 0; x <= SPAN_M; x += 0.01) {
      const v = Math.abs(sumY(x, lam1, lam2, phaseDeg, tSec));
      if (v > peak) peak = v;
    }
    return peak;
  }

  // ─── DOM ────────────────────────────────────────────────────────────────
  const canvas = document.getElementById("viz");
  const cx = canvas.getContext("2d");
  const el = (id) => document.getElementById(id);
  const lam1S = el("lam1"), lam2S = el("lam2"), phaseS = el("phase"), showSumC = el("showSum");
  const playBtn = el("playBtn"), captureBtn = el("captureBtn"), resetBtn = el("resetBtn");

  let cssW = 600, cssH = 280;
  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    cssW = Math.max(240, rect.width || 600);
    cssH = cssW < 420 ? 210 : 280;
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  const PAD_L = 34, PAD_R = 24, PAD_T = 16, PAD_B = 22;
  const plotW = () => cssW - PAD_L - PAD_R;
  const pxPerM = () => plotW() / SPAN_M;
  const midY = () => PAD_T + (cssH - PAD_T - PAD_B) / 2;
  // Headroom for a sum of 2.0 plus a little air.
  const yScale = () => (cssH - PAD_T - PAD_B) / 2 / 2.3;

  function drawGrid() {
    cx.clearRect(0, 0, cssW, cssH);
    const ppm = pxPerM(), mid = midY();
    cx.font = "11px system-ui, sans-serif";
    cx.textAlign = "center"; cx.textBaseline = "top";
    const step = cssW < 420 ? 4 : 2;
    for (let m = 0; m <= SPAN_M; m++) {
      const x = PAD_L + m * ppm;
      cx.strokeStyle = m % 2 === 0 ? "#e2e8f0" : "#f1f5f9";
      cx.beginPath(); cx.moveTo(x, PAD_T); cx.lineTo(x, cssH - PAD_B); cx.stroke();
      if (m % step === 0) { cx.fillStyle = "#94a3b8"; cx.fillText(m + " " + t("axisM"), x, cssH - PAD_B + 4); }
    }
    cx.strokeStyle = "#cbd5e1"; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(PAD_L, mid); cx.lineTo(PAD_L + SPAN_M * ppm, mid); cx.stroke();
  }

  function plot(fn, color, lw, dash) {
    const ppm = pxPerM(), mid = midY(), ys = yScale();
    cx.setLineDash(dash || []);
    cx.strokeStyle = color; cx.lineWidth = lw; cx.beginPath();
    for (let px = 0; px <= plotW(); px += 2) {
      const xM = px / ppm;
      const sy = mid - fn(xM) * ys;
      px ? cx.lineTo(PAD_L + px, sy) : cx.moveTo(PAD_L + px, sy);
    }
    cx.stroke();
    cx.setLineDash([]);
  }

  function draw() {
    drawGrid();
    // The components sit behind the sum, thinner, so the sum reads as the result.
    plot((x) => waveY(x, st.lam1, 0, st.tSec), "#c2410c", 1.6);
    // Dashed: with lam1 == lam2 and phase 0 the two waves are IDENTICAL, and a
    // solid wave 2 paints wave 1 out entirely. That is the first configuration
    // the student is asked to try, so it would read as "wave 1 disappeared".
    plot((x) => waveY(x, st.lam2, st.phase, st.tSec), "#1d4ed8", 1.6, [6, 4]);
    if (st.showSum) plot((x) => sumY(x, st.lam1, st.lam2, st.phase, st.tSec), "#15803d", 2.8);
  }

  function renderLegend() {
    const parts = [
      '<span><i style="background:#c2410c"></i>' + t("legW1") + "</span>",
      '<span><i style="background:repeating-linear-gradient(90deg,#1d4ed8 0 5px,transparent 5px 8px)"></i>' + t("legW2") + "</span>",
    ];
    if (st.showSum) parts.push('<span><i style="background:#15803d;height:4px"></i>' + t("legSum") + "</span>");
    el("legend").innerHTML = parts.join("");
  }

  function renderReadouts() {
    el("outLam1").textContent = num(st.lam1, 2);
    el("outLam2").textContent = num(st.lam2, 2);
    el("outF1").textContent = num(freqOf(st.lam1), 2);
    el("outF2").textContent = num(freqOf(st.lam2), 2);
    el("lam1Label").textContent = num(st.lam1, 2);
    el("lam2Label").textContent = num(st.lam2, 2);
    el("phaseLabel").textContent = String(st.phase);
  }

  function renderReadings() {
    const body = el("readingsBody");
    body.innerHTML = "";
    readings.forEach((r, i) => {
      const tr = document.createElement("tr");
      [String(i + 1), num(r.wavelength1_m, 2), num(r.wavelength2_m, 2),
       String(r.phase_deg), num(r.peak_sum_amplitude_m, 2)]
        .forEach((v) => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
      body.appendChild(tr);
    });
    const has = readings.length > 0;
    el("readingsTable").hidden = !has;
    el("readingsEmpty").hidden = has;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t(n.dataset.t); });
    playBtn.textContent = st.playing ? t("pause") : t("play");
    renderLegend(); renderReadouts(); renderReadings();
    draw();
  }

  // ─── Telemetry ──────────────────────────────────────────────────────────
  function simState() {
    return {
      wavelength1_m: Number(st.lam1.toFixed(2)),
      wavelength2_m: Number(st.lam2.toFixed(2)),
      // f1 and f2 are DERIVED and shown on screen, so the tutor may discuss
      // them. V_MEDIUM itself is not here — it is the thing to be worked out.
      frequency1_Hz: Number(freqOf(st.lam1).toFixed(2)),
      frequency2_Hz: Number(freqOf(st.lam2).toFixed(2)),
      phase_deg: st.phase,
      same_wavelength: Math.abs(st.lam1 - st.lam2) < 1e-9,
      playing: st.playing,
      observations_count: readings.length,
    };
  }
  function flushPendingChanges(triggeredBy) {
    const changed = Object.keys(pendingChanges);
    if (!changed.length) return;
    emit("state-change", { changed, state: simState(), triggeredBy });
    changed.forEach((k) => delete pendingChanges[k]);
  }

  // ─── Interaction ────────────────────────────────────────────────────────
  function onParam() {
    st.lam1 = Number(lam1S.value);
    st.lam2 = Number(lam2S.value);
    st.phase = Number(phaseS.value);
    pendingChanges.wavelength1_m = st.lam1;
    pendingChanges.wavelength2_m = st.lam2;
    pendingChanges.phase_deg = st.phase;
    renderReadouts();
    if (!st.playing) draw();
  }
  [lam1S, lam2S, phaseS].forEach((s) => s.addEventListener("input", onParam));
  showSumC.addEventListener("change", () => {
    st.showSum = showSumC.checked;
    renderLegend(); draw();
  });

  function frame(ms) {
    if (!st.playing) return;
    if (st.lastMs == null) st.lastMs = ms;
    st.tSec += (ms - st.lastMs) / 1000;
    st.lastMs = ms;
    draw();
    st.raf = requestAnimationFrame(frame);
  }
  function setPlaying(next) {
    st.playing = next;
    playBtn.textContent = next ? t("pause") : t("play");
    if (next) { st.lastMs = null; st.raf = requestAnimationFrame(frame); }
    else if (st.raf) cancelAnimationFrame(st.raf);
  }

  playBtn.addEventListener("click", () => {
    if (!st.playing) {
      flushPendingChanges("play");
      setPlaying(true);
      emit("play", {
        state: simState(),
        label: "Afspillede: λ₁ = " + num(st.lam1, 2) + " m, λ₂ = " +
               num(st.lam2, 2) + " m, fase " + st.phase + "°",
      });
    } else {
      setPlaying(false);
      emit("pause", { state: simState() });
    }
  });

  captureBtn.addEventListener("click", () => {
    flushPendingChanges("reading");
    const peak = peakSumAmplitude(st.lam1, st.lam2, st.phase, st.tSec);
    const r = {
      wavelength1_m: st.lam1,
      wavelength2_m: st.lam2,
      phase_deg: st.phase,
      peak_sum_amplitude_m: peak,
    };
    readings.push(r);
    renderReadings();
    // Verb is `reading` and not `observation` on purpose: the proactive gate
    // matches the kind's last dot-segment against a fixed token list, and
    // `observation` is not in it — it would silently never fire a turn.
    emit("reading", {
      state: simState(),
      label: "Registrerede " + t("obs") + " " + readings.length + ": λ₁ = " +
             num(r.wavelength1_m, 2) + " m, λ₂ = " + num(r.wavelength2_m, 2) +
             " m, fase " + r.phase_deg + "°, sum-amplitude " + num(peak, 2) + " m",
    });
  });

  resetBtn.addEventListener("click", () => {
    setPlaying(false);
    st.tSec = 0;
    lam1S.value = "2"; lam2S.value = "2"; phaseS.value = "0";
    showSumC.checked = true; st.showSum = true;
    readings.length = 0;
    Object.keys(pendingChanges).forEach((k) => delete pendingChanges[k]);
    onParam(); renderLegend(); renderReadings(); draw();
    emit("reset", { state: simState() });
  });

  window.addEventListener("resize", fitCanvas);

  // ─── Boot ───────────────────────────────────────────────────────────────
  onParam();
  Object.keys(pendingChanges).forEach((k) => delete pendingChanges[k]);
  applyLang();
  fitCanvas();

  AIPLA_BRIDGE.init({ name: ARTEFACT_NAME, version: "1.0.0" });
  AIPLA_BRIDGE.onChatFlush(function () { flushPendingChanges("chat-submit"); });
  emit("open", { state: simState() });

  (function adoptHostLocale() {
    let tries = 0;
    const timer = setInterval(() => {
      const ctx = AIPLA_BRIDGE.hostContext();
      if (ctx && typeof ctx.locale === "string") {
        clearInterval(timer);
        const hostLang = ctx.locale.slice(0, 2).toLowerCase();
        if (!langLockedByStudent && strings[hostLang] && hostLang !== lang) { lang = hostLang; applyLang(); }
      } else if (++tries > 40) clearInterval(timer);
    }, 50);
  })();

  // ─── Self-test ──────────────────────────────────────────────────────────
  if (new URLSearchParams(location.search).get("test") === "1") {
    // All three are hand-computable with V_MEDIUM = 4 m/s, AMP = 1 m.
    //   f = V/lam:  4 / 2 = 2.00 Hz
    const fOk = Math.abs(freqOf(2) - 2) < 1e-12;
    //   lam1 = lam2 = 2, phase 0, t = 0, x = 0.5:
    //   k = pi, kx = pi/2 -> sin = 1 for both -> sum = 2
    const constructive = sumY(0.5, 2, 2, 0, 0);
    //   same but phase 180: second term sin(pi/2 + pi) = -1 -> sum = 0,
    //   and destructive must hold EVERYWHERE, which is what peak checks.
    const destructivePeak = peakSumAmplitude(2, 2, 180, 0);
    const ok = fOk &&
      Math.abs(constructive - 2) < 1e-9 &&
      destructivePeak < 1e-9;
    document.title = (ok ? "TEST PASS" : "TEST FAIL") + " — " + strings.da.title;
    if (!ok) console.error("Self-test failed", { fOk, constructive, destructivePeak });
  }
</script>
</body>
</html>
