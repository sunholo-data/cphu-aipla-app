<title>Firetaktsmotoren</title>
<!--
  otto-engine — a four-stroke petrol engine and its ideal Otto cycle.
  GENERATED by infrastructure/mcp-sandbox/figures/otto-engine/build.mjs with the
  vendored anatomy kit; edit the sources there, not this file (the bridge block
  is the one part stamped separately, by make sim-build).

  What it deliberately does NOT show: the efficiency. The student reads Q_in and
  W for one cycle, computes eta = W / Q_in themselves, and finds how it depends on
  the compression ratio. The reference values live in the catalogue tutorBlock.
  The cycle is the IDEAL air-standard Otto cycle (instant combustion at TDC,
  instant blow-down at BDC); a real engine reaches roughly half of it, and that
  gap is a discussion the tutor leads, not something the sim models.
-->
<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:11px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

/* AIPLA visual standard tokens (mcp-app-artefact resources/visual-standard.md),
   laid over the anatomy kit's light theme. */
:root {
  --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --border: #e2e8f0;
  --accent: #2563eb; --accent-soft: #eff6ff; --ok: #16a34a; --surface: #f8fafc;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* The gas IS the subject, so it carries colour: fresh charge, burning, exhaust. */
  --gas-fresh: #bfdbfe; --gas-fresh-d: #93c5fd;
  --gas-burning: #fdba74; --gas-burning-d: #fb923c;
  --gas-burnt: #fed7aa; --gas-burnt-d: #fdba74;
  --gas-exhaust: #d6d3d1; --gas-exhaust-d: #a8a29e;
}
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body.iso { --anatomy-page: var(--bg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.eng { max-width: 760px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
.iso-figure { margin: 0; }
.iso-plate { position: relative; }
.iso-stage svg { width: 100%; height: auto; display: block; }
.iso-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 12px; }
.iso-keys { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.iso-key { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0000001f; }
.sw-fresh { background: var(--gas-fresh-d); }
.sw-burning { background: var(--gas-burning-d); }
.sw-exhaust { background: var(--gas-exhaust-d); }

/* The gas column: the cavity token trick from anatomy craft.md §7 — the kit's
   tone tokens are redefined inside the group, so it keeps its form. */
[data-part="gas"] .iso-solid { --anatomy-paper: var(--g); --anatomy-top: var(--g); --anatomy-face: var(--g);
  --anatomy-shade-0: var(--gd); --anatomy-shade-1: var(--gd); --anatomy-shade-2: var(--g); --anatomy-shade-3: var(--g); }
[data-part="gas"][data-phase="fresh"] { --g: var(--gas-fresh); --gd: var(--gas-fresh-d); }
[data-part="gas"][data-phase="burning"] { --g: var(--gas-burning); --gd: var(--gas-burning-d); }
[data-part="gas"][data-phase="burnt"] { --g: var(--gas-burnt); --gd: var(--gas-burnt-d); }
[data-part="gas"][data-phase="exhaust"] { --g: var(--gas-exhaust); --gd: var(--gas-exhaust-d); }
.spark { fill: #f59e0b; stroke: #b45309; stroke-width: .5; }
.flow { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 2 4; transition: opacity .25s; }
.flow-in { stroke: var(--gas-fresh-d); }
.flow-out { stroke: var(--gas-exhaust-d); }

.lower { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
@media (min-width: 600px) { .lower { grid-template-columns: 1.1fr 1fr; } }
.pv-box, .panel { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
#pv { width: 100%; height: auto; display: block; }
#pv .axis { stroke: var(--muted); stroke-width: 1; fill: none; }
#pv .grid { stroke: var(--border); stroke-width: .6; }
#pv .tick { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
#pv .loop { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
#pv .loop.measured { fill: #dbeafe; fill-opacity: .7; stroke: var(--accent); }
#pv .trail { fill: none; stroke: var(--accent); stroke-width: 1.8; }
#pv .dot { fill: #ea580c; stroke: #fff; stroke-width: 1.2; }

.buttons { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 32px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.commit { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button.quiet { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 6px; min-height: 0; }
button.quiet[aria-pressed="true"] { color: var(--fg); font-weight: 600; }
.ratio { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 10px 0 6px; font-size: 13px; }
.ratio input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.ratio output { font-family: var(--mono); }
.readings { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 6px 0; }
.readings div { background: var(--surface); border-radius: 6px; padding: 4px 6px; }
.readings dt { font-size: 11px; color: var(--muted); }
.readings dd { margin: 0; font-family: var(--mono); font-size: 13px; }
.record { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.record caption { text-align: left; font-weight: 600; font-size: 12px; padding-bottom: 2px; }
.record th, .record td { border-bottom: 1px solid var(--border); padding: 3px 4px; text-align: right; }
.record th:first-child, .record td:first-child { text-align: left; }
.record td { font-family: var(--mono); }
.record .empty td { color: var(--muted); font-family: inherit; text-align: left; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
</style>
</head>

<script>
/* ============================================================================
 * AIPLA MCP App guest bridge — ONE canonical transport for every host.
 *
 * SOURCE OF TRUTH. This file is inlined verbatim into every artefact's
 * index.html between the `@aipla-bridge:start … @aipla-bridge:end` markers by
 * `scripts/build-artefact-bridge.mjs` (run `make sim-build`). NEVER hand-edit
 * the inlined copy — edit THIS file and rebuild. CI (`--check`) fails on drift.
 *
 * It speaks whichever host is present:
 *   - AIPLA app / SEP-1865 hosts  → JSON-RPC `ui/update-model-context` over
 *                                   window.parent.postMessage (the app reads
 *                                   structuredContent + renders the trust card).
 *   - ChatGPT (OpenAI Apps SDK)   → window.openai.setWidgetState (durable state)
 *                                   + window.openai.sendFollowUpMessage (turns a
 *                                   deliberate commit into an immediate turn).
 *   - Claude Desktop / Inspector  → the same SEP-1865 postMessage + `content`.
 *
 * The window.openai block is guarded end-to-end: absent in the AIPLA app and
 * Claude, so it is a pure no-op there and the postMessage path stays
 * authoritative. See docs/design/aipla/v1.1.0-feedback/shared-mcp-app-bridge.md.
 *
 * Public surface (window.AIPLA_BRIDGE):
 *   emit(kind, extra)                 — report a student interaction. `kind` is
 *                                       the FULL event kind (e.g. "boldkast.play").
 *                                       `extra.label` (a curated string) marks a
 *                                       DELIBERATE COMMIT — only labelled emits
 *                                       inject a ChatGPT follow-up turn.
 *   init({ name, version })           — run the ui/initialize handshake. Call once
 *                                       at the bottom of the artefact script.
 *   onChatFlush(cb)                   — cb() runs on ui/notifications/chat-flush.
 *   onHostNotification(method, cb)    — cb(params, msg) runs on any host→iframe
 *                                       JSON-RPC notification with that method.
 *   hostContext()                     — the hostContext returned by ui/initialize.
 *
 * Conservative JS (var/function) so it runs unchanged in any host iframe engine.
 * ========================================================================== */
(function () {
  "use strict";

  var __rpcNextId = 1;
  var __initialized = false;
  var __pendingEmits = [];
  var __hostContext = null;
  var __handlers = {}; // method -> [cb]
  var __lastReportedHeight = 0;
  var __appLinkShown = false;
  var __appLinkOpts = null;
  var __hostIsExternal = false; // a non-AIPLA host (any MCP-Apps host OR ChatGPT)
  var __hostIsAipla = false; // our own app — identified by serverInfo.name below

  // Our app self-identifies in its ui/initialize response so host detection
  // uses the OPEN STANDARD, not the OpenAI-specific window.openai shim. Every
  // other SEP-1865 host (Claude, Inspector, Goose, Copilot) returns a different
  // serverInfo; ChatGPT never answers the handshake (caught by window.openai).
  var AIPLA_HOST_NAME = "aipla-host";

  // Deployed AIPLA app — the deep-link target for the external-host "advertising
  // → app" CTA (design 1.1.55 §0). Public URL; update per env / when a custom
  // domain lands. Overridable per-sim via init({ appUrl: "…" }).
  var APP_URL = "https://aipla-v01-frontend-wgwhd7mspa-lz.a.run.app";

  function __post(msg) {
    try {
      // targetOrigin "*" is safe: the outer sandbox proxy validates origin on
      // its side per ADR-013, then re-postMessages to the host with the host's
      // specific origin. In standalone (artefact opened directly) parent may not
      // exist — swallow.
      window.parent.postMessage(msg, "*");
    } catch (e) {
      /* no host */
    }
  }

  function rpcNotify(method, params) {
    __post({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function rpcRequest(method, params) {
    return new Promise(function (resolve, reject) {
      var id = __rpcNextId++;
      var listener = function (e) {
        var d = e.data;
        if (!d || d.id !== id) return;
        window.removeEventListener("message", listener);
        if (d.result !== undefined) resolve(d.result);
        else reject(new Error((d.error && d.error.message) || "rpc error"));
      };
      window.addEventListener("message", listener);
      __post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  // Single host→iframe listener: respond to ping (spec), dispatch registered
  // notification handlers. rpcRequest installs its own short-lived id-matched
  // listener separately for responses.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.jsonrpc !== "2.0") return;
    if (d.method === "ping" && d.id !== undefined && d.id !== null) {
      __post({ jsonrpc: "2.0", id: d.id, result: {} });
      return;
    }
    if (d.method && __handlers[d.method]) {
      var cbs = __handlers[d.method];
      for (var i = 0; i < cbs.length; i++) {
        try {
          cbs[i](d.params, d);
        } catch (err) {

/** 45° hatch lines on a rectangle of the section plane y = 0 (x0..x1, z0..z1). */
function hatch(x0, x1, z0, z1, gap, P) {
  const out = [];
  for (let c = x0 - (z1 - z0); c < x1; c += gap) {
    // line x - z' = c, with z' = z - z0
    let a = [c, 0];
    let b = [c + (z1 - z0), z1 - z0];
    if (a[0] < x0) a = [x0, x0 - c];
    if (b[0] > x1) b = [x1, x1 - c];
    if (b[0] - a[0] < 0.6) continue;
    out.push(pathOf([iso([a[0], 0, z0 + a[1]], P), iso([b[0], 0, z0 + b[1]], P)]));
  }
  return out.join("");
}


const P = {"origin":[260,320.7742206645249],"scale":1.3347893786247222,"azimuth":40,"elevation":30};
const SIDE = 1;
const BORE_R = 24;
const HEAD_Z = 141.2;
const COVER_Z = 163.2;
const COVER_H = 20;
const CROWN_ABOVE_PIN = 14;
const STROKE = 36;
const EXH_X = 62;

// otto-engine — live code. Runs in the page after the inlined anatomy kit,
// model.mjs and geom.mjs (all as plain functions) and the build's constants.

const ARTEFACT_NAME = "otto-engine";
function emit(type, extra) {
  return AIPLA_BRIDGE.emit(ARTEFACT_NAME + "." + type, extra);
}

const strings = {

    areaHint: "The dot follows the gas. Once you have measured a cycle, the shaded area inside the loop is the work W.",
    reset: "Reset",
    labelRun: "Started the engine at r = {r}",
    labelStep: "Moved on to {stroke} (r = {r})",
    labelReading: "Measured one cycle at r = {r}: Q = {q} J, W = {w} J",
  },
};
let lang = "da";
let langLockedByStudent = false;
const t = (key) => (strings[lang] || strings.da)[key];
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
function num(v, dp) {
  const s = v.toFixed(dp);
  return lang === "da" ? s.replace(".", ",") : s;
}

// ---- state ----
const SPEED = 90; // crank degrees per second: one full cycle in 8 s, slow enough to follow
const LIFT = 5; // valve lift in world units
let theta = 20;
let ratio = 8;
let running = false;
let stepTarget = null;
let measureFrom = null;
let measuredRatio = null;
let records = [];
let trail = [];
const pending = {};

const still = matchMedia("(prefers-reduced-motion: reduce)");
const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector(`[data-part="${name}"]`);
const $ = (id) => document.getElementById(id);

const crownExtra = (r) => STROKE / (R_RANGE[0] - 1) - STROKE / (r - 1);
const crownZ = (th) => pinZ(th) + CROWN_ABOVE_PIN + crownExtra(ratio);
const front = (v) => SIDE * v;
const back = (v) => -SIDE * v;

function simState() {
  const s = state(theta, ratio);
  return {
    crank_deg: Math.round(((theta % 720) + 720) % 720),
    stroke: strokeOf(theta),
    compression_ratio: ratio,
    p_bar: +s.p.toFixed(2),
    V_cm3: +s.v.toFixed(1),
    T_K: Math.round(s.t),
    running,
    measured_cycles: records.map((x) => ({ r: x.r, Q_J: x.q, W_J: x.w })),
  };
}

// ---- drawing: the moving parts ----
function webProfile(th) {
  const [px, pz] = crankPin(th);
  const a = (th * Math.PI) / 180;
  const cw = [-Math.sin(a) * 6, CRANK_Z - Math.cos(a) * 6];
  return hull2([...circle2(px, pz, 8.5, 20), ...circle2(0, CRANK_Z, 10, 20), ...circle2(cw[0], cw[1], 17, 28, a + Math.PI / 2 + Math.PI, a + Math.PI / 2 + 2 * Math.PI)]);
}

function drawCrank(th) {
  const [px, pz] = crankPin(th);
  const web = webProfile(th);
  part("crank-back").innerHTML =
    polySolid(prismY(circle2(0, CRANK_Z, 6, 22), back(16), back(10)), P, { tone: "mid" }) +
    polySolid(prismY(web, back(10), back(4.5)), P, { tone: "mid" }) +
    polySolid(prismY(circle2(px, pz, 5, 20), back(4.5), front(4.5)), P, { tone: "mid" });
  part("crank-front").innerHTML =
    polySolid(prismY(web, front(4.5), front(10)), P, { tone: "mid" }) +
    polySolid(prismY(circle2(0, CRANK_Z, 6, 22), front(10), front(17)), P, { tone: "mid" }) +
    polySolid(prismY(circle2(0, CRANK_Z, 4, 6), front(17), front(20)), P, { tone: "mid" }) +
    dotsSvg([iso([px, front(10), pz], P)], { size: 0.5 });
}

function drawRod(th) {
  const [px, pz] = crankPin(th);
  const pin = pinZ(th);
  const profile = hull2([...circle2(px, pz, 8.5, 24), ...circle2(0, pin, 5.5, 20)]);
  part("rod").innerHTML = polySolid(prismY(profile, -3.2, 3.2), P, { tone: "mid" });
}

function drawGas(th) {
  const top = HEAD_Z;
  const bottom = crownZ(th);
  const g = part("gas");
  const s = state(th, ratio);
  g.setAttribute("data-phase", s.phase);
  if (top - bottom < 0.2) {
    g.innerHTML = "";
    return;
  }
  const ring = halfRing(circleRing(0, 0, BORE_R - 0.3, 48), null, SIDE);
  g.innerHTML = solidSvg(extrude(ring, bottom, top - bottom, P), { tone: "lo", crease: "none" });
}

function drawPiston(th) {
  // Sectioned like the block: a real piston is a crown on a hollow skirt, so the
  // cut face is a U, hatched, and the rod's small end shows inside it.
  const pin = pinZ(th);
  const base = pin + CROWN_ABOVE_PIN;
  const skirt = pin - 16;
  const crownT = 6;
  const wall = 3;
  const extra = crownExtra(ratio);
  const R = BORE_R - 0.6;
  const shell = halfRing(circleRing(0, 0, R, 40), circleRing(0, 0, R - wall, 40), SIDE);
  const disc = halfRing(circleRing(0, 0, R, 40), null, SIDE);
  let out = solidSvg(extrude(shell, skirt, base - crownT - skirt, P, { convex: false }), { tone: "hi", lit: true });
  out += solidSvg(extrude(disc, base - crownT, crownT, P), { tone: "hi", lit: true });
  if (extra > 0.05) out += solidSvg(extrude(halfRing(circleRing(0, 0, R - 5, 36), null, SIDE), base, extra, P), { tone: "hi", lit: true });
  const hatches = hatch(-R, -R + wall, skirt, base - crownT, 2.6, P) + hatch(R - wall, R, skirt, base - crownT, 2.6, P) + hatch(-R, R, base - crownT, base, 2.6, P);
  out += lineSvg(hatches, { tone: "mid" });
  // Ring grooves: three notches in each side of the crown land.
  out += lineSvg([1.6, 3.4].map((dz) => pathOf([iso([-R, 0, base - dz], P), iso([-R + 1.6, 0, base - dz], P)]) + pathOf([iso([R, 0, base - dz], P), iso([R - 1.6, 0, base - dz], P)])).join(""), { tone: "lit", free: "end" });
  part("piston").innerHTML = out;
}

function drawPin(th) {
  const pin = pinZ(th);
  // Only the stretch through the rod's eye shows; the rest is inside the piston.
  part("pin").innerHTML = polySolid(prismY(circle2(0, pin, 3, 16), back(3.6), front(3.6)), P, { tone: "mid" });
}

function drawValves(th) {
  const lift = valveLift(th);
  const valves = [
    { x: -12, l: lift.intake },
    { x: 12, l: lift.exhaust },
  ].sort((a, b) => depthOf([a.x, 0, 0], P) - depthOf([b.x, 0, 0], P));
  let out = "";
  for (const v of valves) {
    const drop = v.l * LIFT;
    const seat = HEAD_Z - drop;
    const top = COVER_Z + 13 - drop;
    const spring = helixZ(v.x, 0, 4.4, COVER_Z, top - 1.4, 5.5, P);
    out += lineSvg(spring.back, { tone: "lo" });
    out += solidSvg(cylinder(v.x, 0, 1.4, seat, top - seat, P, 14), { tone: "mid", crease: "none" });
    out += solidSvg(cylinder(v.x, 0, 7.2, seat - 1.8, 1.8, P, 40, 0.4), { tone: "mid" });
    out += lineSvg(spring.front, { tone: "mid" });
    out += solidSvg(cylinder(v.x, 0, 5.2, top - 1.4, 1.4, P, 28, 0.3), { tone: "mid" });
  }
  part("valves").innerHTML = out;
}

let plugDrawn = false;
function drawPlug(th) {
  const g = part("plug");
  if (!plugDrawn) {
    const z = COVER_Z + COVER_H;
    g.innerHTML =
      solidSvg(cylinder(0, 0, 3, HEAD_Z - 1, z - HEAD_Z + 1, P, 20), { tone: "mid", crease: "none" }) +
      solidSvg(cylinder(0, 0, 4.8, z, 4, P, 6), { tone: "mid" }) +
      solidSvg(cylinder(0, 0, 2.8, z + 4, 12, P, 24), { tone: "hi" }) +
      lineSvg([z + 7, z + 10, z + 13].map((zz) => sideArc(0, 0, 2.8, zz, P, 20)).join(""), { tone: "lo" }) +
      solidSvg(cylinder(0, 0, 1.5, z + 16, 3.5, P, 16), { tone: "mid" }) +
      `<path class="spark" d="${sparkPath()}" opacity="0"/>`;
    plugDrawn = true;
  }
  const d = ((th % 720) + 720) % 720;
  const fire = d >= 352 && d <= 400 ? Math.exp(-(((d - 362) / 10) ** 2)) : 0;
  g.querySelector(".spark").setAttribute("opacity", fire.toFixed(2));
}

function sparkPath() {
  const [cx, cy] = iso([0, 0, HEAD_Z - 2.5], P);
  const pts = [];
  for (let i = 0; i < 16; i++) {
    const r = i % 2 ? 2.2 : 6.5;
    const a = (i * Math.PI) / 8;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pathOf(pts, true);
}

let flowDrawn = false;
function drawFlow(th) {
  const g = part("flow");
  if (!flowDrawn) {
    const zin = HEAD_Z + 10;
    const line = (pts, cls) => `<path class="flow ${cls}" d="${pathOf(pts.map((p) => iso(p, P)))}" opacity="0"/>`;
    g.innerHTML =
      line([[-64, 0, zin], [-30, 0, zin], [-14, 0, HEAD_Z + 3]], "flow-in") + line([[14, 0, HEAD_Z + 3], [30, 0, zin], [44, 0, zin], [44, back(22), zin], [EXH_X, back(22), zin]], "flow-out");
    flowDrawn = true;
  }
  const lift = valveLift(th);
  const [fin, fout] = g.querySelectorAll(".flow");
  fin.setAttribute("opacity", lift.intake.toFixed(2));
  fout.setAttribute("opacity", lift.exhaust.toFixed(2));
  const off = (-(theta * 0.4) % 6).toFixed(1);
  fin.setAttribute("stroke-dashoffset", off);
  fout.setAttribute("stroke-dashoffset", off);
}

// ---- the p-V diagram ----
const PV = { x0: 44, x1: 312, y0: 12, y1: 178, vMax: 620, pMax: 110 };
const px = (v) => PV.x0 + (v / PV.vMax) * (PV.x1 - PV.x0);
const py = (p) => PV.y1 - (p / PV.pMax) * (PV.y1 - PV.y0);
const pvSvg = $("pv");

function drawPvFrame() {
  let s = "";
  for (let v = 0; v <= 600; v += 100) s += `<line class="grid" x1="${px(v)}" y1="${PV.y0}" x2="${px(v)}" y2="${PV.y1}"/><text class="tick" x="${px(v)}" y="${PV.y1 + 13}" text-anchor="middle">${v}</text>`;
  for (let p = 0; p <= 100; p += 20) s += `<line class="grid" x1="${PV.x0}" y1="${py(p)}" x2="${PV.x1}" y2="${py(p)}"/><text class="tick" x="${PV.x0 - 5}" y="${py(p) + 4}" text-anchor="end">${p}</text>`;
  s += `<path class="axis" d="M${PV.x0} ${PV.y0}V${PV.y1}H${PV.x1}"/>`;
  s += `<text class="tick" x="${PV.x1}" y="${PV.y1 + 27}" text-anchor="end">${t("axisV")}</text>`;
  s += `<text class="tick" x="${PV.x0 + 4}" y="${PV.y0 + 8}">${t("axisP")}</text>`;
  s += `<path class="loop" id="pv-loop"/><path class="trail" id="pv-trail"/><circle class="dot" id="pv-dot" r="4"/>`;
  pvSvg.innerHTML = s;
  drawLoop();
}

function drawLoop() {
  const d = loop(ratio).map(([v, p], i) => `${i ? "L" : "M"}${px(v).toFixed(1)} ${py(p).toFixed(1)}`).join("") + "Z";
  const el = $("pv-loop");
  el.setAttribute("d", d);
  el.classList.toggle("measured", measuredRatio === ratio);
}

function drawPvLive() {
  const s = state(theta, ratio);
  $("pv-dot").setAttribute("cx", px(s.v).toFixed(1));
  $("pv-dot").setAttribute("cy", py(s.p).toFixed(1));
  $("pv-trail").setAttribute("d", trail.map(([v, p], i) => `${i ? "L" : "M"}${px(v).toFixed(1)} ${py(p).toFixed(1)}`).join(""));
}

// ---- readouts ----
function drawReadouts() {
  const s = state(theta, ratio);
  const strokeName = t("stroke_" + strokeOf(theta));
  $("r-stroke").textContent = strokeName;
  $("r-p").textContent = num(s.p, 1) + " bar";
  $("r-v").textContent = num(s.v, 0) + " cm³";
  $("r-t").textContent = num(s.t, 0) + " K";
  $("corner-readout").textContent = strokeName + " · " + Math.round(((theta % 720) + 720) % 720) + "°";
}

function drawRecords() {
  const body = $("record-body");
  body.innerHTML = records.length
    ? records.map((x) => `<tr><td>${num(x.r, 1)}</td><td>${num(x.q, 0)}</td><td>${num(x.w, 0)}</td></tr>`).join("")
    : `<tr class="empty"><td colspan="3">${t("empty")}</td></tr>`;
}

function drawButtons() {
  $("btn-run").textContent = running && measureFrom === null ? t("pause") : t("start");
  $("btn-run").disabled = measureFrom !== null;
  $("btn-step").disabled = measureFrom !== null;
  $("btn-measure").textContent = measureFrom === null ? t("measure") : t("measuring");
  $("btn-measure").disabled = measureFrom !== null;
  $("ratio").disabled = measureFrom !== null;
  $("ratio-out").textContent = "r = " + num(ratio, 1);
}

function draw() {
  drawCrank(theta);
  drawRod(theta);
  drawGas(theta);
  drawPiston(theta);
  drawPin(theta);
  drawValves(theta);
  drawPlug(theta);
  drawFlow(theta);
  drawPvLive();
  drawReadouts();
}

// ---- motion ----
let frame = 0;
let last = 0;
let reducedAcc = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  let step = SPEED * dt * (stepTarget !== null ? 2 : 1);
  if (still.matches) {
    // Reduced motion: no smooth animation — the crank jumps 45° twice a second.
    reducedAcc += dt;
    step = reducedAcc >= 0.5 ? 45 : 0;
    if (step) reducedAcc = 0;
  }
  if (stepTarget !== null) step = Math.min(step, stepTarget - theta);
  if (step > 0) {
    theta += step;
    const s = state(theta, ratio);
    trail.push([s.v, s.p]);
    if (trail.length > 400) trail.shift();
  }
  if (stepTarget !== null && theta >= stepTarget - 1e-6) {
    theta = stepTarget;
    stepTarget = null;
    running = false;
  }
  if (measureFrom !== null && theta - measureFrom >= 720) finishMeasurement();
  draw();
  drawButtons();
  frame = running || stepTarget !== null ? requestAnimationFrame(tick) : 0;
  if (!frame) last = 0;
}
function go() {
  if (!frame) frame = requestAnimationFrame(tick);
}

// ---- actions ----
function flushPendingChanges(triggeredBy) {
  const changed = Object.keys(pending);
  if (!changed.length) return;
  emit("state-change", { changed, state: simState(), triggeredBy });
  changed.forEach((key) => delete pending[key]);
}

function finishMeasurement() {
  const c = cycle(ratio);
  const rec = { r: ratio, q: Math.round(c.qIn), w: Math.round(c.work) };
  records = [rec, ...records.filter((x) => x.r !== ratio)].slice(0, 8);
  measureFrom = null;
  measuredRatio = ratio;
  running = false;
  drawLoop();
  drawRecords();
  emit("reading", {
    state: simState(),
    label: fill(t("labelReading"), { r: num(rec.r, 1), q: num(rec.q, 0), w: num(rec.w, 0) }),
  });
}

$("btn-run").addEventListener("click", () => {
  if (running) {
    running = false;
    drawButtons();
    emit("pause", { state: simState() });
    return;
  }
  flushPendingChanges("run");
  running = true;
  stepTarget = null;
  emit("run", { state: simState(), label: fill(t("labelRun"), { r: num(ratio, 1) }) });
  go();
});

$("btn-step").addEventListener("click", () => {
  flushPendingChanges("step");
  running = false;
  stepTarget = (Math.floor(theta / 180 + 1e-6) + 1) * 180;
  const entering = t("stroke_" + strokeOf(stepTarget + 1));
  emit("step", { state: { ...simState(), entering: strokeOf(stepTarget + 1) }, label: fill(t("labelStep"), { stroke: entering.toLowerCase(), r: num(ratio, 1) }) });
  go();
});

$("btn-measure").addEventListener("click", () => {
  flushPendingChanges("measure");
  measureFrom = theta;
  stepTarget = null;
  running = true;
  trail = [];
  drawButtons();
  go();
});

$("ratio").addEventListener("input", (e) => {
  ratio = Number(e.target.value);
  pending.compression_ratio = ratio;
  trail = [];
  drawLoop();
  draw();
  drawButtons();
});

$("btn-reset").addEventListener("click", () => {
  running = false;
  stepTarget = null;
  measureFrom = null;
  measuredRatio = null;
  theta = 20;
  trail = [];
  records = [];
  drawLoop();
  drawRecords();
  draw();
  drawButtons();
  emit("reset", { state: simState() });
});

document.querySelectorAll("[data-lang]").forEach((b) =>
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    langLockedByStudent = true;
    applyLang();
  }),
);

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach((el) => {
    el.textContent = t(el.dataset.t);
  });
  svg.setAttribute("aria-label", t("figLabel"));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  drawPvFrame();
  drawPvLive();
  drawReadouts();
  drawRecords();
  drawButtons();
}

// ---- start ----
applyLang();
draw();
AIPLA_BRIDGE.init({ name: ARTEFACT_NAME, version: "1.0.0" });
AIPLA_BRIDGE.onChatFlush(() => flushPendingChanges("chat-submit"));
(function adoptHostLocale() {
  let tries = 0;
  const timer = setInterval(() => {
    const ctx = AIPLA_BRIDGE.hostContext();
    if (ctx && typeof ctx.locale === "string") {
      clearInterval(timer);
      const hostLang = ctx.locale.slice(0, 2).toLowerCase();
      if (!langLockedByStudent && strings[hostLang] && hostLang !== lang) {
        lang = hostLang;
        applyLang();
      }
    } else if (++tries > 40) clearInterval(timer);
  }, 50);
})();
emit("open", { state: simState() });

// ---- self-test (?test=1): the physics, checked against hand-computed values ----
if (new URLSearchParams(location.search).get("test") === "1") {
  // r = 8: Vc = 500/7 = 71.43 cm³, V1 = 571.43 cm³; ideal eta = 1 - 8^-0.4 = 0.5647,
  // and W/Q from the cycle's own corner states must equal it.
  const c = cycle(8);
  const checks = [
    Math.abs(volume(0, 8) - 71.43) < 0.01,
    Math.abs(volume(180, 8) - 571.43) < 0.01,
    Math.abs(c.work / c.qIn - 0.5647) < 5e-4,
    Math.abs(idealEfficiency(10) - 0.6019) < 5e-4,
    strokeOf(400) === "power",
    valveLift(90).intake > 0.99 && valveLift(450).exhaust === 0,
  ];
  const ok = checks.every(Boolean);
  document.title = (ok ? "TEST PASS" : "TEST FAIL") + " — " + strings.da.title;
  if (!ok) console.error("otto-engine self-test failed", checks);
