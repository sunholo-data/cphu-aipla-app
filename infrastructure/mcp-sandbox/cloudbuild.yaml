# MCP App sandbox proxy — Cloud Build configuration.
#
# Single-container Cloud Run service. Mirrors the shape of
# backend/cloudbuild.yaml (the simpler aitana-v6-backend pattern) without
# secrets, without GCS volume mounts, and with public access — the
# sandbox iframe is loaded by the browser from this URL on a SEPARATE
# origin from the host frontend (per MCP Apps spec, see sprint 1.24).
#
# Branch-based deployment: dev -> ${_PROJECT_ID}. Substitutions are
# overridable per fork — Aitana uses terraform; AIPLA (and other forks)
# set explicit values via the Cloud Build trigger config or `gcloud
# builds submit --substitutions`. Hosts every MCP App artefact under
# /artefacts/<name>/v1/ — see [.claude/skills/mcp-app-artefact](.claude/skills/mcp-app-artefact/SKILL.md).

substitutions:
  _SERVICE_NAME: mcp-sandbox
  # Immutable image tag. Defaults to ${BRANCH_NAME} (dev branch trigger); the
  # tag-based sandbox release trigger overrides with ${TAG_NAME}. Mirrors the
  # root cloudbuild.yaml so tag builds tag images by version, not empty branch.
  _IMAGE_TAG: '${BRANCH_NAME}'
  # _PROJECT_ID, _REGION, _ARTIFACT_REGISTRY_REPO_URL_CLIENT, _LOGS_BUCKET
  # are mandatory overrides supplied by the trigger config (gcloud builds
  # triggers create --substitutions). Defaults below are sentinel values
  # that fail loudly if the trigger forgot to set them.
  _REGION: trigger_must_set
  _ARTIFACT_REGISTRY_REPO_URL_CLIENT: trigger_must_set
  _PROJECT_ID: trigger_must_set
  _LOGS_BUCKET: gs://trigger_must_set
  # Comma-separated origins permitted to embed this sandbox as an iframe.
  # Validated against document.referrer in sandbox.ts on every load.
  # Trigger config sets per-env (dev/test/prod).
  _ALLOWED_HOST_ORIGINS: 'trigger_must_set'

tags: ['${_PROJECT_ID}', '${_SERVICE_NAME}']

options:
  logging: GCS_ONLY
logsBucket: ${_LOGS_BUCKET}

steps:
  # --- Build the sandbox image ---
  - name: 'gcr.io/cloud-builders/docker'
    id: build-mcp-sandbox
    dir: infrastructure/mcp-sandbox
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/sandbox:${_IMAGE_TAG}'
      - '.'

  # --- Push image ---
  - name: 'gcr.io/cloud-builders/docker'
    id: push-mcp-sandbox
    waitFor: ['build-mcp-sandbox']
    args:
      - 'push'
      - '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/sandbox:${_IMAGE_TAG}'

  # --- Deploy to Cloud Run (single container, public) ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['push-mcp-sandbox']
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--region=${_REGION}'
      - '--project=${_PROJECT_ID}'
      - '--platform=managed'
      - '--allow-unauthenticated'           # browser-loaded iframe; allUsers
      - '--max-instances=3'
      - '--image=${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/sandbox:${_IMAGE_TAG}'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      # ^@^ CHANGES THE DELIMITER, and it is required here. By default gcloud
      # splits --set-env-vars on COMMAS, and ALLOWED_HOST_ORIGINS is itself a
      # comma-separated list (the run.app origin AND the ku.dk one, so both work
      # during the domain cutover). Without this, gcloud read the second origin
      # as a second variable with no '=' and failed the whole deploy with
      # "Bad syntax for dict arg" — build b61db9d2, 2026-08-04.
      #
      # The value was single-valued when this line was written, so the bug was
      # latent until the day a second origin was added.
      - '--set-env-vars=^@^ALLOWED_HOST_ORIGINS=${_ALLOWED_HOST_ORIGINS}'

  # --- Smoke probe ---
  # cloud-sdk image has both gcloud + curl. Resolve the service URL after
  # deploy (Cloud Run assigns a deterministic *.run.app URL but we can't
  # hardcode it — the project/region prefix is terraform-managed). Fail
  # the build if /healthz is anything other than 200.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: smoke
    entrypoint: bash
    args:
      - '-c'
      - |
        sleep 10
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} --project=${_PROJECT_ID} \
          --format='value(status.url)')
        if [ -z "$$URL" ]; then
          echo "ERROR: Could not resolve service URL" >&2
          exit 1
        fi
        # Probe /sandbox.html, NOT /healthz — Cloud Run's GFE intercepts
        # /healthz for its own internal liveness probes; user containers
        # never see those requests. /sandbox.html is the actual path the
        # iframe loads in production, so this is also a more meaningful
        # smoke than a synthetic health endpoint.
        echo "Probing $${URL}/sandbox.html ..."
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$${URL}/sandbox.html")
        echo "Status: $${STATUS}"
        if [ "$${STATUS}" != "200" ]; then
          echo "ERROR: $${URL}/sandbox.html returned $${STATUS} (expected 200)" >&2
          exit 1
        fi

timeout: 600s
