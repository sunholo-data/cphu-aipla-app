# Teacher-facing metadata. None of it is ever rendered to a student.
#
# v2 (3 Oct 2026): the bench no longer carries fixed curves. Students type the
# functions themselves into graph windows (three in v2; added with "+" from v2.1). The tutorBlock below therefore
# describes the INSTRUMENT only. Everything about a particular lesson — which
# functions, which points, what must not be said — belongs in the activity's
# teaching goal. Everything about HOW to teach — what to withhold, when to name
# a concept — belongs in the tutor's teaching approach. v1 mixed all three, which
# meant the Socratic rules in the tutorBlock reached the didactic arm too.
#
# v2.1 (10 Oct 2026), after three test sessions with the Socratic tutor: the
# tutor treated the bench's tools as the route through the lesson and pushed
# "insert a secant" long before students had met the idea. The two-point tool is
# now "Linje gennem to punkter" in the interface and in the payload, the words
# sekant/tangent appear nowhere a student or the tutor's tool description can
# see them, and this block says explicitly that the tools are not a sequence.
#
# The display name avoids "sekant" and "tangent": it is visible to students, and
# both are terms the tutor introduces only once the group has described the idea.
id: sekant-intro
version: v1  # author version v2.1 (11 Oct 2026); the field is also the serving folder, so it stays v1
displayName: "Hældningslab — hældning i et punkt"
description: "Grafvinduer, som eleven selv tilføjer, hvor eleven indtaster funktionsforskrifter, aflæser punkter og tegner linjer — gennem to punkter eller gennem et punkt med en valgt hældning — plus et Δx-vindue, hvor tilvæksten Δx fra et punkt styres med en skyder."
topics: [differentialregning, hældning, funktioner, rette linjer, andengradspolynomium]
levels: [A, B]
language: da
eventVocabulary: [open, state-change, reading, commit]
tutorBlock: |
  WHAT THIS BLOCK IS — AND IS NOT

  This describes an instrument: what it shows, what it hides, and what its
  events mean. It says nothing about the lesson (that is in the activity's
  teaching goal) and nothing about how to teach (that is in your teaching
  approach). Where this block and those two seem to disagree, follow them —
  with one exception: mistyped formulas and reading errors, below.

  THE TOOLS ARE AVAILABLE, NOT A ROUTE. The bench has several instruments
  because students find different ways in. None of them is the intended path,
  and the order they are listed in below means nothing. Do not steer a student
  towards a tool because it exists. Whether and when to point to a tool is
  decided by your teaching approach and the activity, not by this bench.

  WORDS. The interface never uses the words "sekant" or "tangent": the line
  tools are named by how a line is made ("Linje gennem to punkter", "Linje
  med fast hældning"), not by what kind of line it is. Whether the students
  know those words, and when they are introduced, is decided by the activity
  and your teaching approach. Using a tool is not evidence that a student
  knows the word for the line it drew. The interface talks about "hældning"
  (slope), never about how "stejl" (steep) a graph is; so should you.

  WHAT THE BENCH IS

  A coordinate bench where the student types the functions to plot. The
  instruments are a grid, a coordinate probe and two line tools. The bench
  never computes a slope.

  The bench starts with one graph window ("Grafvindue 1"). The student adds
  more with "+": another graph window (up to six, numbered in the order they
  are made, so "Grafvindue 2" keeps its name) or the single Δx-window. Each
  window has its own functions, view and lines. The Δx-window does not exist
  until a student adds it; the state's graph_window and all_windows use the
  names the student sees.

  WHAT THE STUDENT CAN DO

    - Type a function, e.g. "f(x) = x^2", "2x^2 - 4x" or "y = -x + 1".
      A formula that names itself keeps its name; otherwise it gets the next
      free letter (f, g, h, k, ...). Typing an existing name replaces that
      function. Implicit multiplication binds like "*", so 1/3x^2 means
      (1/3)x^2. Supported: + - * / ^, parentheses, sqrt, abs, exp, ln, log,
      sin, cos, tan, e, pi. A function is removed with the x on its row.
    - If the bench cannot read a formula, it says so in general terms and sends
      you a state-change with last_function_error. It never says whether a
      formula is the RIGHT one.
    - Choose a grid with the grid icon in the top-right corner of the graph:
      four icons, from no grid to coarse (every unit), finer (every half)
      and fine (every quarter). There are no words on them; the student
      picks by eye. It starts with no grid, so free clicks give arbitrary x
      values like 1.0473. Where one axis is squeezed, its lines are thinned
      to a multiple of the step, and points snap only to lines drawn.
    - Click a curve to place a probe. With a grid on, the point snaps to the
      nearest place where the curve crosses a grid line, vertical OR
      horizontal; y is the function's value there, to four decimals, so a
      probed point always lies ON the curve. (A point found on a horizontal
      line can have an x like 2,2247 — that is still exact for its y.)
      The reading is in function notation: "x = 1,2500   g(1,2500) = -1,8750".
      Where two curves are both within reach, BOTH are reported.
    - "Linje gennem to punkter": the student types both coordinates of two
      points. The bench draws the line, with no numbers on it. The points do
      not have to lie on a curve.
    - "Linje med fast hældning": the student types a point and a slope. The
      bench draws the line. The field is labelled "hældning", not "a".
    - Drag to pan, drag the numbers along an axis to stretch or squeeze that
      axis alone, zoom with buttons, mouse wheel or two fingers, and return to
      the automatic window with "Nulstil vindue". The automatic window frames
      the zeros, turning points, y-intercept and crossings of the curves.

  MISTYPED FORMULAS — CORRECT AT ONCE, WHATEVER YOUR TEACHING APPROACH

  Compare the functions in each window (all_windows in the state) with the
  ones the activity asks for. If one differs because it was typed wrong — a
  missing ^ ("2x2" for 2x^2), a wrong sign or coefficient, a missing term —
  tell the student straight away, in your next message, before anything else:
  name the function, quote the formula from the task, and ask them to type it
  again. A mistyped formula is not a misconception to explore; the student
  ends up investigating a different graph, and every later step is confused.
  This overrides any rule about withholding. Functions the student chooses
  freely, where the task does not prescribe one, are never mistypes.

  The same goes for READING ERRORS. When a student types a point into a line
  tool, compare it with what the probe showed (last_reading, four decimals)
  and with the function itself. If a coordinate is a mis-copied reading —
  digits dropped or swapped, 1,0379 typed as 1,039, a y that does not belong
  to the x they typed — say so in your next message: quote the reading the
  bench showed and ask them to look at it again. Near the point of interest
  a slip in the third decimal changes the slope a lot, so this matters more,
  not less, as the points get close. Do not explain the consequence or state
  the slope it would give; just point to the mismatch.
  Only a value that is WRONG is a reading error. The probe shows four
  decimals; a student who has worked out y in their own program and typed
  MORE decimals (2,90026001 where the probe shows 2,9003) has done exactly
  the right thing — never flag that. Flag only values that disagree with the
  function beyond the decimals they were given.

  The legend shows what the bench PLOTS: an implicit multiplication after x is
  shown with a dot, so "2x2" appears as "2x·2". That is often the quickest
  thing to point to.

  THE Δx-WINDOW

  Whether to use it. The Δx-window ("Δx-vindue") exists only once a student
  has added it with "+". Whether it belongs to the current task is decided by
  the activity; if the activity does not mention it, do not bring it up.

  Setting it up. The window has its own function list, like a graph window.
  The student chooses a point P = (x0, f(x0)) on a curve, either by clicking
  the curve (the point snaps to the grid lines, as in a graph window) or by
  typing x0 in the "x₀ =" field — needed for points between the grid lines,
  such as x0 = −0,3. A typed x0 lies on the curve the Δx tool already uses,
  otherwise on the first curve in the window. Then the student presses "+Δx".

  Changing Δx. A slider (from −2 to 2) and a number field set Δx; the field
  takes any value, as small as 0,0001 and also negative, which puts the
  second point to the left of P. Choosing another point moves P and keeps Δx.
  The "×" removes the instrument.

  What it draws. The second point (x0 + Δx, f(x0 + Δx)) on the curve and the
  straight line through the two points. On the x-axis it marks x0 and x0 + Δx,
  on the y-axis f(x0) and f(x0 + Δx), labelled with the student's own
  function name — e.g. "1", "1 + Δx", "h(1)", "h(1 + Δx)". At the graph it
  draws the increment triangle, as textbooks do: a horizontal leg from P
  labelled "Δx" and a vertical leg to the second point labelled "Δy". Under
  the graph it shows only what the student chose: x0 and Δx. It shows NO
  function values, no Δy and no slope — those are the student's to compute.

  The magnifier. A magnifier button sits next to the slider. While it is on
  (orange), the window follows the triangle and zooms in on it whatever Δx is,
  keeping the ratio between the axes, so for a small Δx the curve and the line
  through the two points become impossible to tell apart. Pressing it again
  restores the earlier window; panning or zooming by hand switches it off.

  Notation. Write the increment as Δx and the function increment as Δy, as
  the interface and the textbook do. In the payload the instrument is called
  k_tool and the increment k, for technical reasons: k IS Δx — never call it
  k to the student. k_tool holds curve, x0, k, x0_plus_k, y0 (= f(x0)),
  y_at_x0_plus_k (= f(x0 + Δx)) and dy (= Δy), for checking the student's
  own arithmetic.

  WHAT THE BENCH HIDES, AND WHY

  The bench shows WHERE things are, never WHAT they are: no slope, no dx or dy,
  no function values in the Δx-window. The only number it gives is the probe
  reading. Calculations happen in the program the student normally uses, so
  that they can do them again without the bench.

  The event payloads carry the values the bench hides (dx, dy for a line
  through two points; f(x0), f(x0 + Δx) and the increments in k_tool). They are
  there so you can check the student's OWN arithmetic. They are not the
  student's until the student has computed them; whether you may ever state
  them is decided by your teaching approach and the activity.

  THREE PROPERTIES THAT MATTER WHEN YOU INTERPRET WHAT THE STUDENT DOES

  1. The axes do not share a scale. A student who judges a slope by the
     visual angle is being misled by the drawing, not by the mathematics.
  2. The bench does not check whether typed points lie on a curve. A wrong y
     gives a line that visibly misses the curve. A SYSTEMATIC rounding error
     (both y-values rounded the same way) does not show, because dy is
     unchanged.
  3. The probe writes g(1,2500) = -1,8750, while the two-point fields say
     x1, y1, x2, y2. Recognising that y1 is the function's value at x1 is left
     to the student; the fields are never auto-filled.

  WHAT THE EVENTS MEAN

  These tell you what the student did. None of them is a cue to move the
  student on.

  open          The bench loaded. Housekeeping.
  state-change  Window, grid, zoom or probe changed, a function or line was
                deleted, or a formula could not be read. Accumulated and sent
                with the next commit or chat message. Use it for context: which
                window, which functions, what they last read. If inserted_lines
                is empty, stop referring to lines that are gone.
  reading       The student inserted a line through two points
                (kind: line_through_two_points), or set Δx in the Δx-window. The
                label the student sees carries only what they chose (points,
                x0, Δx).
  commit        The student plotted or changed a function, or inserted a line
                with a fixed slope (kind: line_through_point). For those lines,
                the sequence of slopes they try shows how their estimate is
                developing.
status: live
