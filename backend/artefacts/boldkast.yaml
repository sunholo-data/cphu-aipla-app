id: boldkast
version: v1
displayName: "Boldkast — projektilbevægelse"
description: "Interaktiv simulation af projektilbevægelse: eleven varierer udgangsvinkel og starthastighed og aflæser rækkevidden."
topics:
  - kastebevægelse
  - kinematik
levels:
  - B
  - C
language: da
# MOBILE-1 (2026-08-13): deliberately no minViewportPx. Boldkast is the one
# artefact written mobile-first — single-column by default with `min-width`
# media queries adding columns as room appears — and it audits clean at 390px.
# It is the reference for what a phone-ready sim looks like.
eventVocabulary:
  - play
  - pause
  - reset
  - show_value
  - state-change
# PLACEHOLDER — AR to refine (1.1.41 M0 gate). Artefact-intrinsic only: what the
# sim is + what its events mean. NOT the per-activity lesson goal.
tutorBlock: |
  Eleven arbejder med en simulation af projektilbevægelse. De kan ændre
  udgangsvinkel og starthastighed og se den resulterende bane og rækkevidde.
  Når du ser hændelsen 'show_value', har eleven afsløret et facit — spørg
  ind til deres ræsonnement i stedet for at bekræfte tallet.
status: live
