id: kinebot
version: v1
displayName: "KineBot — kinematics & motion graphs"
description: "Interactive kinematics: the student sets motion parameters and reads position/velocity/acceleration graphs."
topics:
  - kinematics
  - motion-graphs
levels:
  - B
  - C
language: en
# MOBILE-1 (2026-08-13): usable on a phone but degraded — the motion scene is
# wider than 390px so the far end of the ruler clips, and the mode tabs need a
# horizontal scroll. Controls, sliders and readouts all lay out correctly, so
# this is a "you will be scrolling" warning, not a "do not bother".
minViewportPx: 480
eventVocabulary:
  - play
  - step
  - advance
  - spectrum
  - fit
  - reset
  - state-change
# PLACEHOLDER — AR to refine (1.1.41 M0 gate). Artefact-intrinsic only.
tutorBlock: |
  The student is working with a kinematics simulation that shows
  position/velocity/acceleration graphs for motion they configure. When you see
  'step'/'advance', the student has moved the motion forward — ask them to
  predict the next graph segment before it appears, rather than describing it
  for them.
status: live
