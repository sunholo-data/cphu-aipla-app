displayName: "Sol, Jord og Måne"
description: "3D-model af Sol, Jord og Måne med rigtig astronomi: eleven skifter udsigtspunkt, skala og tid og løser fem missioner om døgn, årstider, månefaser, formørkelser og modellers skala."
topics:
  - astronomi
  - døgn
  - årstider
  - månefaser
  - formørkelser
  - modeller og skala
levels:
  - A
  - B
  - C
# Author-supplied (author I, 2026-09-24), Danish-only by recorded decision in the
# artefact header — ~2000 lines of Danish UI; a strings-object extraction is a
# follow-up. `da` is also the fallback.
language: da
# Deliberately no minViewportPx: verify_sim.mjs reports no horizontal overflow at
# 390px (2026-09-24), and the author built the panels to collapse on a phone.
eventVocabulary:
  - open
  - mission-start
  - prediction-commit
  - checkpoint
  - answer-commit
  - quiz-record
  - view-record
