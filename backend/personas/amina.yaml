# Seventh persona (1.1.91 TUTOR-4) — added so the catalogue can carry one tutor
# per teaching framework. Six personas, seven frameworks; this is the seventh.
#
# The gap it fills is a real one rather than a headcount: no existing persona
# leads DISCUSSION as their register. Jonas asks and waits, which is close, but
# his is a one-to-one question. This one runs the multivoiced classroom — asks
# questions she does not know the answer to, and builds the next move out of
# what students actually said. That is Dysthe's authentic question and uptake,
# which is why Authentic Dialogue is the framework proposed for her.
#
# Writing is deliberately in the title. Dysthe's book is "The Multivoiced
# Classroom: Interactions of Writing and Classroom Discourse" — the framework
# is about talk AND writing together, and a persona who only talked would be
# half of it. `skrivevejleder` is a real Danish gymnasium role.
