# POE — Predict–Observe–Explain (1.1.91 M5, second wave).
#
# ── Grounded in the source itself, 2026-09-10 ────────────────────────────────
# Three constructs, one per letter. Behaviours come from the paper's own task
# wording — Liew & Treagust print their POE items verbatim ("Predict what will
# happen … State and explain the reason(s) for your prediction", "Compare your
# observation with your prediction. Are they in agreement or disagreement?") —
# and from the instructional-strategy sections describing how the sequence was
# run with the grade-11 class.
#
# ⚠️ The paper's task has FOUR numbered steps, not three: prediction, observation,
# comparison, then group discussion in which students write their final reasons.
# The comparison and the discussion are both folded into `explain` here, because
# that is the phase the acronym names and splitting them would invent a stage the
# framework does not have. The discussion behaviours are marked as such below.
#
# The finding that matters most for a TUTOR is not the sequence — it is that
# prediction contaminates observation. One student "tended to observe or focus on
# the aspect of the experiment that supported his prior or pre-conceived reason
# and expectation. He tended to see what he wanted to see." So a tutor must not
# assume the student saw the intended outcome, even when the demonstration was
# designed to be unambiguous, and must ask what they observed rather than
# confirming what they should have.
#
# The second is the framing: "students were told that this was not a test, and
# their views were requested". A prediction given to be marked is not a
# prediction, and the whole diagnostic value collapses if the student is
# guessing at the expected answer instead of stating what they believe.
#
# No `dimension` tags — that axis is Duschl's by way of Ruiz-Primo & Furtak.
id: poe
label: Predict-Observe-Explain (POE)
layer: tp_cycle
status: ready_for_review
summary: >
  Before a demonstration or experiment, the student commits to a prediction AND
  the reasoning behind it; then observes and describes what actually happened,
  with reasons; then compares the two and explains the gap. Its purpose is
  diagnostic — Liew & Treagust found it surfaces ideas contrary to the
  scientific account even among top-performing students who had already been
  taught the topic. Two cautions from their data: observations are not uniform
  even for a demonstration designed to be unambiguous, because students see what
  their prediction primed them to see; and the tasks only capture that range
  when worded open-endedly, without a menu of possible answers to pick from.
provenance:
  - citation: >
      Liew, C.-W. & Treagust, D. F. (1998). The Effectiveness of
      Predict-Observe-Explain Tasks in Diagnosing Students' Understanding of
      Science and in Identifying Their Levels of Achievement. Paper presented at
      the Annual Meeting of the American Educational Research Association,
      San Diego, 13–17 April 1998. ERIC ED420715.
    vouchedBy: M
    note: >
      PRIMARY source, read in full 2026-09-10 from the parsed paper in
      docs/literature/tp-framework/. Behaviours follow the POE task items the
      paper prints verbatim; the see-what-you-predicted finding is from the
      salt-in-oil phase, the pre-instructional-ideas finding from the light-globe
      phase with grade-12 students. The catalogue row previously carried the
      ERIC accession number alone, with no authors, title or year.
  - citation: >
      White, R. & Gunstone, R. (1992). Probing Understanding. London: Falmer Press.
    vouchedBy: M
    note: >
      ORIGIN of the POE sequence — Liew & Treagust attribute it here ("the POE
      learning/teaching sequence … explained in detail in White and Gunstone
      (1992)"). Read from this paper's citation and reference list; the book is
      not held in the AIPLA corpus.
constructs:
  - name: predict
    summary: >
      The student states what will happen and why, before anything is observed.
      The reason matters more than the prediction — it is the prior conception,
      and it is what the rest of the sequence is diagnosing. Liew & Treagust
      framed the task explicitly as not a test, and asked for the student's view
      rather than the right answer.
    behaviours:
      - Describe the setup fully, then ask what will happen before anything is run.
      - Ask for the reason behind the prediction in the same breath as the prediction.
      - Say plainly that this is not a test and that you want their view, not the textbook's.
      - Ask the question open-endedly, with no list of possible answers to choose between.
      - Get the prediction committed to and recorded before proceeding.
      - Accept a prediction you know to be wrong without correcting it yet.
    avoid:
      - Offering a multiple-choice of outcomes — the paper found open wording is what captures the real range.
      - Signalling which prediction is expected, by wording or by reaction.
      - Correcting the prediction before the observation has happened.
      - Moving on when the student gives a prediction with no reason attached.
    evaluationHint: >
      Did the student give a REASON, and is it theirs? A prediction with no
      reasoning diagnoses nothing, and a reason that reproduces the textbook
      suggests the student is answering the tutor rather than stating what they
      believe — the failure the "this is not a test" framing exists to prevent.
  - name: observe
    summary: >
      What the student actually saw, described in their own words, with reasons
      for that observation. The paper's central caution belongs here: uniform
      observation "cannot be always assumed by the designer", because a student
      focuses on the aspect that supports the prediction they just committed to.
    behaviours:
      - Ask what they observed, openly, before saying anything about what should have happened.
      - Ask for their reasoning about the observation as well as the observation itself.
      - Take an unexpected observation seriously as data rather than as a mistake.
      - Ask what specifically they were looking at when they saw it.
      - Where the observation is genuinely ambiguous, say so rather than resolving it for them.
    avoid:
      - Telling the student what they observed, or confirming the intended outcome before they have described one.
      - Assuming the student saw what the demonstration was designed to show.
      - Treating an observation that conflicts with the expected one as an error to correct on the spot.
    evaluationHint: >
      Is the observation the student's own, and does it differ from the
      prediction anywhere? The interesting case is when a student reports seeing
      what they predicted rather than what happened — that is the paper's
      "tended to see what he wanted to see", and it is invisible unless the tutor
      asked openly.
  - name: explain
    summary: >
      Compare prediction against observation, name whether they agree, and
      account for the difference. This is the conceptual-change moment: the
      student has to confront their own prior reasoning against something they
      themselves observed. The paper's fourth step — discussing with others and
      writing a final explanation — is included here.
    behaviours:
      - Ask directly whether the observation agreed with the prediction, and have them say which.
      - Where they disagree, ask the student to explain the difference rather than explaining it yourself.
      - Return to the reason they gave for the prediction and ask whether it still holds.
      - Ask what would have to be true for the observation to make sense.
      - Where the activity is group-based, put a classmate's explanation of the same event beside theirs and ask them to compare.
      - Ask for a final explanation in their own words once the discussion has run.
      - Ask them to state what they now think differently from when they predicted.
    avoid:
      - Supplying the scientific account as soon as a mismatch appears, which ends the conceptual change before it happens.
      - Letting an agreement between prediction and observation pass without asking why.
      - Settling a disagreement between students by ruling on it, where the activity is group-based.
      - Referring to what other students predicted when the student is working alone.
    evaluationHint: >
      Did the student revise a stated reason, or only their answer? Changing the
      conclusion while keeping the original reasoning is the outcome that looks
      like learning and is not — and the paper's grade-12 cohort, who had been
      taught the topic and still reasoned pre-instructionally, is the case in
      point.
