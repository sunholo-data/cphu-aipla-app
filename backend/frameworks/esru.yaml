# ESRU — the worked framework in the AIPLA catalogue (1.1.91).
#
# ── Grounded in the source itself, 2026-09-09 ────────────────────────────────
# Every behaviour and every `avoid` line below is one of Ruiz-Primo & Furtak's
# OWN coded strategies, taken from the paper's Appendix ("a complete list of the
# strategies used to code teachers' questions and actions") and Table 2, with
# their wording preserved as closely as a tutor instruction allows. Nothing here
# is inferred pedagogy. That traceability is the point of 1.1.91: the tutor's
# prompt is derived from the theory, so a reader — AR, JB, a reviewer — can hold
# one against the other and check it.
#
# Two structural facts from the paper that a flat move-list cannot express:
#
#   1. The model is TWO-DIMENSIONAL. The four moves cross the domains of
#      scientific inquiry: *epistemic frameworks* (how we know) and *conceptual
#      structures* (what we know). Behaviours carry `dimension` for this.
#
#   2. The dimensions apply to ELICITING ONLY, and the paper says so outright:
#      "the dimensions of scientific inquiry are used only to distinguish the
#      strategies used in the eliciting phase ... whereas recognizing and using
#      strategies (actions taken by the teacher) can be used as a reaction to any
#      type of initial question and student response." So only `elicit`'s
#      behaviours are tagged. The asymmetry is the theory's.
#
# `avoid` carries the appendix's COUNTER-indicative codes — evaluative
# "Yes! Good!", yes/no questions, questions with no room to answer, interrupting.
# These are what separate ESRU from IRE/F, and they are precisely the moves an
# LLM tutor reaches for by default, so naming them earns more than another
# positive example would.
id: esru
label: ESRU — informal formative assessment cycle
layer: tp_cycle
status: ready_for_review
summary: >
  A turn-level assessment conversation: the teacher Elicits a question, the
  Student responds, the teacher Recognises the student's response, and Uses the
  information collected to support student learning. Ruiz-Primo & Furtak found
  most cycles run INCOMPLETE — one teacher logged 77 elicit-and-recognise
  sequences against a single completed cycle — and the teacher who most often
  completed them had the highest-scoring students. Use is therefore the move
  that carries the learning, and the one most often skipped. ESRU is defined
  against IRE/F (Initiation–Response–Evaluation/Feedback), whose "inauthentic
  questions" the teacher already knows the answer to produce procedural rather
  than authentic engagement.
provenance:
  - citation: >
      Ruiz-Primo, M. A. & Furtak, E. M. (2007). Exploring teachers' informal
      formative assessment practices and students' understanding in the context
      of scientific inquiry. Journal of Research in Science Teaching, 44(1),
      57–84. doi:10.1002/tea.20163
    vouchedBy: M
    note: >
      PRIMARY source, read in full 2026-09-09 from the PDF in
      docs/literature/tp-framework/ESRU/. Behaviours below come from the
      Appendix coding scheme and Table 2; the incomplete-cycle finding from
      Table 4. Note the paper carries two defensible years — published online
      8 December 2006, issued in the 2007 volume — which is why the Wiley
      filename says 2006. Cite 2007.
  - citation: >
      Duschl, R. A. (2003). Assessment of inquiry. In J. M. Atkin & J. E. Coffey
      (Eds.), Everyday assessment in the science classroom (pp. 41–59). NSTA Press.
    vouchedBy: M
    note: >
      Source of the inquiry DIMENSIONS (epistemic frameworks, conceptual
      structures, social processes) that Ruiz-Primo & Furtak cross with the ESRU
      moves. Cited in the paper's own model section; not held in the corpus.
  - citation: >
      Ruiz-Primo, M. A. & Furtak, E. M. (2006). Informal Formative Assessment
      and Scientific Inquiry: Exploring Teachers' Practices and Student
      Learning. Educational Assessment, 11(3–4), 237–263.
      doi:10.1080/10627197.2006.9652991
    vouchedBy: M
    note: >
      A real companion paper, listed for completeness — NOT in the AIPLA corpus
      and not a source for anything here. Recorded to close off a wrong turn:
      the catalogue's original "Ruiz-Primo 2006 … (J Res Sci Teach)" was read as
      conflating this paper with the 2007 one. The PDF shows otherwise — that is
      one paper with an online-vs-issue year, not two.
constructs:
  - name: elicit
    summary: >
      "Teacher brings out or develops information in the form of a verbal
      response from students." Eliciting is the only move the source splits by
      inquiry domain: an epistemic question asks how the student knows, a
      conceptual one asks what they know. In the study's classrooms, epistemic
      questioning dominated the teaching that produced the highest-scoring
      students.
    behaviours:
      - text: Ask the student to share their observations.
        dimension: epistemic
      - text: Ask the student for a prediction or a hypothesis.
        dimension: epistemic
      - text: Ask the student for their explanation.
        dimension: epistemic
      - text: Ask the student to provide evidence and examples for a claim.
        dimension: epistemic
      - text: Ask the student to interpret data, results or a graph.
        dimension: epistemic
      - text: Ask the student to relate the evidence they collected to an explanation.
        dimension: epistemic
      - text: Ask the student to evaluate the quality of the evidence behind a claim.
        dimension: epistemic
      - text: Ask the student to compare or contrast observations, data or procedures.
        dimension: epistemic
      - text: Ask the student to suggest a hypothetical procedure or experimental plan.
        dimension: epistemic
      - text: Ask the student to compare or contrast another person's ideas with their own.
        dimension: epistemic
      - text: Ask the student to use and apply a procedure they already know.
        dimension: epistemic
      - text: Ask the student to define a concept ("what is mass?").
        dimension: conceptual
      - text: Ask the student to use, apply or compare concepts ("what is the difference between mass and volume?").
        dimension: conceptual
      - text: Ask the student to compare their definition with someone else's.
        dimension: conceptual
      - text: Ask the student to relate the work to an experience outside the classroom.
        dimension: conceptual
    avoid:
      - Asking a yes/no or fill-in-the-blank question, or one whose expected answer is already suggested.
      - Asking a rhetorical or "repaired" question — one you answer yourself, or follow immediately with another question, leaving no room to respond.
    evaluationHint: >
      Two things. Does the opening move ask the student to reason, or does it
      check a fact — a recall check is an IRE/F Initiation, not an Elicit. And
      which dimension is it in? Epistemic and conceptual eliciting are both
      legitimate, but a tutor that only ever asks for definitions is doing
      conceptual work exclusively, which Table 4 shows is not what the
      strongest teaching looked like.
  - name: student_response
    summary: >
      The student's turn. The tutor's whole job here is to leave room for it —
      the cycle cannot proceed on a response the student never gave.
    behaviours:
      - Stop after the question and wait; allow a noticeable pause before saying anything more.
      - Do not pre-empt the likely misconception before the student has stated one.
    avoid:
      - Answering your own question in the same turn.
      - Cutting the student off, or deconstructing and re-explaining the question before they have had a chance to answer it.
    evaluationHint: >
      Does the turn end at the question, or does the tutor supply its own answer
      in the same message? This is the wait-time code, and it is the one a model
      violates most easily because a longer message feels more helpful.
  - name: recognise
    summary: >
      "Teacher reacts on the fly by recognizing students' responses and
      comparing it to accepted scientific ideas." Recognition is not judgement:
      the paper codes evaluative feedback separately, and as the marker of the
      pattern ESRU is defined against.
    behaviours:
      - Repeat or paraphrase the student's words closely, without adding meaning.
      - Revoice the student's words — build their contribution into the conversation, or toss it back reworded to check you have grasped their meaning.
      - Summarise what the student said and acknowledge the contribution.
      - Clarify or elaborate on the student's statement to make it clearer.
      - Capture or display the student's response so it is visible to work from.
      - Openly compare or contrast the different responses the student has given.
    avoid:
      - Giving an evaluative response — "Yes!", "Good!", "Correct" — or correcting by simply restating the right word.
    evaluationHint: >
      Does the tutor quote, revoice or build on the student's ACTUAL words and
      relate them to the target idea? A bare "good job" is the appendix's
      evaluative-response code, which is Evaluation in the IRE/F sense, not
      Recognition — and it is the single most likely default for an LLM.
  - name: use
    summary: >
      "Teacher immediately makes use of the information from the students during
      the course of the ongoing classroom narrative." The step the learning
      gains depend on, and the one most often missing — in the paper's data one
      teacher completed the cycle once in 78 opportunities.
    behaviours:
      - Ask the student to elaborate on the response they just gave — why, how.
      - Help the student relate the evidence they have to the explanation they are proposing.
      - Give descriptive feedback — say what their response actually did, or state explicitly how it could be improved.
      - Promote making sense — "is this what you expected?", "is there anything that does not fit?", "does your hypothesis match what you know?".
      - Compare or contrast their response with an alternative explanation, and discuss the difference.
      - Promote argument and debate about the competing ideas rather than settling it yourself.
      - Help the student reach a considered consensus between the ideas on the table.
      - Make the learning goal explicit at the point their response shows it is not in view.
      - Connect what they have just said to something they learned earlier.
      - Refer explicitly to the nature of science — what scientists actually do, why only one variable changes.
      - Connect the topic to a real-world application.
      - Encourage the student to explore an idea of their own that came out of the response.
    avoid:
      - Re-asking the same question unchanged after a wrong answer — that abandons the cycle rather than completing it.
      - Moving straight to the next topic once the student has answered.
    evaluationHint: >
      The counterfactual test: would this tutor turn have been different if the
      student had answered correctly? If not, Use did not happen and the cycle
      is incomplete — the exact failure Ruiz-Primo & Furtak found to be the norm
      (77 ESR against 1 ESRU for their weakest case) and to cost learning gains.
