# ESRU — the one fully-worked framework in the M0 catalogue (1.1.91).
#
# Chosen first deliberately: ESRU is a TURN-LEVEL cycle, so it maps onto what a
# tutor does inside a single turn (promptable) AND its four moves double as
# 1.1.92's rubric labels (scoreable). 5E and POE are lesson-cycle structures
# spanning a whole activity; Accountable Talk / Authentic Dialogue / Toulmin are
# discourse-move frameworks and make the better second wave.
#
# ── Verified against the primary literature 2026-09-09 ────────────────────────
# Every behaviour below is traceable to Ruiz-Primo & Furtak's own operational
# definitions (the formal/informal table, 2007 p. 60) or to the ESRU-vs-IRE/F
# contrast they draw. That traceability IS the design: 1.1.91 makes a generated
# prompt reviewable by letting a reader check it against the theory. Behaviours
# that merely sound pedagogical would defeat that, so invented ones were removed
# in favour of the paper's own moves.
#
# Verified twice: first against the publisher record, then (2026-09-09) against
# the PDF itself once the corpus arrived on this machine.
#   1. Four moves confirmed verbatim from the abstract; the three-move gloss is wrong.
#   2. The year is an online-vs-issue artefact, not a wrong paper — see below.
#   3. ⚠️ INCOMPLETE: the paper's model is TWO-dimensional (moves x inquiry
#      dimension) and only the moves are modelled here. The epistemic/conceptual
#      split applies to ELICITING only, by the paper's own scoping. Table 2 lists
#      ~30 coded strategies; the behaviours below are a subset. See the README.
id: esru
label: ESRU — informal formative assessment cycle
layer: tp_cycle
status: ready_for_review
summary: >
  A turn-level assessment conversation: the teacher Elicits, the Student
  responds, the teacher Recognises the response against accepted scientific
  ideas, and Uses it in the ongoing narrative. Ruiz-Primo & Furtak found most
  teachers run INCOMPLETE cycles, and that it is the final step — Use — that
  learning gains depend on. So Use is the move a tutor most often skips and the
  one worth measuring. ESRU is explicitly contrasted with IRE/F (Initiation,
  Response, Evaluation/Feedback): the difference is that the teacher does
  something with the response rather than judging it.
provenance:
  - citation: >
      Ruiz-Primo, M. A. & Furtak, E. M. (2007). Exploring teachers' informal
      formative assessment practices and students' understanding in the context
      of scientific inquiry. Journal of Research in Science Teaching, 44(1),
      57–84. doi:10.1002/tea.20163
    vouchedBy: M
    note: >
      PRIMARY source for ESRU as used here — it names the cycle, sets out the
      four parts, and reports the Use finding. Verified 2026-09-09 against the
      publisher record (CU Boulder Experts) and STEM Teaching Tool #16, which
      brief is entirely about this paper.
  - citation: >
      Ruiz-Primo, M. A. & Furtak, E. M. (2006). Informal Formative Assessment
      and Scientific Inquiry: Exploring Teachers' Practices and Student
      Learning. Educational Assessment, 11(3–4), 237–263.
      doi:10.1080/10627197.2006.9652991
    vouchedBy: M
    note: >
      A real companion paper, listed for completeness — but NOT in the AIPLA
      corpus and not the source of anything here. Recorded to close off a wrong
      turn: the README's original "Ruiz-Primo 2006 … (J Res Sci Teach)" was read
      as conflating this paper with the 2007 one. Reading the actual PDF showed
      otherwise — JRST 44(1) was published ONLINE on 8 December 2006 and in the
      2007 issue, and Wiley named the file with the online year. One paper, two
      defensible years. The 2007 citation above is the one to use.
  - citation: >
      Duschl, R. A. & Gitomer, D. H. (1997). Strategies and challenges to
      changing the focus of assessment and instruction in science classrooms.
      Educational Assessment, 4, 37–73.
    vouchedBy: M
    note: >
      Lineage, not decoration — ESRU is Ruiz-Primo & Furtak's operationalisation
      of Duschl & Gitomer's "assessment conversation". Recorded because 1.1.91
      asks a framework to be defensible, and the antecedent is part of that.
constructs:
  - name: elicit
    summary: >
      "Teacher brings out or develops information in the form of a verbal
      response from students" (2007, p. 60).
    behaviours:
      - Ask the student to formulate an explanation, or to provide evidence for one — the paper's own two examples of eliciting.
      - Ask a question the student can answer from the work they have already done in this activity.
      - Ask one question per turn; do not stack.
    evaluationHint: >
      Does the opening move ask the student to explain or to give evidence, or
      does it merely check a fact? A recall check is an Initiation in the IRE/F
      sense, not an Elicit.
  - name: student_response
    summary: >
      The student's turn. The tutor's job is to leave room for it — the cycle
      cannot proceed on a response the student never gave.
    behaviours:
      - Stop after the question; do not answer it in the same turn.
      - Do not pre-empt the likely misconception before the student has stated one.
    evaluationHint: >
      Does the turn end at the question, or does the tutor supply its own answer
      in the same message?
  - name: recognise
    summary: >
      "Teacher reacts on the fly by recognizing students' responses and
      comparing them to accepted scientific ideas" (2007, p. 60). The paper's
      worked example is repeating or revoicing the student's response.
    behaviours:
      - Repeat or revoice the student's own words back to them — the paper's example move.
      - Compare what they said against the accepted scientific idea, and say where it sits relative to it.
      - Name a gap concretely ("you have the direction but not the sign"), not as a verdict — a bare judgement is the E of IRE/F, which ESRU is defined against.
    evaluationHint: >
      Does the tutor quote or revoice the student's actual words and relate them
      to the target idea? A generic "good job" is Evaluation, not Recognition.
  - name: use
    summary: >
      "Teacher immediately makes use of information from the students during the
      course of the ongoing classroom narrative" (2007, p. 60). The step the
      learning gains depend on, and the one most often missing.
    behaviours:
      - Ask the student to elaborate on the response they just gave.
      - Make the learning goal explicit at the point the response shows it is not yet in view.
      - Promote argumentation — ask them to justify the claim, or to weigh it against an alternative.
      - Do not re-ask the same question unchanged after a wrong answer; that closes the cycle without using it.
    evaluationHint: >
      The counterfactual test: would this tutor turn have been different if the
      student had answered correctly? If not, Use did not happen and the cycle
      is incomplete — the specific failure Ruiz-Primo & Furtak found to be
      common and to cost learning gains.
