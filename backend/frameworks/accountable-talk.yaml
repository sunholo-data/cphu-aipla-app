# Accountable Talk — the discourse-norms framework (1.1.91 M5, second wave).
#
# ── Grounded in the source itself, 2026-09-10 ────────────────────────────────
# The three constructs are the sourcebook's own three accountabilities, in its
# order, and the behaviours under each are its NAMED MOVES with the exemplar
# phrasings it prints — "Keeping everyone together: 'Who can repeat…?'",
# "Pressing for accuracy: 'Where can we find that?'", "Pressing for reasoning:
# 'Why do you think that?'", "Expanding reasoning: 'Take your time; say more.'"
# Nothing here is invented pedagogy; where a move is rephrased it is only to
# move it from a classroom to a one-to-one conversation.
#
# ⚠️ ⚠️ THE FIT QUESTION, and it is the biggest in this catalogue. Accountable
# Talk is a framework about talk among MANY people. Accountability to the
# learning community is built out of moves that presuppose a group — "Did
# everyone hear what she just said?", "Can you repeat what he said in your own
# words?", "Who wants to add on?" — and its purpose is to make students address
# one another as members of one thinking community. A tutor in a one-to-one chat
# has no community. That is a real limit, not a wrinkle to smooth over.
#
# The behaviours below handle it by pointing those moves at the two things that
# DO exist in an AIPLA conversation: the student's own earlier turns, and — where
# the activity is group-based — their actual classmates, whom the tutor can send
# them to rather than substituting for. What is NOT done is to keep the classroom
# phrasing and let a tutor refer to classmates who are not there.
#
# ⚠️ For AR/JB, and it should be decided before this framework is used as a
# research arm: whether accountability to the learning community is measurable
# at all in a 1:1 tutor, or whether this framework should only ever be assigned
# to group activities. Recorded as an open question rather than resolved here,
# because it is a pedagogical judgement and not mine.
#
# Wait time (Rowe) is the other move that does not survive the medium intact. In
# a classroom it is silence; in a chat the student answers when they answer, so
# there is nothing to hold. Its content survives as the tutor's restraint — do
# not answer your own question, do not fill the turn, do not front-load the
# thing the student was about to work out. That is where it sits below.
#
# No `dimension` tags — that axis is Duschl's by way of Ruiz-Primo & Furtak.
id: accountable-talk
label: Accountable Talk
layer: tp_cycle
status: ready_for_review
summary: >
  Talk that does academic work is accountable in three directions at once: to
  the learning community, so contributions are heard, understood and built on;
  to accurate knowledge, so claims are specific, sourced and checkable rather
  than whatever comes to mind; and to rigorous thinking, so claims are linked to
  evidence in an argument that holds. The sourcebook's contribution is that each
  accountability comes with concrete, named teacher moves and the words to say
  them. Its standard for evidence is not merely accuracy — evidence must also be
  sufficient, credible, relevant, and the claim qualified to match it — and it
  notes those standards differ by discipline.
